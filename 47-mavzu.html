<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>47-mavzu. To'la ichki qaytish</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--fg:#1b2333;--mut:#5a6579;--ac:#1d5fd6;--bd:#d5dcea;--ok:#15803d;--no:#b91c1c;--fm:#e9f1ff;--wr:#b45309}
[data-theme=dark]{--bg:#0a0f1d;--card:#141b2e;--fg:#e6ebf5;--mut:#9aa6bd;--ac:#6aa8ff;--bd:#2a3452;--ok:#4ade80;--no:#f87171;--fm:#192444;--wr:#fbbf24}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
.top{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--bd)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px}
h1{font-size:1rem;margin:0;line-height:1.25}
h1 small{display:block;font-weight:400;color:var(--mut);font-size:.78rem}
button,select{font:inherit;color:var(--fg)}
button{cursor:pointer}
.tb{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 10px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;white-space:nowrap}
nav button.on,.sub button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:820px;margin:0 auto;padding:12px}
.panel{display:none}.panel.on{display:block}
h2{font-size:1.2rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:1rem;color:var(--ac)}
.card p{margin:6px 0}
.fm{border:2px solid var(--ac);background:var(--fm);border-radius:10px;padding:10px;margin:8px 0;text-align:center;font-size:1.1rem;font-weight:600;overflow-x:auto}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:center}
th{background:var(--fm)}
canvas{display:block;width:100%;height:auto;background:#0f172a;border-radius:10px}
label{display:block;margin:8px 0 2px;font-size:.93rem}
input[type=range]{width:100%;margin:2px 0}
select,input[type=text]{width:100%;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{border:0;background:var(--ac);color:#fff;border-radius:8px;padding:8px 14px}
.btn.g{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.btn:disabled{opacity:.5;cursor:default}
.st{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--fm);border-left:5px solid var(--bd);font-weight:600}
.st[data-k=ref]{border-left-color:#38bdf8}.st[data-k=lim]{border-left-color:#fb923c}.st[data-k=tir]{border-left-color:#ef4444}.st[data-k=ok]{border-left-color:#22c55e}
.sub{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.sub button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:6px 12px}
.sp{display:none}.sp.on{display:block}
.res{margin-top:8px;font-weight:600}.res.ok{color:var(--ok)}.res.no{color:var(--no)}
.pr{display:flex;gap:8px;align-items:center;margin-top:6px}.pr input{flex:1}
ol.steps{padding-left:20px;margin:6px 0}
ol.steps li{margin:4px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--bd);background:var(--card);border-radius:8px}
.opt.c{border-color:var(--ok);background:rgba(34,197,94,.18)}.opt.w{border-color:var(--no);background:rgba(239,68,68,.18)}
.note{font-size:.85rem;color:var(--mut)}
</style>
</head>
<body>
<div class="top">
<header>
<h1>9-sinf fizika · 47-mavzu<small>To'la ichki qaytish</small></h1>
<button class="tb" id="thm">🌙 To'q</button>
</header>
<nav id="nav"></nav>
</div>
<main id="main"></main>

<script>
const $=s=>document.querySelector(s),D=Math.PI/180,W=480,H=320;
const f=(x,d=2)=>Number(x).toFixed(d).replace('.',',');
const col=n=>n<1.2?'air':n<1.4?'water':n<1.6?'glass':'dia';
const FILL={air:null,water:'rgba(56,189,248,.40)',glass:'rgba(134,239,172,.42)',dia:'rgba(200,228,255,.42)'};
const NAME={air:'havo',water:'suv',glass:'shisha',dia:'olmos'};
const regs=[],anims=[];

/* ---------- canvas yordamchilari ---------- */
function line(c,x1,y1,x2,y2,cl,w,dash){c.save();c.strokeStyle=cl;c.lineWidth=w;c.setLineDash(dash||[]);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore()}
function txt(c,s,x,y,cl,sz,al){c.save();c.fillStyle=cl||'#e2e8f0';c.font=(sz||14)+'px system-ui,sans-serif';c.textAlign=al||'left';c.fillText(s,x,y);c.restore()}
function arc(c,x,y,r,a1,a2,cl){c.save();c.strokeStyle=cl;c.lineWidth=2;c.beginPath();c.arc(x,y,r,a1*D,a2*D);c.stroke();c.restore()}
function bg(c){c.fillStyle='#0f172a';c.fillRect(0,0,W,H)}
function poly(c,pts,p,al,w){
  if(p<=0)return pts[0];let T=0;
  for(let i=1;i<pts.length;i++)T+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  let rem=T*p,last=pts[0];
  c.save();c.lineCap='round';c.lineJoin='round';c.globalAlpha=al==null?1:al;
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);
    if(rem>=l){c.lineTo(b[0],b[1]);rem-=l;last=b}
    else{last=[a[0]+(b[0]-a[0])*rem/(l||1),a[1]+(b[1]-a[1])*rem/(l||1)];c.lineTo(last[0],last[1]);break}
  }
  c.strokeStyle='rgba(250,204,21,.28)';c.lineWidth=(w||3)+5;c.stroke();
  c.strokeStyle='#facc15';c.lineWidth=w||3;c.stroke();c.restore();return last;
}
function dot(c,p,r){if(!p)return;c.save();c.fillStyle='#fff';c.beginPath();c.arc(p[0],p[1],r||4,0,7);c.fill();c.restore()}

/* ---------- Snellius sahnasi: n1 (pastda) -> n2 (tepada) ---------- */
function scene(c,o){
  const n1=o.n1,n2=o.n2,a=o.a,p=o.p==null?1:o.p,Ox=W/2,Oy=H/2,L=130;
  bg(c);
  const k1=col(n1),k2=col(n2);
  if(FILL[k2]){c.fillStyle=FILL[k2];c.fillRect(0,0,W,Oy)}
  if(FILL[k1]){c.fillStyle=FILL[k1];c.fillRect(0,Oy,W,H-Oy)}
  line(c,0,Oy,W,Oy,'#9ca3af',2.5);
  line(c,Ox,Oy-L-12,Ox,Oy+L+12,'#e2e8f0',1.5,[4,5]);
  txt(c,'normal',Ox+6,Oy-L-16,'#cbd5e1',12);
  txt(c,`n₁=${f(n1)} (${NAME[k1]})`,8,H-10);
  txt(c,`n₂=${f(n2)} (${NAME[k2]})`,8,20);
  txt(c,`α = ${f(a,1)}°`,W-8,H-10,'#facc15',14,'right');
  const sa=Math.sin(a*D),ca=Math.cos(a*D),sb=n1*sa/n2;
  if(o.mark!=null){const mx=Ox-L*Math.sin(o.mark*D),my=Oy+L*Math.cos(o.mark*D);line(c,Ox,Oy,mx,my,'#fb923c',1.5,[6,5]);txt(c,'α₀',mx-22,my+4,'#fb923c',13)}
  let k,b=null;
  if(sb>1.004)k='tir';else if(sb>=0.996){k='lim';b=90}else{k='ref';b=Math.asin(sb)/D}
  const t1=Math.min(1,p*2),t2=Math.max(0,p*2-1);
  poly(c,[[Ox-L*sa,Oy+L*ca],[Ox,Oy]],t1);
  if(k!='tir'){const bb=b*D;poly(c,[[Ox,Oy],[Ox+L*Math.sin(bb),Oy-L*Math.cos(bb)]],t2)}
  poly(c,[[Ox,Oy],[Ox+L*sa,Oy+L*ca]],t2,k=='tir'?1:.35);
  if(a>3){arc(c,Ox,Oy,38,90,90+a,'#e2e8f0');txt(c,'α',Ox-38*Math.sin(a*D/2)-14,Oy+38*Math.cos(a*D/2)+10,'#e2e8f0',13);
    arc(c,Ox,Oy,52,90-a,90,'#e2e8f0');txt(c,'α′',Ox+52*Math.sin(a*D/2)+2,Oy+52*Math.cos(a*D/2)+14,'#e2e8f0',13)}
  if(k=='ref'&&b>3){arc(c,Ox,Oy,46,-90,-90+b,'#e2e8f0');txt(c,'β',Ox+46*Math.sin(b*D/2)+4,Oy-46*Math.cos(b*D/2)-4,'#e2e8f0',13)}
  const lab=k=='ref'?`Sinish β=${f(b,1)}°`:k=='lim'?'Chegara (β=90°)':'To\'la ichki qaytish';
  txt(c,lab,8,42,k=='ref'?'#7dd3fc':k=='lim'?'#fb923c':'#f87171',15);
  return {k,b};
}
const ST=r=>r.k=='ref'?`Sinish — β = ${f(r.b,1)}°`:r.k=='lim'?'Chegara holat — β = 90°, sinish nuri sirt bo\'ylab yo\'naladi':'To\'la ichki qaytish — nur to\'liq qaytdi (α = α′)';
const a0of=(n1,n2)=>n1>n2?Math.asin(n2/n1)/D:null;

/* ---------- optik tola ---------- */
function fiberScene(c,o){
  const x0=30,x1=450,yc0=165,hw=36,n1=o.n1,n2=o.n2,i=o.i,phi=o.phi,p=o.p==null?1:o.p;
  const th=Math.asin(Math.sin(i*D)/n1)/D,al=90-th-phi,a0=Math.asin(n2/n1)/D,ok=al>=a0;
  const bend=phi*1.3,yc=x=>yc0-bend*Math.sin(Math.PI*(x-x0)/(x1-x0));
  bg(c);
  const band=(h,fl)=>{c.beginPath();c.moveTo(x0,yc(x0)-h);for(let x=x0;x<=x1;x+=5)c.lineTo(x,yc(x)-h);for(let x=x1;x>=x0;x-=5)c.lineTo(x,yc(x)+h);c.closePath();c.fillStyle=fl;c.fill()};
  band(hw+16,'rgba(148,163,184,.32)');band(hw,FILL.glass);
  txt(c,`o'zak n₁=${f(n1)}`,8,H-26);txt(c,`qobiq n₂=${f(n2)}`,8,H-8,'#cbd5e1');
  txt(c,ok?'Signal o\'tdi':'SIGNAL YO\'QOLDI',W-8,20,ok?'#4ade80':'#f87171',15,'right');
  let d=th<0.5?1e9:hw/Math.tan(th*D);d=Math.max(20,d);if(!ok)d=Math.min(d,150);
  const tw=u=>{u=((u%4)+4)%4;return u<1?u:u<3?2-u:u-4};
  const pts=[[x0-60*Math.cos(i*D),yc(x0)+60*Math.sin(i*D)]];
  const xe=ok?x1:Math.min(x1,x0+d);
  for(let x=x0;x<=xe;x+=3)pts.push([x,yc(x)-hw*tw((x-x0)/d)]);
  if(!ok){const yh=yc(xe)-hw,b=Math.asin(Math.min(1,n1*Math.sin(al*D)/n2));pts.push([xe,yh],[xe+110*Math.sin(b),yh-110*Math.cos(b)])}
  dot(c,poly(c,pts,p),4);
  return {th,al,a0,ok};
}

/* ---------- prizma / brilliant uchun nur kuzatuvi ---------- */
function trace(P,n,pos,dir){
  const N=P.length,ed=[],cx=P.reduce((s,q)=>s+q[0],0)/N,cy=P.reduce((s,q)=>s+q[1],0)/N;
  for(let i=0;i<N;i++){const a=P[i],b=P[(i+1)%N];let nx=b[1]-a[1],ny=a[0]-b[0];const l=Math.hypot(nx,ny);nx/=l;ny/=l;
    if(nx*((a[0]+b[0])/2-cx)+ny*((a[1]+b[1])/2-cy)<0){nx=-nx;ny=-ny}ed.push({a,b,nx,ny})}
  let [x,y]=pos,[dx,dy]=dir,inside=false,tir=0;const pts=[[x,y]],hits=[];
  for(let it=0;it<14;it++){
    let best=null,bt=1e9;
    for(const e of ed){
      const ex=e.b[0]-e.a[0],ey=e.b[1]-e.a[1],den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)continue;
      const t=((e.a[0]-x)*ey-(e.a[1]-y)*ex)/den,u=((e.a[0]-x)*dy-(e.a[1]-y)*dx)/den;
      if(t>1e-6&&u>=-1e-9&&u<=1+1e-9&&t<bt){bt=t;best=e}
    }
    if(!best){pts.push([x+dx*4,y+dy*4]);break}
    x+=dx*bt;y+=dy*bt;pts.push([x,y]);hits.push([x,y,best.nx,best.ny]);
    let Nx=best.nx,Ny=best.ny;if(Nx*dx+Ny*dy>0){Nx=-Nx;Ny=-Ny}
    const ci=-(dx*Nx+dy*Ny),eta=inside?n:1/n,s2=eta*eta*(1-ci*ci);
    if(s2>1){dx+=2*ci*Nx;dy+=2*ci*Ny;tir++}
    else{const ct=Math.sqrt(1-s2),k=eta*ci-ct;dx=eta*dx+k*Nx;dy=eta*dy+k*Ny;inside=!inside;
      if(!inside){pts.push([x+dx*3,y+dy*3]);break}}
  }
  return {pts,tir,d:[dx,dy],hits};
}
function drawPoly(c,R,S,Cx,Cy,fl,st){
  c.beginPath();R.forEach((q,i)=>{const X=Cx+S*q[0],Y=Cy-S*q[1];i?c.lineTo(X,Y):c.moveTo(X,Y)});c.closePath();
  c.fillStyle=fl;c.fill();c.strokeStyle=st;c.lineWidth=2;c.stroke();
}
const rot=(P,r)=>P.map(([x,y])=>[x*Math.cos(r)-y*Math.sin(r),x*Math.sin(r)+y*Math.cos(r)]);
const P90=[[-1.2,-1.2],[-1.2,1.2],[1.2,-1.2]],P180=[[-0.9,1.5],[-0.9,-1.5],[0.6,0]],PBR=[[-0.8,0.9],[0.8,0.9],[1.5,0.2],[0,-1.5],[-1.5,0.2]];
function drawTrace(c,R,n,start,dir,S,Cx,Cy,p,fl,st){
  drawPoly(c,R,S,Cx,Cy,fl,st);
  const r=trace(R,n,start,dir),px=r.pts.map(q=>[Cx+S*q[0],Cy-S*q[1]]);
  r.hits.forEach(h=>line(c,Cx+S*(h[0]-h[2]*.5),Cy-S*(h[1]-h[3]*.5),Cx+S*(h[0]+h[2]*.5),Cy-S*(h[1]+h[3]*.5),'#e2e8f0',1.2,[3,4]));
  const e=poly(c,px,p);if(p<1)dot(c,e,4);return r;
}

/* ---------- animatsiya generatorlari ---------- */
const animSweep=(n1,n2)=>(c,t)=>{const a=Math.min(90,(t*9)%100);scene(c,{n1,n2,a,mark:a0of(n1,n2)})};
const animCases=cs=>(c,t)=>{const T=4.5,k=Math.floor(t/T)%cs.length,u=(t%T)/T,cs_=cs[k];
  scene(c,{n1:cs_.n1,n2:cs_.n2,a:cs_.a,p:Math.min(1,u*1.5),mark:a0of(cs_.n1,cs_.n2)});
  if(cs_.msg)txt(c,cs_.msg,W-8,42,cs_.cl||'#e2e8f0',13,'right')};
const animFiber=(n1,n2)=>(c,t)=>{const T=7,k=Math.floor(t/T)%2,u=(t%T)/T,phi=k?20:3;
  const r=fiberScene(c,{n1,n2,i:8,phi,p:Math.min(1,u*1.4)});
  txt(c,`egilish φ=${phi}° · α=${f(r.al,1)}° · α₀=${f(r.a0,1)}°`,W-8,42,'#e2e8f0',13,'right')};

/* ---------- interfeys qurish ---------- */
function simHTML(id){return `<canvas id="${id}_sc" width="${W}" height="${H}"></canvas><div id="${id}_sl"></div><div class="st" id="${id}_st"></div>`}
function animHTML(id){return `<canvas id="${id}_ac" width="${W}" height="${H}"></canvas><div class="row"><button class="btn" id="${id}_go">▶ Boshlash</button><button class="btn g" id="${id}_stop">⏸ To'xtatish</button><button class="btn g" id="${id}_rs">↺ Qayta boshlash</button></div>`}
function prHTML(id,q,u,h){return `<p>${q}</p><div class="pr"><input type="text" inputmode="decimal" id="${id}_in" placeholder="Javob"><span>${u||''}</span><button class="btn" id="${id}_ck">Tekshirish</button></div><div class="res" id="${id}_pr"></div>`}
function initSim(id,sl,draw,presets){
  $('#'+id+'_sl').innerHTML=sl.map(s=>s.sel?`<label>${s.label}<select id="${id}_${s.k}">${s.sel.map(o=>`<option value="${o[1]}">${o[0]}</option>`).join('')}</select></label>`
    :`<label>${s.label}: <b id="${id}_${s.k}_v"></b></label><input type="range" id="${id}_${s.k}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.val}">`).join('')
    +(presets?`<div class="row">${presets.map((p,i)=>`<button class="btn g" data-i="${i}">${p.l}</button>`).join('')}</div>`:'');
  const c=$('#'+id+'_sc').getContext('2d');
  const run=()=>{const v={};sl.forEach(s=>{const e=$('#'+id+'_'+s.k);v[s.k]=+e.value;const o=$('#'+id+'_'+s.k+'_v');if(o)o.textContent=f(+e.value,s.d==null?1:s.d)+(s.u||'')});
    const r=draw(c,v);const st=$('#'+id+'_st');st.dataset.k=r.k;st.innerHTML=r.t};
  sl.forEach(s=>$('#'+id+'_'+s.k).addEventListener('input',run));
  if(presets)$('#'+id+'_sl').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const p=presets[+b.dataset.i].v;for(const k in p)$('#'+id+'_'+k).value=p[k];run()});
  run();
}
function initAnim(id,frame){
  const c=$('#'+id+'_ac').getContext('2d');let t=0,run=false,last=0,raf=0;
  const loop=ts=>{if(!run)return;t+=Math.min(.05,(ts-last)/1000);last=ts;frame(c,t);raf=requestAnimationFrame(loop)};
  const start=()=>{if(run)return;run=true;last=performance.now();raf=requestAnimationFrame(loop)};
  const stop=()=>{run=false;cancelAnimationFrame(raf)};
  $('#'+id+'_go').onclick=start;$('#'+id+'_stop').onclick=stop;
  $('#'+id+'_rs').onclick=()=>{stop();t=0;frame(c,0);start()};
  frame(c,0);anims.push(stop);
}
function initPr(id,ans,tol,sol){
  $('#'+id+'_ck').onclick=()=>{
    const v=parseFloat($('#'+id+'_in').value.replace(',','.').replace(/[^\d.\-]/g,'')),r=$('#'+id+'_pr');
    if(isNaN(v)){r.className='res no';r.textContent='Javobni raqam bilan kiriting.';return}
    if(Math.abs(v-ans)<=tol){r.className='res ok';r.innerHTML='✔ To\'g\'ri! '+sol}
    else{r.className='res no';r.textContent='✘ Noto\'g\'ri. Formulani qayta tekshirib, yana urinib ko\'ring.'}
  };
}
const sec=(n,t,h)=>`<div class="card"><h3>${n}) ${t}</h3>${h}</div>`;

/* ---------- 1–5 rejalar ---------- */
const mq=`<table><tr><th>Muhit</th><th>n</th><th>α₀</th></tr><tr><td>Suv</td><td>1,33</td><td>≈ 48,8°</td></tr><tr><td>Shisha</td><td>1,5</td><td>≈ 41,8°</td></tr><tr><td>Olmos</td><td>2,42</td><td>≈ 24,4°</td></tr></table>`;
const PLANS=[
{t:'1-reja',h:'To\'la ichki qaytish hodisasi',
 th:`<p>Yorug'lik optik zichligi katta muhitdan kichik muhitga (suv → havo, shisha → havo) o'tganda sinish burchagi tushish burchagidan <b>katta</b> bo'ladi: β &gt; α.</p><p>Tushish burchagi ortganda sinish burchagi 90° ga yetadi. Burchak yana oshsa, nur ikkinchi muhitga o'tmaydi va <b>to'liq qaytadi</b>. Bu hodisa <b>to'la ichki qaytish</b> deyiladi.</p>`,
 fm:`n₁·sin α = n₂·sin β<br>α = α′ (qaytish qonuni)`,
 ex:`Chorvoq suv omborida suvga sho'ng'igan odam sirtga juda qiyalik bilan qarasa, sirt ko'zgudek yaltiraydi: suvdan havoga chiqmoqchi bo'lgan nur to'liq qaytadi.`,
 sl:[{k:'a',label:'Tushish burchagi α',min:0,max:90,step:.5,val:30,u:'°'}],
 draw:(c,v)=>{const r=scene(c,{n1:1.33,n2:1,a:v.a,mark:a0of(1.33,1)});return {k:r.k,t:ST(r)+` (suv → havo, α₀ ≈ 48,8°)`}},
 an:animSweep(1.33,1),
 pr:{q:'Nur shishadan (n = 1,5) havoga α = 30° burchak bilan tushmoqda. Sinish burchagi β ni toping (°).',u:'°',ans:48.6,tol:.3,sol:'sin β = 1,5·sin 30° = 0,75, β ≈ 48,6°.'}},

{t:'2-reja',h:'Chegaraviy burchak',

];
function buildTest(){
  let score=0,done=0;const box=$('#test');
  box.innerHTML=QS.map((q,i)=>`<div class="card"><h3>${i+1}-savol</h3><p>${q.q}</p>${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${'ABCD'[j]}) ${o}</button>`).join('')}<div class="res" id="tq${i}"></div></div>`).join('')
    +`<div class="card"><div class="res" id="tsum"></div><button class="btn" id="trs">↺ Qayta boshlash</button></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q,j=+b.dataset.j,q=QS[i],all=box.querySelectorAll(`[data-q="${i}"]`);
    if(all[0].disabled)return;all.forEach(x=>x.disabled=true);all[q.c].classList.add('c');
    const r=$('#tq'+i);
    if(j==q.c){score++;r.className='res ok';r.textContent='✔ To\'g\'ri!'}else{b.classList.add('w');r.className='res no';r.textContent='✘ Noto\'g\'ri. To\'g\'ri javob: '+'ABCD'[q.c]}
    if(++done==QS.length){const s=$('#tsum');s.className='res '+(score>=4?'ok':'no');s.textContent=`Natija: ${score} / ${QS.length} ball`}
  });
  $('#trs').onclick=buildTest;
}

     +sec(2,'Berilgan / Topish kerak',`<table>${p.g.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table>`)
     +sec(3,'Formula',`<div class="fm">${p.fm}</div>`)
     +sec(4,'Bosqichma-bosqich yechim',`<ol class="steps" id="${id}_ol"></ol><button class="btn" id="${id}_nx">Keyingi qadam</button>`)
     +sec(5,'Slayderli simulyatsiya',simHTML(id+'s'))+sec(6,'Canvas animatsiya',animHTML(id+'a'))
     +sec(7,'Mustaqil masala',prHTML(id+'p',p.pr.q,p.pr.u))+`</div>`});
  d.innerHTML=h;
  PROB.forEach((p,i)=>{const id='q'+i;let k=0;
    $('#'+id+'_nx').onclick=()=>{if(k<p.st.length){$('#'+id+'_ol').insertAdjacentHTML('beforeend',`<li>${p.st[k++]}</li>`)}
      if(k>=p.st.length){$('#'+id+'_nx').disabled=true;$('#'+id+'_nx').textContent='Yechim tugadi'}};
    initSim(id+'s',p.sl,p.draw);initAnim(id+'a',p.an);initPr(id+'p',p.pr.ans,p.pr.tol,p.pr.sol)});
  const sub=d.querySelectorAll('.sub button');
  const pick=k=>{sub.forEach((b,i)=>b.classList.toggle('on',i==k));PROB.forEach((_,i)=>$('#sp'+i).classList.toggle('on',i==k));anims.forEach(s=>s())};
  sub.forEach(b=>b.onclick=()=>pick(+b.dataset.k));pick(0);
})();

$('#pn6').innerHTML=`<h2>Test</h2><div id="test"></div>`;buildTest();

function show(i){nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('on',j===i));anims.forEach(s=>s());
  nav.querySelector(`[data-i="${i}"]`).scrollIntoView({inline:'center',block:'nearest'});window.scrollTo(0,0)}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(+b.dataset.i));
show(0);
