<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>58-mavzu. Olamning yagona fizik manzarasi</title>
<style>
:root{--bg:#f4f7fb;--card:#ffffff;--fg:#14213d;--muted:#5b6678;--accent:#2563eb;--line:#d7deea;--cv:#fbfcff;--ok:#16a34a;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0d1422;--card:#172036;--fg:#e8edf7;--muted:#9aa7bd;--accent:#60a5fa;--line:#2b3855;--cv:#0a101c;--ok:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
header{max-width:900px;margin:auto;padding:14px 16px 4px}
h1{font-size:1.25rem;margin:0}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:900px;margin:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:999px;font-size:.85rem;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:900px;margin:auto;padding:4px 16px 40px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:1.1rem;margin:10px 0 0}
h3{font-size:1rem;margin:0 0 8px}
.theory p{margin:6px 0}
.formula{background:var(--cv);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin:8px 0;font-family:Georgia,serif}
canvas{width:100%;height:auto;display:block;background:var(--cv);border:1px solid var(--line);border-radius:10px;touch-action:none}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 0}
.ctl button,.ctl select{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:7px 11px;border-radius:8px;font-size:.85rem;cursor:pointer}
.ctl button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl button.sel{outline:2px solid var(--accent)}
.sl{display:flex;align-items:center;gap:6px;font-size:.85rem;flex:1 1 220px}
.sl input{flex:1;min-width:80px}
.info{width:100%;font-size:.88rem;background:var(--cv);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.q{margin:12px 0}.q p{margin:4px 0;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:.88rem;cursor:pointer}
.opts button.ok{background:#16a34a;color:#fff;border-color:#16a34a}
.opts button.bad{background:#dc2626;color:#fff;border-color:#dc2626}
.opts button:disabled{cursor:default}
.fb{font-size:.88rem;margin-top:4px;min-height:1.2em}
</style>
</head>
<body>
<header>
  <h1>58-mavzu. Olamning yagona fizik manzarasi</h1>
  <p>9-sinf fizika · 6 ta reja · simulyatsiya, animatsiya va nazorat savollari</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
'use strict';
/* ====================== UMUMIY YORDAMCHILAR ====================== */
const W = 600, H = 340;                       // canvas mantiqiy o'lchami
const TH = {};                                // mavzu (och/to'q) ranglari
function loadTheme(){
  const s = getComputedStyle(document.documentElement);
  ['fg','muted','accent','line','cv'].forEach(k => TH[k] = s.getPropertyValue('--'+k).trim());
}
loadTheme();
const RED='#ef4444', BLUE='#3b82f6', GREEN='#22c55e', AMBER='#f59e0b', PURPLE='#a855f7', GRAY='#94a3b8';

// DOM element yaratish
function $(tag, cls, parent, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  if(parent) parent.appendChild(e);
  return e;
}
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const smooth = x => { x = clamp(x,0,1); return x*x*(3-2*x); };
const sup = x => String(x).replace(/\d/g, d => '⁰¹²³⁴⁵⁶⁷⁸⁹'[d]).replace('-','⁻');
function rng(seed){ return function(){ seed = (seed*1664525 + 1013904223) % 4294967296; return seed/4294967296; }; }

// Chizish funksiyalari
function circ(c,x,y,r,fill,stroke,lw){
  c.beginPath(); c.arc(x,y,Math.max(r,0),0,6.2832);
  if(fill){ c.fillStyle = fill; c.fill(); }
  if(stroke){ c.strokeStyle = stroke; c.lineWidth = lw||1; c.stroke(); }
}
function line(c,x1,y1,x2,y2,col,w){
  c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
  c.strokeStyle = col; c.lineWidth = w||1; c.stroke();
}
function arrow(c,x1,y1,x2,y2,col,w){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy);
  if(L<2) return;
  line(c,x1,y1,x2,y2,col,w);
  const a=Math.atan2(dy,dx), h=Math.min(9,L*0.5);
  c.beginPath(); c.moveTo(x2,y2);
  c.lineTo(x2-h*Math.cos(a-0.45), y2-h*Math.sin(a-0.45));
  c.lineTo(x2-h*Math.cos(a+0.45), y2-h*Math.sin(a+0.45));
  c.closePath(); c.fillStyle = col; c.fill();
}
function txt(c,s,x,y,col,size,al){
  c.fillStyle = col || TH.fg;
  c.font = (size||12) + 'px system-ui,sans-serif';
  c.textAlign = al || 'left'; c.textBaseline = 'alphabetic';
  c.fillText(s,x,y);
}
// Ko'chuvchi strelkalar (energiya oqimi)
function flow(c,x1,x2,y,t,col){
  for(let x = x1 + ((t*40)%22); x < x2-6; x += 22){
    c.beginPath(); c.moveTo(x,y-5); c.lineTo(x+9,y); c.lineTo(x,y+5); c.closePath();
    c.fillStyle = col; c.fill();
  }
}

/* ====================== RUNNER (rAF, Play/Pauza/Qayta) ====================== */
const runners = [];
class Runner{
  constructor(box, scene, ui){
    this.scene = scene; this.t = 0; this.run = false; this.raf = 0; this.last = 0;
    this.cv = $('canvas','',box);
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = W*this.dpr; this.cv.height = H*this.dpr;
    this.cv.style.aspectRatio = W + '/' + H;
    this.ctx = this.cv.getContext('2d');
    this.bar = $('div','ctl',box);
    const bp = $('button','pri',this.bar,'▶ Play');
    const bs = $('button','',this.bar,'⏸ Pauza');
    const br = $('button','',this.bar,'↺ Qayta boshlash');
    bp.onclick = () => this.play();
    bs.onclick = () => this.pause();
    br.onclick = () => { this.reset(); this.play(); };
    this.ui = $('div','ctl',box);
    if(ui) ui(this.ui, this);
    if(scene.init) scene.init(this);
    this.reset();
    runners.push(this);
  }
  pos(e){ const r = this.cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height}; }
  reset(){ this.t = 0; this.scene.reset(this); this.draw(); }
  draw(){
    const c = this.ctx;
    c.setTransform(this.dpr,0,0,this.dpr,0,0);
    c.clearRect(0,0,W,H);
    this.scene.draw(c, this.t, this);
  }
  play(){ if(this.run) return; this.run = true; this.last = performance.now(); this.raf = requestAnimationFrame(n => this.tick(n)); }
  pause(){ this.run = false; cancelAnimationFrame(this.raf); }
  tick(now){
    if(!this.run) return;
    const dt = Math.min(0.05, (now - this.last)/1000);
    this.last = now; this.t += dt;
    this.scene.step(dt, this.t, this);
    this.draw();
    this.raf = requestAnimationFrame(n => this.tick(n));
  }
}

// Boshqaruv elementlari
function slider(box,label,min,max,step,val,fn,unit){
  const w = $('label','sl',box);
  $('span','',w,label+':');
  const v = $('b','',w,val+(unit||''));
  const i = $('input','',w);
  i.type='range'; i.min=min; i.max=max; i.step=step; i.value=val;
  i.oninput = () => { v.textContent = i.value + (unit||''); fn(+i.value); };
  i.set = x => { i.value = x; v.textContent = (Math.round(x*100)/100) + (unit||''); };
  return i;
}
function button(box,label,fn){ const b = $('button','',box,label); b.onclick = fn; return b; }
function choose(btns,i){ btns.forEach((b,j) => b.classList.toggle('sel', i===j)); }

/* ====================== 1-REJA ====================== */
const PL = [ // [nomi, davri (yil), orbita radiusi (px), rang]
  ['Merkuriy',0.241,35,'#94a3b8'],['Venera',0.615,60,'#f59e0b'],['Yer',1,85,'#3b82f6'],
  ['Mars',1.881,112,'#ef4444'],['Yupiter',11.86,142,'#d97706']];

const sc1 = {
  mode:'helio', spd:1, sel:3, ty:0, trail:[],
  reset(){ this.ty = 0; this.trail = []; },
  hp(i){ const p = PL[i], a = 6.2832*this.ty/p[1]; return [p[2]*Math.cos(a), p[2]*Math.sin(a)]; },
  rel(i){
    const p = this.hp(i);
    if(this.mode === 'helio') return p;
    const e = this.hp(2);
    return [(p[0]-e[0])*0.62, (p[1]-e[1])*0.62];
  },
  step(dt){
    this.ty += dt*this.spd/6;
    this.trail.push(this.rel(this.sel));
    if(this.trail.length > 900) this.trail.shift();
  },
  draw(c,t){
    const cx=300, cy=175, geo = this.mode==='geo';
    if(!geo) PL.forEach(p => circ(c,cx,cy,p[2],null,TH.line,1));
    else circ(c,cx,cy,85*0.62,null,TH.line,1);
    // iz (traektoriya)
    c.beginPath();
    this.trail.forEach((q,i) => i ? c.lineTo(cx+q[0],cy+q[1]) : c.moveTo(cx+q[0],cy+q[1]));
    c.strokeStyle = PL[this.sel][3]; c.lineWidth = 1.5; c.stroke();
    if(!geo){
      circ(c,cx,cy,11,AMBER); txt(c,'Quyosh',cx+13,cy-8,TH.fg,11);
      PL.forEach((p,i) => { const q = this.hp(i); circ(c,cx+q[0],cy+q[1],i===this.sel||i===2?6:4,p[3]); txt(c,p[0],cx+q[0]+8,cy+q[1]-6,TH.fg,11); });
    } else {
      circ(c,cx,cy,7,BLUE); txt(c,'Yer',cx+9,cy-8,TH.fg,11);
      const e = this.hp(2), s = [-e[0]*0.62, -e[1]*0.62];
      circ(c,cx+s[0],cy+s[1],9,AMBER); txt(c,'Quyosh',cx+s[0]+11,cy+s[1]-6,TH.fg,11);
      PL.forEach((p,i) => { if(i===2) return; const q = this.rel(i); circ(c,cx+q[0],cy+q[1],i===this.sel?6:4,p[3]); txt(c,p[0],cx+q[0]+8,cy+q[1]-6,TH.fg,11); });
    }
    txt(c, geo ? 'GEOTSENTRIK model (Ptolemey): markazda — Yer' : 'GELIOTSENTRIK model (Kopernik): markazda — Quyosh', 12, 20, TH.fg, 13);
    txt(c, 't = ' + this.ty.toFixed(2) + ' yil', 12, 38, TH.muted, 12);
    if(geo) txt(c,'Tanlangan sayyora yerdan qaraganda ba\'zan orqaga qaytadi (halqa)',12,H-10,TH.muted,11);
    else txt(c,'Sayyoralar Quyosh atrofida doiraviy orbitada (soddalashtirilgan)',12,H-10,TH.muted,11);
  }
};
function ui1(b,r){
  const sel = $('select','',b);
  PL.forEach((p,i) => { if(i!==2){ const o = $('option','',sel,p[0]); o.value = i; } });
  sel.value = 3;
  sel.onchange = () => { sc1.sel = +sel.value; sc1.trail = []; r.draw(); };
  const set = m => { sc1.mode = m; sc1.trail = []; choose(bs, m==='geo'?0:1); r.draw(); };
  const bs = [button(b,'Geotsentrik',() => set('geo')), button(b,'Geliotsentrik',() => set('helio'))];
  choose(bs,1);
  slider(b,'Tezlik',0.5,5,0.5,1,v => sc1.spd = v,'×');
}
const EV = [['Ptolemey','geotsentrik, ~150-y.'],['Ulug\'bek','rasadxona, XV asr'],['Kopernik','geliotsentrik, 1543'],['Galiley, Kepler','1609–1619'],['Nyuton','tortishish qonuni, 1687']];
const an1 = {
  reset(){}, step(){},
  draw(c,t){
    const p = clamp((t%18)/16,0,1), cx=300, cy=125, R=70, a = t*1.2;
    const m = smooth((p-0.3)/0.4);
    if(R*(1-m) > 2) circ(c,cx,cy,R*(1-m),null,TH.line,1);
    if(R*m > 2) circ(c,cx,cy,R*m,null,TH.line,1);
    const e = [cx + m*R*Math.cos(a), cy + m*R*Math.sin(a)];
    const s = [cx + (1-m)*R*Math.cos(a+Math.PI), cy + (1-m)*R*Math.sin(a+Math.PI)];
    circ(c,s[0],s[1],11,AMBER); circ(c,e[0],e[1],7,BLUE);
    txt(c,'Quyosh',s[0]+13,s[1]-9,TH.fg,11); txt(c,'Yer',e[0]+9,e[1]-9,TH.fg,11);
    txt(c, m<0.5 ? 'Geotsentrik model: Yer markazda' : 'Geliotsentrik model: Quyosh markazda', cx, 22, TH.fg, 13, 'center');
    // xronologiya chizig'i
    line(c,70,290,530,290,TH.line,3);
    line(c,70,290,70+460*p,290,TH.accent,3);
    EV.forEach((ev,i) => {
      const x = 70 + 115*i, al = smooth((p - i/4)*8);
      c.globalAlpha = 0.25 + 0.75*al;
      circ(c,x,290,6,al>0.5?TH.accent:TH.line);
      txt(c,ev[0],x,268,TH.fg,12,'center');
      txt(c,ev[1],x,314,TH.muted,10,'center');
      c.globalAlpha = 1;
    });
  }
};

/* ====================== 2-REJA ====================== */
const rad = q => 8 + 2*Math.abs(q.q);
const sc2 = {
  ch:[], sgn:1, q:3, drag:-1, lines:[], dirty:true,
  init(r){
    const cv = r.cv;
    cv.addEventListener('pointerdown', e => {
      const p = r.pos(e); let h = -1;
      this.ch.forEach((q,i) => { if(Math.hypot(p.x-q.x,p.y-q.y) < rad(q)+6) h = i; });
      if(h >= 0) this.drag = h;
      else { this.ch.push({x:p.x,y:p.y,q:this.sgn*this.q}); if(this.ch.length > 8) this.ch.shift(); this.dirty = true; }
      cv.setPointerCapture(e.pointerId); r.draw();
    });
    cv.addEventListener('pointermove', e => {
      if(this.drag < 0) return;
      const p = r.pos(e), q = this.ch[this.drag];
      if(!q) return;
      q.x = clamp(p.x,10,W-10); q.y = clamp(p.y,10,H-10); this.dirty = true; r.draw();
    });
    const up = () => { this.drag = -1; };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  },
  reset(){ this.ch = [{x:200,y:170,q:3},{x:400,y:170,q:-3}]; this.dirty = true; },
  step(){},
  E(x,y){
    let ex=0, ey=0;
    for(const q of this.ch){
      const dx=x-q.x, dy=y-q.y, r2=dx*dx+dy*dy+25, k=q.q/(r2*Math.sqrt(r2));
      ex += k*dx; ey += k*dy;
    }
    return [ex,ey];
  },
  build(){
    this.dirty = false; this.lines = [];
    const pos = this.ch.filter(q => q.q > 0), src = pos.length ? pos : this.ch, dir = pos.length ? 1 : -1;
    for(const s of src){
      const n = Math.round(6 + 4*Math.abs(s.q));
      for(let k=0;k<n;k++){
        const a = 6.2832*k/n; let x = s.x + 10*Math.cos(a), y = s.y + 10*Math.sin(a);
        const pts = [[x,y]];
        for(let i=0;i<500;i++){
          const [ex,ey] = this.E(x,y), m = Math.hypot(ex,ey);
          if(m < 1e-9) break;
          x += dir*ex/m*4; y += dir*ey/m*4; pts.push([x,y]);
          if(x<0||x>W||y<0||y>H) break;
          let hit = false;
          for(const q of this.ch){ if(q!==s && Math.sign(q.q)!==Math.sign(s.q) && Math.hypot(x-q.x,y-q.y)<9){ hit = true; break; } }
          if(hit) break;
        }
        this.lines.push(pts);
      }
    }
  },
  draw(c,t){
    if(this.dirty) this.build();
    c.setLineDash([6,5]); c.lineDashOffset = -t*30; c.strokeStyle = '#d97706'; c.lineWidth = 1.2;
    for(const pts of this.lines){
      c.beginPath(); pts.forEach((p,i) => i ? c.lineTo(p[0],p[1]) : c.moveTo(p[0],p[1])); c.stroke();
    }
    c.setLineDash([]);
    // Kulon kuchi vektorlari
    this.ch.forEach((a,i) => {
      let fx=0, fy=0;
      this.ch.forEach((b,j) => {
        if(i===j) return;
        const dx=a.x-b.x, dy=a.y-b.y, r2=dx*dx+dy*dy+1, r=Math.sqrt(r2), f=a.q*b.q/r2;
        fx += f*dx/r; fy += f*dy/r;
      });
      const m = Math.hypot(fx,fy), L = Math.min(70, m*2e5);
      if(L > 3) arrow(c,a.x,a.y,a.x+fx/m*(L+rad(a)),a.y+fy/m*(L+rad(a)),GREEN,3);
    });
    this.ch.forEach(q => {
      circ(c,q.x,q.y,rad(q),q.q>0?RED:BLUE,'#fff',1.5);
      txt(c,(q.q>0?'+':'−')+Math.abs(q.q),q.x,q.y+4,'#fff',12,'center');
    });
    txt(c,'Ekranni bosib zaryad qo\'ying, zaryadni sudrab ko\'chiring',10,18,TH.fg,12);
    txt(c,'Sariq chiziqlar — maydon (E); yashil strelka — Kulon kuchi F = k·|q₁q₂|/r²',10,H-10,TH.muted,11);
  }
};
function ui2(b,r){
  const bs = [button(b,'＋ Musbat zaryad',() => { sc2.sgn = 1; choose(bs,0); }), button(b,'− Manfiy zaryad',() => { sc2.sgn = -1; choose(bs,1); })];
  choose(bs,0);
  slider(b,'Yangi zaryad |q|',1,5,1,3,v => sc2.q = v,' (nisbiy birlik)');
  button(b,'Tozalash',() => { sc2.ch = []; sc2.dirty = true; r.draw(); });
}
const an2 = {
  reset(){}, step(){},
  draw(c,t){
    const cy=170, x0=70, w=3, k=0.05, yq = 22*Math.sin(w*t);
    for(let i=0;i<5;i++){
      const r = (t*50 + i*70) % 350;
      c.globalAlpha = Math.max(0, 0.45*(1-r/350));
      circ(c,x0,cy+yq,r,null,BLUE,1.5);
    }
    c.globalAlpha = 1;
    line(c,x0,cy,W-10,cy,TH.line,1);
    for(let x=x0+16; x<W-10; x+=14){
      const A = 46*Math.min(1,(x-x0)/40)*Math.sin(w*t - k*(x-x0));
      arrow(c,x,cy,x,cy-A,RED,2);
      arrow(c,x,cy,x+A*0.6,cy+A*0.45,BLUE,2);
    }
    line(c,x0,cy-70,x0,cy+70,TH.line,1);
    circ(c,x0,cy+yq,9,RED,'#fff',1.5); txt(c,'+',x0,cy+yq+4,'#fff',12,'center');
    txt(c,'Tebranuvchi zaryad elektromagnit to\'lqin chiqaradi',10,20,TH.fg,12);
    txt(c,'E — elektr maydon (qizil)',10,H-44,RED,12);
    txt(c,'B — magnit maydon (ko\'k)',10,H-28,BLUE,12);
    txt(c,'c = λ·f ≈ 3·10⁸ m/s (vakuumda)',10,H-10,TH.muted,12);
  }
};

/* ====================== 3-REJA ====================== */
const FI = [
  {n:'Kuchli',rel:'1',lg:0,rng:'~10⁻¹⁵ m (yadro ichida)',car:'glyuonlar',dist:'yadro o\'lchamidan katta masofada deyarli yo\'qoladi',ex:'protonlar va neytronlarni yadroda ushlab turadi',rpx:46,col:GREEN},
  {n:'Elektromagnit',rel:'1/137 ≈ 7·10⁻³',lg:-2.14,rng:'cheksiz',car:'foton',dist:'F ∝ 1/r²',ex:'atom, molekula tuzilishi, yorug\'lik, elektr va magnit hodisalar',rpx:0,col:BLUE},
  {n:'Kuchsiz',rel:'~10⁻⁶',lg:-6,rng:'~10⁻¹⁸ m',car:'W⁺, W⁻, Z⁰ bozonlari',dist:'juda qisqa masofada ta\'sir qiladi',ex:'radioaktiv (β) parchalanish',rpx:18,col:AMBER},
  {n:'Gravitatsion',rel:'~10⁻³⁸',lg:-38,rng:'cheksiz',car:'graviton (gipotetik)',dist:'F = G·m₁m₂/r² ∝ 1/r²',ex:'sayyora, yulduz, galaktikalar harakati',rpx:0,col:PURPLE}];
const sc3 = {
  sel:0, info:null,
  reset(){}, step(){},
  setInfo(){

    const n = [0,70,70,70,25,45,70][st];
    for(let k=0;k<n;k++){
      const q = PT6[k], x = cx + q.d*Rr*0.92*Math.cos(q.a) + Math.sin(t*3+k), y = cy + q.d*Rr*0.92*Math.sin(q.a) + Math.cos(t*2.6+k);
      if(st === 1) circ(c,x,y,1.6,q.col);
      else if(st === 2) circ(c,x,y,2.6,k%2?AMBER:RED);
      else if(st === 3) circ(c,x,y,2,'#93c5fd');
      else if(st === 4){ c.globalAlpha = 0.3; circ(c,x,y,6,'#fff'); c.globalAlpha = 1; circ(c,x,y,2,'#fff'); }
      else {
        c.save(); c.translate(x,y); c.rotate(q.rot);
        c.beginPath(); c.ellipse(0,0,q.sz*(st===6?2.2:1.5),q.sz*0.6,0,0,6.2832);
        c.fillStyle = q.col; c.globalAlpha = 0.85; c.fill(); c.restore(); c.globalAlpha = 1;
      }
    }
    if(st === 3){ c.globalAlpha = 0.5 + 0.3*Math.sin(t*3); circ(c,cx,cy,Rr,null,'#fb923c',4); c.globalAlpha = 1; }
    circ(c,cx,cy,Rr,null,TH.accent,1.5);
    txt(c,ST6[st][0]+' — '+ST6[st][1],cx,304,TH.fg,13,'center');
    line(c,30,324,570,324,TH.line,3);
    line(c,30,324,30+540*p,324,AMBER,3);
    for(let i=0;i<7;i++) circ(c,30+540*i/6,324,i<=st?5:3,i<=st?AMBER:TH.line);
    txt(c,'Vaqt →',10,18,TH.muted,12);
    if(st === 3) txt(c,'Reliktsion nurlanish — Katta portlash dalili',cx,H-34,TH.muted,11,'center');
    if(st === 6) txt(c,'Fizik manzara doimo yangilanib boradi',cx,H-34,TH.muted,11,'center');
  }
};

/* ====================== NAZORAT SAVOLLARI ====================== */
function quiz(box,list){
  list.forEach((it,n) => {
    const d = $('div','q',box);
    $('p','',d,(n+1)+'. '+it.q);
    const ob = $('div','opts',d), fb = $('div','fb',d);
    const bs = it.o.map((t,i) => {
      const b = $('button','',ob,t);
      b.onclick = () => {
        bs.forEach((x,j) => { x.disabled = true; if(j === it.a) x.classList.add('ok'); });
        if(i === it.a){ fb.textContent = '✅ To\'g\'ri! ' + (it.e||''); fb.style.color = 'var(--ok)'; }
        else { b.classList.add('bad'); fb.textContent = '❌ Noto\'g\'ri. To\'g\'ri javob: ' + it.o[it.a] + '. ' + (it.e||''); fb.style.color = 'var(--bad)'; }
      };
      return b;
    });
  });
}

const navEl = document.getElementById('nav'), mainEl = document.getElementById('main'), panels = [];
TABS.forEach((T,i) => {
  const nb = $('button','',navEl,T.nav);
  nb.onclick = () => show(i);

  $('h2','',p,T.title);
  $('div','card theory',p,'<h3>Nazariy ma\'lumot</h3>'+T.theory);

  const c2 = $('div','card',p,'<h3>Animatsiya</h3>');
  const c3 = $('div','card',p,'<h3>Nazorat savollari</h3>');
  const rs = [new Runner(c1,T.sim.scene,T.sim.ui), new Runner(c2,T.anim.scene,T.anim.ui)];
  quiz(c3,T.quiz);
  panels.push({nb:nb,p:p,rs:rs});

function show(i){
  panels.forEach((x,j) => {
    x.rs.forEach(r => r.pause());                 // oldingi tabdagi animatsiyalar to'xtaydi
    x.p.classList.toggle('on', j===i);
    x.nb.classList.toggle('on', j===i);
  });
  panels[i].rs.forEach(r => { r.reset(); r.play(); });
  window.scrollTo(0,0);
}
