<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>37-mavzu. Masalalar yechish — Qattiq jismlarning mexanik xossalari</title>
<style>
:root{--bg:#f3f6fc;--card:#ffffff;--ink:#17203a;--mut:#58637d;--pri:#2563eb;--pri2:#e1e9ff;--btn:#2563eb;--ok:#15a34a;--bad:#dc2626;--line:#d6deee;--fm:#eaf0ff;--warn:#e89b0c}
[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#e9eefb;--mut:#9eabc8;--pri:#7aa8ff;--pri2:#25345a;--btn:#3a6fe0;--ok:#4ade80;--bad:#f87171;--line:#2b3859;--fm:#1d2849;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:10px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
h1{font-size:1.25rem;margin:0;line-height:1.3}
h2{font-size:1.15rem;margin:14px 0 4px}
.sub{margin:2px 0 0;color:var(--mut);font-size:.9rem}
.icon{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer;color:var(--ink)}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 0;position:sticky;top:0;background:var(--bg);z-index:5;-webkit-overflow-scrolling:touch}
nav button{flex:0 0 auto;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--btn);color:#fff;border-color:var(--btn)}
section{display:none}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:1.05rem}
.card p{margin:6px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.grid2 .card{margin:0}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.fm{background:var(--fm);border-left:4px solid var(--pri);border-radius:10px;padding:8px 12px;margin:8px 0;font:italic 1.1rem/1.5 Georgia,"Times New Roman",serif;overflow-x:auto}
.step{display:none;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.step.show{display:block;animation:fade .4s}
.step b.t{color:var(--pri)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.step.show{animation:none}}
.btn{min-height:48px;padding:0 16px;border:0;border-radius:12px;background:var(--btn);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn.sec{background:var(--pri2);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.row .btn{flex:1 1 120px}
.sl{margin:10px 0}
.sl label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:.95rem}
.sl input{width:100%;height:36px;accent-color:var(--pri)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.out div{background:var(--fm);border-radius:10px;padding:8px 10px;font-size:.85rem;color:var(--mut)}
.out b{display:block;color:var(--ink);font-size:1.05rem}
.note{background:var(--fm);border-radius:10px;padding:8px 12px;font-size:.95rem}
canvas{display:block;width:100%;border-radius:12px;background:var(--bg);border:1px solid var(--line);margin:10px 0}
input.ans{flex:1 1 140px;min-height:48px;font-size:18px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.unit{align-self:center;font-weight:700}
.msg{font-weight:700;margin-top:6px}
.msg.ok{color:var(--ok)}
.msg.bad{color:var(--bad)}
.sol{display:none;margin-top:8px}
.sol.show{display:block}
.opt{display:block;width:100%;text-align:left;min-height:50px;margin:8px 0;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:rgba(34,197,94,.18)}
.opt.bad{border-color:var(--bad);background:rgba(239,68,68,.18)}
.big{font-size:1.8rem;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>37-mavzu. Masalalar yechish</h1>
      <p class="sub">9-sinf fizika · Qattiq jismlarning mexanik xossalari</p>
    </div>
    <button id="themeBtn" class="icon" aria-label="Och / to'q mavzu">🌙</button>
  </header>
  <nav id="tabs"></nav>
  <main id="main"></main>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var SUP={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};

/* ---------- yordamchi funksiyalar ---------- */
function fmt(x,d){
  if(d===undefined)d=2;
  var n=+(+x).toFixed(d),s=String(n);
  if(s.indexOf('e')>-1)s=n.toFixed(d);
  var p=s.split('.');
  p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'\u00a0');
  return p.join(',');
}
function sciT(x,d){
  if(x===0)return '0';
  d=(d===undefined)?2:d;
  var e=Math.floor(Math.log10(Math.abs(x))),m=+(x/Math.pow(10,e)).toFixed(d);
  if(Math.abs(m)>=10){m/=10;e++;}
  var es=String(e).split('').map(function(ch){return SUP[ch];}).join('');
  return (m===1?'':fmt(m,d)+'·')+'10'+es;
}
function nice(x){
  var p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p,s=[1,2,4,5,8,10];
  for(var i=0;i<s.length;i++){if(m<=s[i]+1e-9)return s[i]*p;}
  return 10*p;
}
function tickfmt(v){return fmt(+(+v).toPrecision(3),3);}
function line(c,a,b,d,e){c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke();}
function dot(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,6.2832);c.fillStyle=f;c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();}
function txt(c,s,x,y,color,size,al,bold){c.fillStyle=color;c.font=(bold?'700 ':'')+size+'px system-ui,sans-serif';c.textAlign=al||'left';c.fillText(s,x,y);}
function poly(c,p,f,s){c.beginPath();p.forEach(function(q,i){if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1]);});c.closePath();c.fillStyle=f;c.fill();if(s){c.strokeStyle=s;c.lineWidth=1.5;c.stroke();}}
function arrow(c,x1,y1,x2,y2,color,wd){
  var dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy);if(len<4)return;
  var a=Math.atan2(dy,dx),hl=11;
  c.strokeStyle=color;c.fillStyle=color;c.lineWidth=wd||3;c.lineCap='butt';
  line(c,x1,y1,x2-Math.cos(a)*hl*0.6,y2-Math.sin(a)*hl*0.6);
  c.beginPath();c.moveTo(x2,y2);
  c.lineTo(x2-hl*Math.cos(a-0.4),y2-hl*Math.sin(a-0.4));
  c.lineTo(x2-hl*Math.cos(a+0.4),y2-hl*Math.sin(a+0.4));
  c.closePath();c.fill();
}
function ceil(c,cx,y,wd,k){
  c.strokeStyle=k.ink;c.lineWidth=3;line(c,cx-wd/2,y,cx+wd/2,y);
  c.lineWidth=1.5;
  for(var x=cx-wd/2+6;x<=cx+wd/2;x+=9){line(c,x,y,x-7,y-9);}
}
function spring(c,x,y1,y2,n,amp,col){
  c.strokeStyle=col;c.lineWidth=3;c.lineJoin='round';
  var a=y1+8,b=y2-8;
  c.beginPath();c.moveTo(x,y1);c.lineTo(x,a);
  for(var i=1;i<=n*2;i++){c.lineTo(x+(i%2?amp:-amp),a+(b-a)*i/(n*2));}
  c.lineTo(x,b);c.lineTo(x,y2);c.stroke();
}
function colors(){
  var s=getComputedStyle(document.documentElement),g=function(n){return s.getPropertyValue(n).trim();};
  return {ink:g('--ink'),mut:g('--mut'),pri:g('--pri'),ok:g('--ok'),bad:g('--bad'),line:g('--line'),warn:g('--warn'),fm:g('--fm')};
}
function axes(c,w,h,o,k){
  var L=52,R=14,T=14,B=36,pw=w-L-R,ph=h-T-B,nx=o.nx||4,ny=o.ny||4;
  var X=function(x){return L+x/o.xmax*pw;},Y=function(y){return T+ph-y/o.ymax*ph;};
  c.lineWidth=1;c.strokeStyle=k.line;
  for(var i=0;i<=nx;i++){var gx=L+pw*i/nx;line(c,gx,T,gx,T+ph);txt(c,tickfmt(o.xmax*i/nx),gx,T+ph+15,k.mut,11,'center');}
  for(var j=0;j<=ny;j++){var gy=T+ph-ph*j/ny;line(c,L,gy,L+pw,gy);txt(c,tickfmt(o.ymax*j/ny),L-5,gy+4,k.mut,11,'right');}
  c.strokeStyle=k.ink;c.lineWidth=2;c.beginPath();c.moveTo(L,T);c.lineTo(L,T+ph);c.lineTo(L+pw,T+ph);c.stroke();
  txt(c,o.xl,L+pw/2,h-5,k.ink,12,'center',1);
  c.save();c.translate(11,T+ph/2);c.rotate(-Math.PI/2);txt(c,o.yl,0,0,k.ink,12,'center',1);c.restore();
  return {X:X,Y:Y,L:L,T:T,pw:pw,ph:ph};
}
/* sim / sterjen sahnasi (3 va 4-masala uchun umumiy) */
function wire(c,w,h,k,o){
  var cx=w*0.34,y0=14;ceil(c,cx,y0,100,k);
  var y1=y0+o.L+o.ext;
  c.strokeStyle=k.pri;c.lineWidth=o.wd;line(c,cx,y0,cx,y1);
  c.setLineDash([4,4]);c.strokeStyle=k.mut;c.lineWidth=1;line(c,cx+10,y0+o.L,cx+72,y0+o.L);c.setLineDash([]);
  c.strokeStyle=k.ok;c.lineWidth=2;
  line(c,cx-32,y0,cx-32,y0+o.L);line(c,cx-38,y0,cx-26,y0);line(c,cx-38,y0+o.L,cx-26,y0+o.L);
  txt(c,'l₀',cx-44,y0+o.L/2+5,k.ok,14,'right',1);
  if(o.ext>1.5){
    c.strokeStyle=k.bad;c.lineWidth=2;
    line(c,cx+55,y0+o.L,cx+55,y1);line(c,cx+49,y0+o.L,cx+61,y0+o.L);line(c,cx+49,y1,cx+61,y1);
    txt(c,'Δl',cx+64,y0+o.L+o.ext/2+5,k.bad,14,'left',1);
  }
  c.fillStyle=k.warn;c.fillRect(cx-20,y1,40,26);txt(c,'yuk',cx,y1+18,'#222',12,'center');
  arrow(c,cx,y1+26,cx,y1+26+Math.max(8,o.al),k.bad);
  o.lines.forEach(function(s,i){txt(c,s[0],w*0.6,56+i*26,s[1]||k.ink,14,'left',1);});
}

/* ---------- 5-masala: σ–ε diagramma ma'lumotlari ---------- */
var CP=[[0,0],[0.2,240],[0.6,270],[6,400],[9,340]];
function path5(s){
  if(s>400)return {pts:CP.slice(),broke:true};
  var out=[CP[0]];
  for(var i=1;i<4;i++){
    var a=CP[i-1],b=CP[i];
    if(s>=b[1]){out.push(b);}
    else{var f=(s-a[1])/(b[1]-a[1]);out.push([a[0]+f*(b[0]-a[0]),s]);break;}
  }
  return {pts:out,broke:false};
}
function cur5(s,t){
  var P5=path5(s),pts=P5.pts,n=pts.length,L=[],tot=0,i;
  for(i=1;i<n;i++){var d=Math.hypot((pts[i][0]-pts[i-1][0])/10,(pts[i][1]-pts[i-1][1])/450);L.push(d);tot+=d;}
  var tg=t*tot,tr=[pts[0]],cur=pts[0];
  for(i=1;i<n;i++){
    if(tg>=L[i-1]-1e-9){tg-=L[i-1];tr.push(pts[i]);cur=pts[i];}
    else{var f=tg/L[i-1];cur=[pts[i-1][0]+f*(pts[i][0]-pts[i-1][0]),pts[i-1][1]+f*(pts[i][1]-pts[i-1][1])];tr.push(cur);break;}
  }
  return {e:cur[0],s:cur[1],tr:tr,broke:P5.broke};
}

/* ---------- MASALALAR ---------- */
var P=[];

/* 1. Guk qonuni */
P.push({
  tab:'1. Guk qonuni',
  title:'1-masala. Guk qonuni: prujinaning bikrligi',
  cond:`Prujinaga <b>F = 20 N</b> kuch bilan ta'sir qilinganda u <b>Δl = 4 cm</b> ga cho'zildi. Prujinaning bikrligi <b>k</b> ni toping.`,
  given:['F = 20 N','Δl = 4 cm = 0,04 m'],
  find:['k = ? (N/m)'],
  steps:[
    ['Formula',`<div class="fm">F = k · Δl &nbsp;⟹&nbsp; k = F / Δl</div>Guk qonuni: elastik kuch cho'zilishga to'g'ri proporsional.`],
    ["SI birligiga o'tkazish",`<div class="fm">Δl = 4 cm = 0,04 m</div>1 cm = 0,01 m ekanini eslang.`],
    ["O'rniga qo'yish",`<div class="fm">k = 20 N / 0,04 m</div>`],
    ['Hisoblash',`<div class="fm">k = 500 N/m</div>`],
    ['Javob',`<div class="fm">k = 500 N/m</div>Har 1 cm cho'zilish uchun 5 N kuch kerak.`]
  ],
  sl:[{k:'F',l:'Kuch F',u:'N',min:1,max:100,step:1,v:20},{k:'dl',l:"Cho'zilish Δl",u:'cm',min:1,max:20,step:0.5,v:4}],
  sim:function(v){
    var kk=v.F/(v.dl/100);
    return {out:[['Bikrlik k',fmt(kk,1)+' N/m'],['Δl (SI)',fmt(v.dl/100,3)+' m'],['1 cm uchun kuch',fmt(kk/100,2)+' N']],
      note:'k = F / Δl = '+fmt(v.F,0)+' / '+fmt(v.dl/100,3)+' = <b>'+fmt(kk,1)+' N/m</b>'};
  },
  scene:function(c,w,h,v,t,k){
    var cx=w*0.35,y0=14;ceil(c,cx,y0,90,k);
    var L0=h*0.24,ext=(v.dl/20)*h*0.3*t,y2=y0+L0+ext,kk=v.F/(v.dl/100);
    spring(c,cx,y0,y2,9,14,k.pri);
    c.setLineDash([4,4]);c.strokeStyle=k.mut;c.lineWidth=1;line(c,cx+20,y0+L0,cx+85,y0+L0);c.setLineDash([]);
    if(ext>2){c.strokeStyle=k.bad;c.lineWidth=2;line(c,cx+70,y0+L0,cx+70,y2);line(c,cx+64,y2,cx+76,y2);txt(c,'Δl',cx+76,y0+L0+ext/2+5,k.bad,14,'left',1);}
    c.fillStyle=k.warn;c.fillRect(cx-22,y2,44,28);txt(c,'m',cx,y2+19,'#222',14,'center',1);
    arrow(c,cx,y2+28,cx,y2+28+Math.max(8,(v.F/100)*h*0.17*t),k.bad);
    txt(c,'F = '+fmt(v.F*t,0)+' N',w*0.62,56,k.bad,14,'left',1);
    txt(c,'Δl = '+fmt(v.dl*t,1)+' cm',w*0.62,82,k.ink,14,'left',1);
    txt(c,'k = '+fmt(kk,0)+' N/m',w*0.62,108,k.pri,14,'left',1);
  },
  graph:function(c,w,h,v,t,k){
    var G=axes(c,w,h,{xmax:20,ymax:100,xl:'Δl, cm',yl:'F, N'},k),kk=v.F/v.dl,xe=Math.min(20,100/kk);
    c.strokeStyle=k.mut;c.lineWidth=2;c.setLineDash([5,4]);line(c,G.X(0),G.Y(0),G.X(xe),G.Y(kk*xe));c.setLineDash([]);
    var x=v.dl*t,y=v.F*t;
    c.strokeStyle=k.pri;c.lineWidth=3.5;line(c,G.X(0),G.Y(0),G.X(x),G.Y(y));
    dot(c,G.X(x),G.Y(y),7,k.bad);
    txt(c,'F = k·Δl  (nishab = k)',G.L+8,G.T+14,k.ink,12,'left',1);
  },
  life:`Kuch o'lchaydigan prujinali tarozi (dinamometr) va avtomobil ressorlari Guk qonuniga asoslangan: yuk og'irroq bo'lsa, prujina proporsional ravishda ko'proq cho'ziladi.`,
  ind:{q:`Bikrligi 300 N/m bo'lgan prujina 6 cm ga cho'zildi. Prujinaga ta'sir etgan kuch necha nyuton?`,u:'N',ans:18,sol:`<div class="fm">F = k · Δl = 300 N/m · 0,06 m = 18 N</div>`}
});

/* 2. Mexanik kuchlanish */
P.push({
  tab:'2. Kuchlanish',
  title:'2-masala. Mexanik kuchlanish σ = F/S',
  cond:`Po'lat sterjenga <b>F = 600 N</b> cho'zuvchi kuch ta'sir qiladi. Sterjenning ko'ndalang kesim yuzi <b>S = 2 mm²</b>. Mexanik kuchlanishni toping.`,
  given:['F = 600 N','S = 2 mm² = 2·10⁻⁶ m²'],
  find:['σ = ? (Pa, MPa)'],
  steps:[
    ['Formula',`<div class="fm">σ = F / S</div>Kuchlanish — ko'ndalang kesim birlik yuziga ta'sir qiluvchi kuch.`],
    ["SI birligiga o'tkazish",`<div class="fm">S = 2 mm² = 2·10⁻⁶ m²</div>1 mm² = 10⁻⁶ m².`],
    ["O'rniga qo'yish",`<div class="fm">σ = 600 N / (2·10⁻⁶ m²)</div>`],
    ['Hisoblash',`<div class="fm">σ = 3·10⁸ Pa = 300 MPa</div>`],
    ['Javob',`<div class="fm">σ = 300 MPa</div>1 MPa = 10⁶ Pa.`]
  ],
  sl:[{k:'F',l:'Kuch F',u:'N',min:100,max:2000,step:50,v:600},{k:'S',l:'Kesim yuzi S',u:'mm²',min:0.5,max:10,step:0.5,v:2}],
  sim:function(v){
    var s=v.F/v.S;
    return {out:[['S (SI)',sciT(v.S*1e-6)+' m²'],['σ (Pa)',sciT(s*1e6)+' Pa'],['σ (MPa)',fmt(s,1)+' MPa']],
      note:'σ = F / S = '+fmt(v.F,0)+' N / '+sciT(v.S*1e-6)+' m² = <b>'+fmt(s,1)+' MPa</b>'};
  },
  scene:function(c,w,h,v,t,k){
    var cx=w*0.34,y0=14,sig=v.F/v.S,wr=8+8*Math.sqrt(v.S),len=h*0.5;
    ceil(c,cx,y0,100,k);
    var r=Math.min(1,sig/1000)*t,fc='hsl('+(120-120*r)+',70%,48%)';
    c.fillStyle=fc;c.fillRect(cx-wr/2,y0,wr,len);
    c.fillStyle=k.ink;c.fillRect(cx-wr/2-10,y0+len,wr+20,6);
    var al=(v.F/2000)*h*0.28*t;
    arrow(c,cx,y0+len+6,cx,y0+len+14+Math.max(6,al),k.bad);
    txt(c,'F',cx+14,y0+len+34,k.bad,14,'left',1);
    var cx2=w*0.76,cy=h*0.3,rr=8*Math.sqrt(v.S);
    c.beginPath();c.arc(cx2,cy,rr,0,6.2832);c.fillStyle=fc;c.fill();c.strokeStyle=k.ink;c.lineWidth=1.5;c.stroke();
    txt(c,'kesim',cx2,cy-rr-8,k.mut,12,'center');
    txt(c,'S = '+fmt(v.S,1)+' mm²',cx2,cy+rr+18,k.ink,13,'center',1);
    txt(c,'F = '+fmt(v.F*t,0)+' N',cx2,h*0.64,k.bad,14,'center',1);
    txt(c,'σ = '+fmt(sig*t,0)+' MPa',cx2,h*0.64+22,k.ink,14,'center',1);
  },
  graph:function(c,w,h,v,t,k){
    var ym=nice(2*v.F),G=axes(c,w,h,{xmax:10,ymax:ym,xl:'S, mm²',yl:'σ, MPa'},k),s;
    c.strokeStyle=k.mut;c.lineWidth=2;c.setLineDash([5,4]);c.beginPath();
    for(s=0.5;s<=10.001;s+=0.1){var X=G.X(s),Y=G.Y(v.F/s);if(s===0.5)c.moveTo(X,Y);else c.lineTo(X,Y);}
    c.stroke();c.setLineDash([]);
    var sc=10+(v.S-10)*t;
    c.strokeStyle=k.pri;c.lineWidth=3.5;c.beginPath();c.moveTo(G.X(10),G.Y(v.F/10));
    if(sc<10){for(s=10;s>sc;s-=0.1){c.lineTo(G.X(s),G.Y(v.F/s));}}
    else{for(s=10;s<sc;s+=0.1){c.lineTo(G.X(s),G.Y(v.F/s));}}
    c.lineTo(G.X(sc),G.Y(v.F/sc));c.stroke();
    dot(c,G.X(sc),G.Y(v.F/sc),7,k.bad);
    txt(c,'σ = F / S  (S kamaysa, σ ortadi)',G.L+8,G.T+14,k.ink,12,'left',1);
  },

  {q:'Guk qonunining formulasi qaysi?',o:['F = k / Δl','F = k · Δl','F = Δl / k','F = k · Δl²'],a:1},
  {q:'Mexanik kuchlanishning SI dagi birligi qaysi?',o:['N','N·m','m²','Pa (N/m²)'],a:3},
  {q:"Kesim yuzi 1 mm² bo'lgan simga 100 N kuch ta'sir qilmoqda. Kuchlanish necha MPa?",o:['1 MPa','10 MPa','100 MPa','1000 MPa'],a:2},
  {q:"σ = 200 MPa va ε = 0,001 bo'lsa, Yung moduli E nimaga teng?",o:['200 GPa','200 MPa','20 GPa','2 GPa'],a:0},
  {q:"Kuchlanish elastiklik chegarasidan oshib ketsa, nima sodir bo'ladi?",o:["Deformatsiya butunlay yo'qoladi","Yuk olingach ham qoldiq (plastik) deformatsiya qoladi","Jism darhol suyuqlikka aylanadi","Yung moduli nolga teng bo'ladi"],a:1}
];

/* ---------- DVIGATEL ---------- */
var insts=[],tabBtns=[],tabsEl=$('#tabs'),mainEl=$('#main');
function dec(step){var s=String(step).split('.');return s[1]?s[1].length:0;}

function fit(cv,H){
  var W=cv.clientWidth;if(!W)return null;
  var d=Math.min(window.devicePixelRatio||1,2);
  if(cv._w!==W||cv._d!==d){cv._w=W;cv._d=d;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cv.style.height=H+'px';}
  var c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,H);c.lineCap='butt';c.setLineDash([]);c.globalAlpha=1;
  return {c:c,w:W,h:H};
}
function draw(I){
  if(!I.sec.classList.contains('on'))return;
  var k=colors(),a=fit(I.sc,260);
  if(a)I.p.scene(a.c,a.w,a.h,I.v,I.t,k);
  a=fit(I.gr,200);
  if(a)I.p.graph(a.c,a.w,a.h,I.v,I.t,k);
}
function refresh(I){
  var r=I.p.sim(I.v);
  I.out.innerHTML=r.out.map(function(o){return '<div>'+o[0]+'<b>'+o[1]+'</b></div>';}).join('');
  I.note.innerHTML=r.note;
  if(!I.run)I.t=1;
  draw(I);
}
function tick(I,now){
  if(!I.run)return;
  I.t=Math.min(1,I.t+(now-I.last)/3500);I.last=now;draw(I);
  if(I.t>=1){I.run=false;}else{I.raf=requestAnimationFrame(function(f){tick(I,f);});}
}
function play(I,reset){
  if(reset||I.t>=1)I.t=0;
  if(I.run)return;
  I.run=true;I.last=performance.now();
  I.raf=requestAnimationFrame(function(f){tick(I,f);});
}
function pause(I){I.run=false;cancelAnimationFrame(I.raf);}

function mk(p,i){
  var sec=document.createElement('section');
  sec.innerHTML='<h2>'+p.title+'</h2>'+
  '<div class="card"><h3>📘 Masala sharti</h3><p>'+p.cond+'</p></div>'+
  '<div class="grid2"><div class="card"><h3>Berilgan</h3>'+p.given.map(function(g){return '<div class="fm">'+g+'</div>';}).join('')+'</div>'+
  '<div class="card"><h3>Topish kerak</h3>'+p.find.map(function(g){return '<div class="fm">'+g+'</div>';}).join('')+'</div></div>'+
  '<div class="card"><h3>🧮 Bosqichma-bosqich yechim</h3>'+
  p.steps.map(function(s,kk){return '<div class="step"><b class="t">'+(kk+1)+'-qadam. '+s[0]+'</b><div>'+s[1]+'</div></div>';}).join('')+
  '<div class="row"><button class="btn nx">Keyingi qadam (0/'+p.steps.length+')</button><button class="btn sec rz">Qaytadan</button></div></div>'+
  '<div class="card"><h3>🎛️ Simulyatsiya va animatsiya</h3><div class="sls"></div><div class="out"></div><div class="note"></div>'+
  '<canvas class="sc"></canvas><canvas class="gr"></canvas>'+
  '<div class="row"><button class="btn go">▶ Boshlash</button><button class="btn sec st">⏸ To\'xtatish</button><button class="btn sec rs">↻ Qayta boshlash</button></div></div>'+
  '<div class="card"><h3>🌍 Hayotiy misol</h3><p>'+p.life+'</p></div>'+
  '<div class="card"><h3>✍️ Mustaqil masala</h3><p>'+p.ind.q+'</p>'+
  '<div class="row"><input class="ans" type="text" inputmode="decimal" placeholder="Javobni kiriting" aria-label="Javob"><span class="unit">'+p.ind.u+'</span></div>'+
  '<div class="row"><button class="btn ck">Tekshirish</button></div><div class="msg"></div>'+
  '<div class="sol"><b>To\'g\'ri yechim:</b>'+p.ind.sol+'</div></div>';
  mainEl.appendChild(sec);

  var I={p:p,sec:sec,v:{},t:1,run:false,sc:$('.sc',sec),gr:$('.gr',sec),out:$('.out',sec),note:$('.note',sec)};
  insts.push(I);

  /* yechim qadamlari */
  var steps=sec.querySelectorAll('.step'),shown=0,nx=$('.nx',sec);
  function upd(){
    nx.textContent=shown>=steps.length?'Yechim tugadi ✓':'Keyingi qadam ('+shown+'/'+steps.length+')';
    nx.disabled=shown>=steps.length;
  }
  nx.onclick=function(){if(shown<steps.length){steps[shown].classList.add('show');shown++;upd();}};
  $('.rz',sec).onclick=function(){steps.forEach(function(s){s.classList.remove('show');});shown=0;upd();};

  /* slayderlar */
  var box=$('.sls',sec);
  p.sl.forEach(function(s){
    I.v[s.k]=s.v;
    var d=dec(s.step),div=document.createElement('div');
    div.className='sl';
    div.innerHTML='<label><span>'+s.l+'</span><span class="val">'+fmt(s.v,d)+' '+s.u+'</span></label><input type="range" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+s.v+'" aria-label="'+s.l+'">';
    var inp=$('input',div),val=$('.val',div);
    inp.oninput=function(){I.v[s.k]=parseFloat(inp.value);val.textContent=fmt(I.v[s.k],d)+' '+s.u;refresh(I);};
    box.appendChild(div);
  });

  /* animatsiya tugmalari */
  $('.go',sec).onclick=function(){play(I,false);};
  $('.st',sec).onclick=function(){pause(I);};
  $('.rs',sec).onclick=function(){pause(I);play(I,true);};

  /* mustaqil masala */
  $('.ck',sec).onclick=function(){
    var raw=$('.ans',sec).value.replace(/\s/g,'').replace(',','.'),x=parseFloat(raw),m=$('.msg',sec);
    if(isNaN(x)){m.className='msg bad';m.textContent='Avval javobni raqam bilan kiriting.';return;}
    var ok=Math.abs(x-p.ind.ans)<=0.01*Math.abs(p.ind.ans);
    m.className='msg '+(ok?'ok':'bad');
    m.textContent=ok?"To'g'ri! ✓":"Noto'g'ri ✗. To'g'ri javob: "+fmt(p.ind.ans,2)+' '+p.ind.u;
    $('.sol',sec).classList.add('show');
  };
  upd();
  refresh(I);
}

function mkTest(){
  var sec=document.createElement('section');
  mainEl.appendChild(sec);
  var score=0,done=0;
  function render(){
    score=0;done=0;
    sec.innerHTML='<h2>📝 Test</h2><div class="card"><div id="tstat">Javob berildi: 0/'+Q.length+' · Ball: 0</div></div>'+
    Q.map(function(q,qi){
      return '<div class="card" data-q="'+qi+'"><h3>'+(qi+1)+'. '+q.q+'</h3>'+
      q.o.map(function(o,oi){return '<button class="opt" data-o="'+oi+'">'+'ABCD'[oi]+') '+o+'</button>';}).join('')+
      '<div class="msg"></div></div>';
    }).join('')+'<div class="card" id="tres" style="display:none"></div>';
  }
  sec.addEventListener('click',function(e){
    var rt=e.target.closest('#retry');
    if(rt){render();window.scrollTo(0,0);return;}
    var b=e.target.closest('.opt');if(!b)return;
    var card=b.closest('[data-q]');if(!card||card.dataset.done)return;
    card.dataset.done='1';
    var q=Q[+card.dataset.q],oi=+b.dataset.o,m=$('.msg',card),opts=card.querySelectorAll('.opt');
    if(oi===q.a){b.classList.add('ok');m.className='msg ok';m.textContent="To'g'ri! ✓";score++;}
    else{b.classList.add('bad');opts[q.a].classList.add('ok');m.className='msg bad';m.textContent="Noto'g'ri ✗. To'g'ri javob: "+'ABCD'[q.a];}
    done++;
    $('#tstat',sec).textContent='Javob berildi: '+done+'/'+Q.length+' · Ball: '+score;
    if(done===Q.length){
      var msg=score===5?'Ajoyib! Mavzuni mukammal o\'zlashtirdingiz.':score===4?'Juda yaxshi!':score===3?'Yaxshi, formulalarni yana bir bor takrorlang.':"Mavzuni qayta ko'rib chiqing va masalalarni yeching.";
      var r=$('#tres',sec);r.style.display='block';
      r.innerHTML='<h3>Natija</h3><div class="big">'+score+' / '+Q.length+'</div><p>'+msg+'</p><button class="btn" id="retry">Testni qayta topshirish</button>';
    }
  });
  render();
}

P.forEach(mk);
mkTest();

/* tablar */
var names=P.map(function(p){return p.tab;}).concat(['Test']);
names.forEach(function(n,i){
  var b=document.createElement('button');
  b.textContent=n;b.onclick=function(){show(i);};
  tabsEl.appendChild(b);tabBtns.push(b);
});
function show(i){
  var secs=mainEl.querySelectorAll('section');
  secs.forEach(function(s,j){s.classList.toggle('on',j===i);});
  tabBtns.forEach(function(b,j){b.classList.toggle('on',j===i);});
  insts.forEach(pause);
  if(tabBtns[i].scrollIntoView){try{tabBtns[i].scrollIntoView({inline:'center',block:'nearest'});}catch(e){}}
  if(i<insts.length){
    var I=insts[i];I.t=1;
    requestAnimationFrame(function(){draw(I);play(I,true);});
  }
  window.scrollTo(0,0);
}
window.addEventListener('resize',function(){insts.forEach(draw);});

/* mavzu almashtirgich */
var root=document.documentElement;
function setTheme(dark){
  root.setAttribute('data-theme',dark?'dark':'light');
  $('#themeBtn').textContent=dark?'☀️':'🌙';
  insts.forEach(draw);
}
$('#themeBtn').onclick=function(){setTheme(root.getAttribute('data-theme')!=='dark');};
setTheme(!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches));
show(0);
})();
</script>
