<header><div class="top"><h1>42-mavzu · Havoning nisbiy namligi</h1><button class="b g" id="thm" style="min-height:40px">🌓 Mavzu</button></div><nav id="nav"></nav></header>

<script>
const $=s=>document.querySelector(s),v=id=>+$('#'+id).value,C=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const T=[[15,[100,90,80,71,61,52,44,36]],[16,[100,90,81,71,62,54,46,37]],[18,[100,91,82,73,65,56,49,41]],[20,[100,91,83,74,66,59,51,44]],[22,[100,92,83,76,68,61,54,47]],[24,[100,92,84,77,69,62,56,49]],[26,[100,92,85,78,71,65,59,53]]];
const S=[[10,1.23,9.4],[12,1.40,10.7],[14,1.60,12.1],[16,1.81,13.6],[18,2.07,15.4],[20,2.34,17.3],[22,2.64,19.4],[24,2.99,21.8],[26,3.36,24.4],[28,3.78,27.2],[30,4.24,30.3]];
function lerp(a,x,g){const n=a.length;if(x<=a[0][0])return g(a[0]);if(x>=a[n-1][0])return g(a[n-1]);for(let i=1;i<n;i++)if(x<=a[i][0]){const p=a[i-1],q=a[i],k=(x-p[0])/(q[0]-p[0]);return g(p)+k*(g(q)-g(p))}}
const rt=t=>lerp(S,t,r=>r[2]);
function phi(td,dt){dt=Math.max(0,Math.min(7,dt));const f=Math.floor(dt),c=Math.min(7,f+1),k=dt-f;return lerp(T,td,r=>r[1][f]+k*(r[1][c]-r[1][f]))}
function dew(r){for(let i=1;i<S.length;i++)if(r<=S[i][2]){const a=S[i-1],b=S[i];return a[0]+(r-a[2])/(b[2]-a[2])*(b[0]-a[0])}return 30}
const rnd=(i,s)=>{const x=Math.sin(i*12.9898+s*78.233)*43758.5453;return x-Math.floor(x)};
const tri=(u,L)=>{u=((u%(2*L))+2*L)%(2*L);return u<L?u:2*L-u};
const sl=(id,l,a,b,s,x,u)=>`<label class="sl">${l}: <b id="${id}v">${x}</b> ${u}<input type="range" id="${id}" min="${a}" max="${b}" step="${s}" value="${x}"></label>`;
const psy=()=>'<div class="sc"><table><tr><th>t \\ Δt</th>'+[0,1,2,3,4,5,6,7].map(d=>`<th>${d}</th>`).join('')+'</tr>'+T.map((r,i)=>`<tr><th>${r[0]}°</th>`+r[1].map((x,j)=>`<td id="m${i}_${j}">${x}</td>`).join('')+'</tr>').join('')+'</table></div>';
const sat='<details><summary>To‘yingan bug‘ jadvali</summary><div class="sc"><table><tr><th>t,°C</th>'+S.map(r=>`<td>${r[0]}</td>`).join('')+'</tr><tr><th>p_t,kPa</th>'+S.map(r=>`<td>${r[1]}</td>`).join('')+'</tr><tr><th>ρ_t,g/m³</th>'+S.map(r=>`<td>${r[2]}</td>`).join('')+'</tr></table></div></details>';
const ST=[['Xona haroratini o‘lchang','Quruq termometrni xona havosida ushlab, t_quruq ni yozib oling.','Termometr'],['Nam termometrni doka bilan o‘rang','Ikkinchi termometr sharchasini toza doka (batist) bilan o‘rang.','Doka'],['Dokani suvga namlang','Doka uchini suvli stakanga tushiring, doka to‘la nam bo‘lsin.','Stakan'],['Psixrometrni o‘rnating','Ikkala termometrni yonma-yon, shamol va nafasdan uzoqda o‘rnating.','Psixrometr'],['Barqarorlashishini kuting','3–5 daqiqa kuting: nam termometr pasayib, o‘zgarmay qoladi.','Soat'],['Ko‘rsatkichlarni yozing','t_quruq va t_nam ni yozib, Δt = t_quruq − t_nam ni hisoblang.','Daftar'],['Jadvaldan φ ni toping','Qator — t_quruq, ustun — Δt. Kesishgan katak — φ.','Jadval']];
const PT=['Quruq termometr: xona havosining haqiqiy haroratini (t_quruq) ko‘rsatadi.','Nam termometr: sharchasi nam doka bilan o‘ralgan; bug‘lanish tufayli past harorat (t_nam) ko‘rsatadi.','Doka (batist): suvni shimib, termometr sharchasini doimo nam tutadi.','Stakan: toza suv. Doka uchi suvga tushiriladi.','Psixrometrik jadval: t_quruq va Δt bo‘yicha φ ni topish uchun.'];
const svg2=`<svg viewBox="0 0 320 200" style="width:100%;max-width:440px;color:var(--tx)">
<g class="pt" data-i="0"><rect x="40" y="20" width="14" height="110" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="44" y="55" width="6" height="75" fill="#e53935"/><circle cx="47" cy="138" r="12" fill="#e53935"/><text x="47" y="172" font-size="11" text-anchor="middle" fill="currentColor">quruq</text></g>
<g class="pt" data-i="1"><rect x="120" y="20" width="14" height="110" rx="7" fill="none" stroke="currentColor" stroke-width="2"/><rect x="124" y="80" width="6" height="50" fill="#e53935"/><circle cx="127" cy="138" r="12" fill="#e53935"/><text x="127" y="172" font-size="11" text-anchor="middle" fill="currentColor">nam</text></g>
<g class="pt" data-i="2"><ellipse cx="127" cy="140" rx="19" ry="20" fill="#e6ebef" fill-opacity=".7" stroke="#29b6f6" stroke-dasharray="3"/><path d="M127 160 Q140 185 215 180" fill="none" stroke="#29b6f6" stroke-width="5"/></g>
<g class="pt" data-i="3"><rect x="190" y="140" width="60" height="55" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="192" y="160" width="56" height="33" fill="#29b6f6" fill-opacity=".6"/><text x="220" y="130" font-size="11" text-anchor="middle" fill="currentColor">suv</text></g>
<g class="pt" data-i="4"><rect x="245" y="15" width="65" height="80" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><text x="277" y="60" font-size="11" text-anchor="middle" fill="currentColor">jadval</text></g></svg>`;
const P=[
{t:'1-reja. Ishning maqsadi va nazariy asos',
th:`<p><b>Maqsad:</b> psixrometr yordamida havoning nisbiy namligini aniqlash.</p><p><b>Absolyut namlik ρ</b> — 1 m³ havodagi suv bug‘i massasi (g/m³). <b>To‘yingan bug‘</b> — o‘z suyuqligi bilan dinamik muvozanatdagi bug‘; berilgan t da ρ eng ko‘pi ρ_t bo‘ladi. <b>Nisbiy namlik φ</b> — ρ ning shu haroratdagi ρ_t ga nisbati. <b>Shudring nuqtasi</b> — havo sovitilganda bug‘ to‘yinadigan harorat.</p>${sat}`,
f:`<small>Nisbiy namlik</small>φ = (p / p<sub>t</sub>)·100% = (ρ / ρ<sub>t</sub>)·100%`,
ex:`Toshkentda yozgi kunduzi havo 35°C gacha qiziydi, lekin quruq bo‘lgani uchun φ ko‘pincha 20–30% bo‘ladi. Kechasi sovigach φ ortadi, ertalab Samarqand bog‘larida shudring tushadi.`,
sim:sl('a1','Harorat t',10,30,1,22,'°C')+sl('b1','Bug‘ miqdori ρ',1,30,.5,9.7,'g/m³')+'<div class="out" id="o1"></div>',
qs:[{q:`Xonada 22°C da ρ = 9,7 g/m³ (ρ_t = 19,4 g/m³). φ necha %?`,a:50,t:.6,s:`φ = 9,7/19,4·100% = 50%`}]},
{t:'2-reja. Asbob-jihozlar va xavfsizlik',
th:`<p><b>Asboblar:</b> psixrometr (quruq va nam termometr), psixrometrik jadval, suv, doka (batist), stakan.</p><p><b>Nam termometr nega past?</b> Doka namligi bug‘lanadi. Bug‘lanishda eng tez molekulalar ketadi va issiqlik olinadi, shuning uchun nam termometr soviydi. Havo quruq bo‘lsa, bug‘lanish tez, Δt katta.</p><p><b>Xavfsizlik:</b> termometrni sindirmang; shisha buyumlarni ehtiyot bilan ushlang; singan bo‘lsa, o‘qituvchiga xabar bering.</p>`,
f:`<small>Bug‘lanishda sovish</small>Q = L · m  (bug‘lanish issiqlik oladi)`,
ex:`Buxoro va Xorazmda sopol ko‘za (xum) suvni salqin saqlaydi: ko‘za devoridan sizgan suv bug‘lanib, ko‘zani va ichidagi suvni sovitadi — nam termometr bilan bir xil hodisa.`,
sim:`<p>Qismlar ustiga bosing:</p>${svg2}<div class="out" id="o2">Qismni tanlang.</div>`,
qs:[{q:`Quruq termometr 21°C, nam termometr 17°C. Δt necha °C?`,a:4,t:.05,s:`Δt = 21 − 17 = 4°C`}]},
{t:'3-reja. Ishchi formula va psixrometrik jadval',
th:`<p>Avval Δt = t_quruq − t_nam hisoblanadi. Jadvalda <b>qator</b> — quruq termometr harorati, <b>ustun</b> — Δt; kesishgan katakda φ (%) turadi.</p><p><b>Δt qancha katta bo‘lsa, φ shuncha kichik:</b> havo quruq bo‘lsa, nam termometr ko‘proq soviydi.</p>`,
f:`<small>Ishchi formula</small>Δt = t<sub>quruq</sub> − t<sub>nam</sub>`,
ex:`Toshkentda yoz kechasi quruq termometr 24°C, nam termometr 20°C: Δt = 4°C, jadvaldan φ = 69%. Havo ancha nam, bu hol sezilarli dim bo‘lishini beradi.`,
sim:sl('a3','t_quruq',15,26,1,22,'°C')+sl('b3','t_nam',8,26,1,18,'°C')+'<div class="out" id="o3"></div>'+psy(),
qs:[{q:`t_quruq = 22°C, t_nam = 18°C. Jadvaldan φ (%) ni toping.`,a:68,t:.6,s:`Δt = 4°C, 22°C qatori, 4-ustun: 68%`}]},
{t:'4-reja. Ishni bajarish tartibi',
th:`<p>Ish 7 qadamda bajariladi. Eng muhimi: nam termometr ko‘rsatkichi to‘liq barqarorlashmaguncha o‘qimang va shamoldan, nafasdan uzoqda turing.</p>`,
f:`<small>Hisoblash</small>Δt = t<sub>quruq</sub> − t<sub>nam</sub>  →  φ (jadvaldan)`,
ex:`Maktab fizika xonasida darsdan oldin xonani shamollatib, so‘ng psixrometrni oynadan uzoqroqqa qo‘ysangiz, Farg‘ona vodiysidagi qishki sinfda ham aniq natija olinadi.`,
sim:sl('a4','Qadam',1,7,1,1,'/ 7')+'<button class="b h" id="n4">Keyingi qadam</button><svg id="lab" viewBox="0 0 320 150" style="width:100%;color:var(--tx)"></svg><ol id="l4"></ol>',
qs:[{q:`Tajribada quruq 20°C, nam 14°C. φ (%) necha?`,a:51,t:.6,s:`Δt = 6°C, 20°C qatori: 51%`}]},
{t:'5-reja. O‘lchash natijalari va hisoblash',
th:`<p>Tajriba 3 marta takrorlanadi va φ o‘rtachasi olinadi. Qiymatlarni o‘zgartirib ko‘ring. Tekshirish uchun <b>shudring nuqtasi usuli</b>: shudring nuqtasida ρ_shudring = ρ_t(t_sh).</p>`,
f:`<small>O‘rtacha va shudring usuli</small>φ<sub>o‘rt</sub> = (φ₁+φ₂+φ₃)/3;  φ = ρ<sub>shudring</sub> / ρ<sub>t</sub>(t) · 100%`,
ex:`Andijon xonadonida 22°C da quruq va nam termometr 22 va 17°C ko‘rsatsa, φ ≈ 61% — odam uchun biroz nam, shamollatish foydali.`,
sim:`<div class="sc"><table><tr><th>№</th><th>t_quruq</th><th>t_nam</th><th>Δt</th><th>φ,%</th></tr>${[[22,17],[22,16],[23,17]].map((r,i)=>`<tr><td>${i+1}</td><td><input type="number" id="td5_${i}" value="${r[0]}"></td><td><input type="number" id="tw5_${i}" value="${r[1]}"></td><td id="d5_${i}"></td><td id="f5_${i}"></td></tr>`).join('')}</table></div><label class="sl">Shudring nuqtasi t_sh, °C: <input type="number" id="sh5" value="14"></label><div class="out" id="o5"></div>`,
qs:[{q:`φ₁ = 61%, φ₂ = 54%, φ₃ = 55%. φ_o‘rt (%) ni toping.`,a:56.7,t:.2,s:`(61+54+55)/3 = 56,7%`}]},
{t:'6-reja. Xatoliklar, xulosa va masalalar',
th:`<p><b>Xato sabablari:</b> doka quruq bo‘lishi, shamol, termometrni kech o‘qish, nafas ta‘siri.</p><p><b>Qulay nisbiy namlik:</b> 40–60%. Past namlik terini, shilliq qavatni quritadi; yuqori namlik mog‘or va dimlik beradi.</p><p><b>Xulosa namunasi:</b> «Psixrometr yordamida xona havosining nisbiy namligi φ_o‘rt = ...% ekani aniqlandi. Natija me‘yorda (40–60%). Nisbiy xatolik ε = ...%.»</p>`,
f:`<small>Xatoliklar</small>Δφ = |φ<sub>o‘lch</sub> − φ<sub>o‘rt</sub>|;  ε = Δφ / φ<sub>o‘rt</sub> · 100%`,
ex:`Qishda markaziy isitish Toshkent xonalarida havoni quritadi (φ ~ 20–30%). Ho‘l sochiq osish yoki idishda suv qo‘yish namlikni 40–60% ga yaqinlashtiradi.`,
sim:sl('a6','φ_o‘lch',20,90,.1,54,'%')+sl('b6','φ_o‘rt',20,90,.1,56.7,'%')+'<div class="out" id="o6"></div>',
qs:[{q:`1) φ_o‘rt = 56,7%, φ_o‘lch = 54%. Δφ (%) ni toping.`,a:2.7,t:.1,s:`Δφ = |54−56,7| = 2,7`},{q:`2) Yuqoridagi masalada ε (%) ni toping.`,a:4.8,t:.2,s:`ε = 2,7/56,7·100% ≈ 4,8%`},{q:`3) 20°C da φ = 40%. ρ (g/m³) ni toping (ρ_t = 17,3).`,a:6.92,t:.1,s:`ρ = 0,4·17,3 ≈ 6,92`},{q:`4) 26°C da ρ = 12,1 g/m³ (ρ_t = 24,4). φ (%) ni toping.`,a:49.6,t:.5,s:`φ = 12,1/24,4·100% ≈ 49,6%`}]}];
const TQ=[[`Nisbiy namlik formulasi qaysi?`,['φ = (ρ / ρ_t)·100%','φ = (ρ_t / ρ)·100%','φ = ρ + ρ_t','φ = ρ·ρ_t'],0],[`Nam termometr nega past harorat ko‘rsatadi?`,['Doka sovuq','Bug‘lanish issiqlik oladi','Suv og‘ir','Termometr buzuq'],1],[`Δt kattalashsa, φ qanday o‘zgaradi?`,['Ortadi','O‘zgarmaydi','Kamayadi','Avval ortadi'],2],[`Shudring nuqtasi nima?`,['Suv qaynash harorati','Bug‘ to‘yinadigan harorat','Muz erish harorati','Eng yuqori harorat'],1],[`t=22°C, Δt=3°C bo‘lsa, jadvaldan φ ≈ ?`,['68%','83%','76%','61%'],2],[`Inson uchun qulay nisbiy namlik?`,['10–20%','40–60%','70–90%','95–100%'],1],[`Termometr sinsa nima qilasiz?`,['O‘zim yig‘aman','Mensimayman','O‘qituvchiga xabar beraman','Suv bilan yuvaman'],2],[`φ_o‘rt=50%, φ_o‘lch=47%. ε ≈ ?`,['3%','6%','0,06%','47%'],1]];
const U=[],D=[],R=[],TM=[],st={};let cur=0;
U[0]=()=>{const t=v('a1'),r=v('b1'),s=rt(t),f=Math.min(100,r/s*100);$('#o1').innerHTML=`ρ_t(${t}°C) = <b>${s.toFixed(1)}</b> g/m³<br>φ = <b>${f.toFixed(0)}%</b> ${r>s?'— havo to‘yingan, ortiqcha bug‘ kondensatlanadi':''}<br>Shudring nuqtasi ≈ <b>${dew(Math.min(r,s)).toFixed(1)}°C</b>`;rd(0)};
D[0]=(c,w,h,tm)=>{const t=v('a1'),r=v('b1'),s=rt(t),n=Math.round(r*2),dr=r>s?Math.round((r-s)/r*n):0,x0=20,y0=15,bw=w-40,bh=h-30,k=(t-10)/20;
c.fillStyle=C('--hot');c.globalAlpha=k*.25;c.fillRect(x0,y0,bw,bh);c.fillStyle=C('--cold');c.globalAlpha=(1-k)*.3;c.fillRect(x0,y0,bw,bh);c.globalAlpha=1;c.strokeStyle=C('--tx');c.lineWidth=2;c.strokeRect(x0,y0,bw,bh);
const sp=50+(t-10)*5;for(let i=0;i<n-dr;i++){const x=x0+4+tri(rnd(i,1)*bw+(rnd(i,2)-.5)*sp*tm,bw-8),y=y0+4+tri(rnd(i,3)*bh+(rnd(i,4)-.5)*sp*tm,bh-30);c.fillStyle='#f4f6f8';c.strokeStyle='#8899a6';c.lineWidth=1;c.beginPath();c.arc(x,y,4,0,7);c.fill();c.stroke()}
