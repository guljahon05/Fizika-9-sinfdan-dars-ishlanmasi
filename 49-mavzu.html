<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>49-mavzu. Laboratoriya ishi</title>
<style>
:root{--bg:#f3f6f9;--fg:#1d2733;--card:#fff;--ac:#2f80ed;--bd:#d3dae2}
[data-theme=dark]{--bg:#11161c;--fg:#e6ebf0;--card:#1b232c;--ac:#5ea1ff;--bd:#33414f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px}
h1{font-size:16px;margin:0}h2{font-size:17px;margin:6px 0}h3{font-size:15px;margin:8px 0 4px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:6px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
button,select,input{font:inherit}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer}
nav button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 12px;max-width:820px;margin:auto}
.pane{display:none}.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:8px 0}
canvas{display:block;width:100%;border:1px solid var(--bd);border-radius:10px;background:#fff}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
td,th{border:1px solid var(--bd);padding:4px 6px}
.ra{color:#e53935;font-weight:700}.rb{color:#1e63d6;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{background:#2e9d4f!important;color:#fff!important;border-color:#2e9d4f!important}
.opt.bad{background:#d33a3a!important;color:#fff!important;border-color:#d33a3a!important}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
input[type=range]{width:100%}
</style>
</head>
<body>
<header><h1>49-mavzu. Laboratoriya ishi: shishaning nur sindirish koʻrsatkichini aniqlash</h1><button id="theme">🌓</button></header>
<nav id="tabs"></nav>
<main id="panes"></main>

<script>
/* ===== Yordamchi funksiyalar va ranglar ===== */
const $=(s,e=document)=>e.querySelector(s);
const fmt=(x,d=2)=>x.toFixed(d).replace('.',',');
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI, clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const YEL='#e6a800',RED='#e53935',BLUE='#1e63d6',GRAY='#888',GREEN='rgba(120,220,130,.55)';
const MAT={'Oddiy shisha':1.5,'Flint shisha':1.6,'Kron shisha':1.52};
let rows=[];            // tajribalar: {a, b} (daraja)
const P=[];             // har bir rejaning holati: {t,playing,c,x,w,h,draw,reset}
let cur=0;

function clear(c,w,h){c.fillStyle='#fff';c.fillRect(0,0,w,h);}
function txt(c,s,x,y,col='#222',sz=13,al='left'){c.fillStyle=col;c.font=sz+'px sans-serif';c.textAlign=al;c.fillText(s,x,y);}
const lerp=(p,q,k)=>({x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k});

/* ===== Umumiy geometriya: havo → shisha plastinka → havo ===== */
function geo(w,h,a,n){
  const r=rad(a),b=Math.asin(Math.sin(r)/n);
  const x1=w*.08,x2=w*.92,y1=h*.4,y2=h*.68,L=h*.3;
  const O={x:w/2,y:y1},Pt={x:w/2+(y2-y1)*Math.tan(b),y:y2};
  return{r,b,x1,x2,y1,y2,L,O,P:Pt,
    S:{x:O.x-L*Math.sin(r),y:O.y-L*Math.cos(r)},
    E:{x:Pt.x+L*Math.sin(r),y:Pt.y+L*Math.cos(r)}};
}
function slab(c,g){c.fillStyle=GREEN;c.fillRect(g.x1,g.y1,g.x2-g.x1,g.y2-g.y1);
  c.strokeStyle=GRAY;c.lineWidth=1.5;c.strokeRect(g.x1,g.y1,g.x2-g.x1,g.y2-g.y1);}
function normal(c,g,f=1){c.setLineDash([5,4]);c.strokeStyle='#444';c.lineWidth=1;c.beginPath();
  const a=g.O.y-g.L,b=g.y2+g.L*.4;c.moveTo(g.O.x,a);c.lineTo(g.O.x,a+(b-a)*f);c.stroke();c.setLineDash([]);
  if(f>=1)txt(c,'normal',g.O.x+4,a+10,'#444',11);}
// Nurni (siniq chiziqni) f (0..1) qismigacha chizadi
function ray(c,pts,f,lw=3){
  const seg=[];let tot=0;
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);seg.push(d);tot+=d;}
  let rem=f*tot,hd=pts[0];
  c.strokeStyle=YEL;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.moveTo(hd.x,hd.y);
  for(let i=1;i<pts.length&&rem>0;i++){const k=Math.min(1,rem/seg[i-1]);
    hd=lerp(pts[i-1],pts[i],k);c.lineTo(hd.x,hd.y);rem-=seg[i-1];}
  c.stroke();
  if(f<1){c.fillStyle='#fff3b0';c.beginPath();c.arc(hd.x,hd.y,5,0,7);c.fill();c.lineWidth=1.5;c.stroke();}
}
function angles(c,g){
  const R=34,O=g.O,ma=-Math.PI/2-g.r/2,mb=Math.PI/2-g.b/2;c.lineWidth=2;
  c.strokeStyle=RED;c.beginPath();c.arc(O.x,O.y,R,-Math.PI/2-g.r,-Math.PI/2);c.stroke();
  c.strokeStyle=BLUE;c.beginPath();c.arc(O.x,O.y,R,Math.PI/2-g.b,Math.PI/2);c.stroke();
  txt(c,'α',O.x+(R+12)*Math.cos(ma),O.y+(R+12)*Math.sin(ma)+5,RED,16,'center');
  txt(c,'β',O.x+(R+12)*Math.cos(mb),O.y+(R+12)*Math.sin(mb)+5,BLUE,16,'center');
}
// To'liq sahna: plastinka, normal, nur, burchaklar
function scene(c,w,h,a,n,f){
  const g=geo(w,h,a,n);slab(c,g);normal(c,g);
  txt(c,'Havo',8,18,'#555');txt(c,'Shisha (n = '+fmt(n,2)+')',g.x1+6,g.y2-8,'#2a6b36');
  ray(c,[g.S,g.O,g.P,g.E],f);
  if(f>.33)angles(c,g);
  return g;
}

/* ===== Reja matnlari (sarlavha, nazariya, qoʻshimcha HTML) ===== */
const PANES=[
['Ishning maqsadi va nazariy asos',
 `<b>Maqsad:</b> yassi-parallel shisha plastinkaning nur sindirish koʻrsatkichini aniqlash.<br>
  <b>Snellius qonuni:</b> sinα / sinβ = n. Havodan shishaga oʻtganda <b>n = sinα / sinβ</b>.<br>
  <span class="ra">α</span> — tushish burchagi, <span class="rb">β</span> — sinish burchagi (ikkalasi ham <b>normal</b>dan, yaʼni chegaraga perpendikulyardan oʻlchanadi).`,''],
['Asbob-uskunalar',
 `Asboblar stolga birin-ketin qoʻyiladi. <b>Asbobga bosing</b> — nomi va vazifasi chiqadi.`,
 `<div class="card" id="info2">Asbobni tanlang…</div>`],
['Ishni bajarish tartibi',
 `Qadamlarni <b>Keyingi / Oldingi</b> tugmalari bilan koʻring yoki «Boshlash» bosib avtomatik kuzating.`,
 `<div class="bar"><button id="prev3">◀ Oldingi</button><button id="next3">Keyingi ▶</button></div><div class="card" id="st3"></div>`],
['Virtual laboratoriya (simulyatsiya)',
 `Tushish burchagi α ni va plastinka materialini tanlang. Nur yoʻli va n real vaqtda hisoblanadi.`,
 `<div class="card"><label>α = <b id="av">40</b>°</label><input type="range" id="al" min="10" max="80" value="40">
  <p>Material: <select id="mat">${Object.keys(MAT).map(k=>`<option>${k}</option>`).join('')}</select></p>
  <div id="ro"></div></div>
  <div class="bar"><button class="pri" id="rec">Oʻlchovni jadvalga yozish</button></div><div id="rm"></div>`],
['Oʻlchash natijalari va hisoblash',
 `n = sinα / sinβ. Oʻrtacha qiymat n<sub>oʻrt</sub>, absolyut xatolik Δn<sub>i</sub> = |n<sub>oʻrt</sub> − n<sub>i</sub>|, nisbiy xatolik ε = Δn<sub>oʻrt</sub> / n<sub>oʻrt</sub> · 100 %. Jadval namunaviy maʼlumot bilan toʻldirilgan; oʻz oʻlchovlaringizni 4-rejadan qoʻshing yoki «Tozalash» bosing.`,
 `<div class="scroll"><table id="tab"></table></div><div class="card" id="res"></div>
  <div class="bar"><button id="ex">Namunaviy 5 tajriba</button><button id="clr">Tozalash</button></div>`],
['Xulosa, xatoliklar va nazorat savollari',
 `Yorugʻlik shishada sekinlashadi: <b>v = c / n</b>. Animatsiyada havoda va shishada nur tezligi solishtiriladi.`,
 `<div class="card" id="xul"></div>
  <div class="card"><h3>Xatolik sabablari</h3><ul><li>Transportir aniqligi (taxminan 0,5°)</li><li>Ignalarni notoʻgʻri oʻrnatish</li><li>Plastinka chegarasini noaniq chizish</li></ul>
  <h3>Aniqlikni oshirish</h3><ul><li>Tajribalar sonini koʻpaytirish va oʻrtacha olish</li><li>Ingichka igna yoki lazer koʻrsatkichdan foydalanish</li><li>Ignalar orasidagi masofani kattaroq olish</li></ul></div>
  <h3>Nazorat savollari</h3>
  <details><summary>1. n nimani ifodalaydi?</summary><p>Muhitning optik zichligini: n = c / v — vakuumdagi yorugʻlik tezligi muhitdagidan necha marta katta ekanini koʻrsatadi.</p></details>
  <details><summary>2. Nima uchun yorugʻlik shishada sekinlashadi?</summary><p>Yorugʻlik modda atomlari bilan taʼsirlashadi, shu sababli v = c / n < c. Masalan, n = 1,5 da v = 2·10⁸ m/s.</p></details>
  <details><summary>3. α = 0° boʻlganda nur nima boʻladi?</summary><p>Nur normal boʻylab tushadi va sinmasdan toʻgʻri oʻtadi (β = 0°).</p></details>
  <h3>Mini-masala</h3>
  <div class="card">α = 45°, β = 28° boʻlsa, n ni toping.
  <details><summary>Yechimni koʻrish</summary><p>n = sin45° / sin28° = 0,707 / 0,469 ≈ <b>1,51</b></p></details></div>`]
];
const TABS=[...PANES.map((_,i)=>(i+1)+'-reja'),'Test'];

/* ===== Interfeys qurilishi ===== */
const tabs=$('#tabs'),panes=$('#panes');
TABS.forEach((t,i)=>{
  const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(i);tabs.appendChild(b);
  const s=document.createElement('section');s.className='pane';s.dataset.i=i;
  s.innerHTML=i<6?`<h2>${i+1}-reja. ${PANES[i][0]}</h2><div class="card">${PANES[i][1]}</div><canvas></canvas>
    <div class="bar"><button data-a="start" class="pri">Boshlash</button><button data-a="stop">Toʻxtatish</button><button data-a="reset">Qayta boshlash</button></div>${PANES[i][2]}`
    :`<h2>Test</h2><div class="card" id="tq"></div>`;
  panes.appendChild(s);
});
function show(i){cur=i;
  [...tabs.children].forEach((b,k)=>b.classList.toggle('on',k===i));
  document.querySelectorAll('.pane').forEach((s,k)=>s.classList.toggle('on',k===i));
  fitAll();}
function fit(p){ // canvas oʻlchami + devicePixelRatio
  const c=p.c,w=c.parentElement.clientWidth;if(!w)return;
  const h=Math.round(clamp(w*.8,260,400)),d=window.devicePixelRatio||1;
  c.style.height=h+'px';c.width=w*d;c.height=h*d;
  p.x=c.getContext('2d');p.x.setTransform(d,0,0,d,0,0);p.w=w;p.h=h;}
const fitAll=()=>P.forEach(fit);
addEventListener('resize',fitAll);
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';};

// Boshlash / Toʻxtatish / Qayta boshlash tugmalari
document.addEventListener('click',e=>{
  const a=e.target.dataset&&e.target.dataset.a;if(!a)return;
  const p=P[+e.target.closest('.pane').dataset.i];
  if(a==='start')p.playing=true;
  if(a==='stop')p.playing=false;
  if(a==='reset'){p.t=0;p.playing=true;p.reset&&p.reset();}
});

/* ===== Statistika (n, xatoliklar) ===== */
function stats(){
  const ns=rows.map(r=>Math.sin(rad(r.a))/Math.sin(rad(r.b)));
  const m=ns.length?ns.reduce((s,v)=>s+v,0)/ns.length:0;
  const dn=ns.map(v=>Math.abs(m-v));
  const dm=dn.length?dn.reduce((s,v)=>s+v,0)/dn.length:0;
  return{ns,m,dn,dm,eps:m?dm/m*100:0};
}
const sample=()=>{rows=[20,30,40,50,60].map(a=>({a,b:Math.round(deg(Math.asin(Math.sin(rad(a))/1.5))*2)/2}));};

/* ===== 1-reja: nazariya animatsiyasi ===== */
function plan1(c,w,h,t){
  clear(c,w,h);const f=clamp((t%5)/3.5);
  const g=scene(c,w,h,40,1.5,f);
  if(f>.5)txt(c,`α = 40°, β = ${fmt(deg(g.b),1)}°, n = sinα/sinβ = 1,50`,w/2,h-12,'#222',13,'center');
}

/* ===== 2-reja: asboblar ===== */
const IT=[
['Taxtacha','Qogʻozni mahkam ushlab turuvchi tekis asos.',.03,.04,.94,.92],
['Oq qogʻoz','Plastinka konturi va nur yoʻllari shu qogʻozga chiziladi.',.07,.08,.86,.84],
['Yassi-parallel shisha plastinka','Sindirish koʻrsatkichi aniqlanadigan asosiy jism.',.12,.14,.34,.16],
['Toʻgʻri chiziqli lineyka','Toʻgʻri chiziqlar va nur yoʻnalishlarini chizish uchun.',.12,.36,.55,.07],
['Transportir','Tushish va sinish burchaklarini oʻlchaydi.',.56,.1,.32,.2],
['Uchta igna (yoki lazer koʻrsatkich)','Nur yoʻnalishini belgilaydi: ignalar bir chiziqqa tushishi kerak.',.12,.52,.36,.34],
['Qalam','Nuqtalar va chiziqlarni qogʻozga belgilash uchun.',.55,.5,.32,.06]];
let sel2=-1;
function plan2(c,w,h,t){
  clear(c,w,h);
  IT.forEach((it,i)=>{
    const a=clamp((t-i*.7)/.5);if(a<=0)return;
    const x=it[2]*w,y=it[3]*h-(1-a)*25,ww=it[4]*w,hh=it[5]*h;
    c.globalAlpha=a;c.lineWidth=1;c.strokeStyle=GRAY;
    if(i===0){c.fillStyle='#a9743f';c.fillRect(x,y,ww,hh);}
    if(i===1){c.fillStyle='#fff';c.fillRect(x,y,ww,hh);c.strokeStyle='#ccc';c.strokeRect(x,y,ww,hh);}
    if(i===2){c.fillStyle=GREEN;c.fillRect(x,y,ww,hh);c.strokeRect(x,y,ww,hh);}
    if(i===3){c.fillStyle='#e8d9a0';c.fillRect(x,y,ww,hh);c.strokeRect(x,y,ww,hh);c.strokeStyle='#555';
      for(let k=0;k<=20;k++){c.beginPath();c.moveTo(x+ww*k/20,y);c.lineTo(x+ww*k/20,y+hh*(k%5?.3:.5));c.stroke();}}
    if(i===4){const cx=x+ww/2,cy=y+hh;c.fillStyle='rgba(170,210,255,.75)';c.beginPath();c.arc(cx,cy,ww/2,Math.PI,0);c.closePath();c.fill();c.stroke();
      for(let k=0;k<=18;k++){const q=Math.PI+Math.PI*k/18;c.beginPath();c.moveTo(cx+ww/2*Math.cos(q),cy+ww/2*Math.sin(q));
        c.lineTo(cx+(ww/2-8)*Math.cos(q),cy+(ww/2-8)*Math.sin(q));c.stroke();}}
    if(i===5){for(let k=0;k<3;k++){const px=x+ww*(.2+.3*k);c.strokeStyle='#555';c.lineWidth=2;c.beginPath();c.moveTo(px,y+8);c.lineTo(px,y+hh);c.stroke();
      c.fillStyle=RED;c.beginPath();c.arc(px,y+8,6,0,7);c.fill();}}
    if(i===6){c.fillStyle='#f4b400';c.fillRect(x+ww*.12,y,ww*.88,hh);c.fillStyle='#e8c9a0';c.beginPath();
      c.moveTo(x+ww*.12,y);c.lineTo(x,y+hh/2);c.lineTo(x+ww*.12,y+hh);c.fill();}
    c.globalAlpha=1;
    if(sel2===i){c.strokeStyle=BLUE;c.lineWidth=2;c.setLineDash([6,3]);c.strokeRect(x-3,y-3,ww+6,hh+6);c.setLineDash([]);}
  });
}
function init2(){
  const p=P[1];
  p.c.onclick=e=>{const r=p.c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    for(let i=IT.length-1;i>=0;i--){const it=IT[i];
      if(p.t>i*.7+.3&&x>=it[2]&&x<=it[2]+it[4]&&y>=it[3]&&y<=it[3]+it[5]){sel2=i;
        $('#info2').innerHTML=`<b>${it[0]}</b><br>${it[1]}`;return;}}};
  p.reset=()=>{sel2=-1;$('#info2').textContent='Asbobni tanlang…';};
}

/* ===== 3-reja: ishni bajarish tartibi ===== */
const STEPS=['Plastinkani oq qogʻozga qoʻyib, konturini qalam bilan chizing.',
'Tushuvchi nurni belgilang (A nuqta — nur kirish joyi).',
'Ikkita ignani tushuvchi nur yoʻnalishida oʻrnating.',
'Plastinka orqasidan qarab, uchinchi va toʻrtinchi ignani avvalgilari bilan bir chiziqqa keltiring.',
'Nurning plastinkadan chiqish nuqtasini (B) belgilang.',
'Sinган nurni (A dan B gacha) chizing va tashqi nurni davom ettiring.',
'A nuqtadan plastinka chegarasiga normal oʻtkazing.',
'Transportir bilan α va β burchaklarini oʻlchang.'];
const s3={step:0,sp:0,wait:0};
function setStep3(k){s3.step=clamp(k,0,7);s3.sp=0;s3.wait=0;$('#st3').innerHTML=`<b>${s3.step+1}/8-qadam.</b> ${STEPS[s3.step]}`;}
function pin(c,p,col){c.fillStyle=col;c.strokeStyle='#333';c.lineWidth=1;c.beginPath();c.arc(p.x,p.y,5,0,7);c.fill();c.stroke();}
function plan3(c,w,h,t,dt){
  clear(c,w,h);s3.sp+=dt/1.2;
  if(P[2].playing){s3.wait+=dt;if(s3.wait>3.5&&s3.step<7)setStep3(s3.step+1);}
  const s=s3.step,sp=clamp(s3.sp),g=geo(w,h,40,1.5);
  c.globalAlpha=s===0?sp:1;slab(c,g);c.globalAlpha=1;
  if(s>=1){ray(c,[g.S,g.O],s===1?sp:1,2);pin(c,g.S,'#444');pin(c,g.O,'#444');}
  if(s>=2){c.globalAlpha=s===2?sp:1;pin(c,lerp(g.S,g.O,.35),RED);pin(c,lerp(g.S,g.O,.7),RED);c.globalAlpha=1;}
  if(s>=3){c.globalAlpha=s===3?sp:1;
    c.setLineDash([3,4]);c.strokeStyle='#999';c.beginPath();c.moveTo(g.E.x,g.E.y);c.lineTo(g.P.x,g.P.y);c.stroke();c.setLineDash([]);
    pin(c,lerp(g.P,g.E,.4),'#c0392b');pin(c,lerp(g.P,g.E,.8),'#c0392b');
    c.fillStyle='#fff';c.strokeStyle='#333';c.beginPath();c.ellipse(g.E.x+6,g.E.y+6,13,7,0,0,7);c.fill();c.stroke();
    c.fillStyle='#333';c.beginPath();c.arc(g.E.x+6,g.E.y+6,3.5,0,7);c.fill();c.globalAlpha=1;}
  if(s>=4){txt(c,'A',g.O.x-14,g.O.y-8,'#222',14);pin(c,g.P,'#222');txt(c,'B',g.P.x+8,g.P.y-6,'#222',14);}
  if(s>=5)ray(c,[g.O,g.P,g.E],s===5?sp:1,3);
  if(s>=6)normal(c,g,s===6?sp:1);
  if(s>=7)angles(c,g);
}

/* ===== 4-reja: virtual laboratoriya ===== */
function plan4(c,w,h,t){
  clear(c,w,h);const a=+$('#al').value,n=MAT[$('#mat').value];
  scene(c,w,h,a,n,clamp((t%4)/2.5));
}
function upd4(){
  const a=+$('#al').value,n=MAT[$('#mat').value],b=deg(Math.asin(Math.sin(rad(a))/n));
  $('#av').textContent=a;
  $('#ro').innerHTML=`<span class="ra">α = ${a}°</span>, <span class="rb">β = ${fmt(b,1)}°</span><br>
   sinα = ${fmt(Math.sin(rad(a)),3)}, sinβ = ${fmt(Math.sin(rad(b)),3)}<br>n = sinα / sinβ = <b>${fmt(n,2)}</b>`;
  P[3].t=0;
}
function init4(){
  $('#al').oninput=upd4;$('#mat').onchange=upd4;
  $('#rec').onclick=()=>{
    if(rows.length>=10){$('#rm').textContent='Jadval toʻlgan (10 ta). 5-rejada «Tozalash» bosing.';return;}
    const a=+$('#al').value,n=MAT[$('#mat').value],b=deg(Math.asin(Math.sin(rad(a))/n));
    rows.push({a,b:Math.round(b*2)/2}); // transportir aniqligi: 0,5°
    renderTable();
    $('#rm').textContent=`№${rows.length} tajriba 5-rejadagi jadvalga qoʻshildi (β transportir aniqligida, 0,5° gacha yaxlitlandi).`;
  };
  upd4();
}

/* ===== 5-reja: jadval, hisob, grafik ===== */
function renderTable(){
  const st=stats();
  $('#tab').innerHTML='<tr><th>№</th><th>α (°)</th><th>β (°)</th><th>sinα</th><th>sinβ</th><th>n = sinα/sinβ</th><th>Δn</th></tr>'+
    rows.map((r,i)=>`<tr><td>${i+1}</td><td>${fmt(r.a,1)}</td><td>${fmt(r.b,1)}</td><td>${fmt(Math.sin(rad(r.a)),3)}</td><td>${fmt(Math.sin(rad(r.b)),3)}</td><td>${fmt(st.ns[i],3)}</td><td>${fmt(st.dn[i],3)}</td></tr>`).join('');
  if(!rows.length){$('#res').textContent='Jadval boʻsh. Tajriba qoʻshing.';$('#xul').textContent='Xulosa uchun avval jadvalni toʻldiring.';P[4].t=0;return;}
  $('#res').innerHTML=`${rows.length<5?'<b style="color:#d33a3a">Kamida 5 ta tajriba kerak!</b><br>':''}
   n<sub>oʻrt</sub> = ${fmt(st.m,3)}<br>Δn<sub>oʻrt</sub> = ${fmt(st.dm,3)}<br>ε = ${fmt(st.eps,1)} %<br>
   <b>Natija: n = ${fmt(st.m,2)} ± ${fmt(st.dm,2)}</b>`;
  $('#xul').innerHTML=`<b>Xulosa:</b> Tajribada shishaning sindirish koʻrsatkichi n = ${fmt(st.m,2)} ga teng boʻldi
   (n = ${fmt(st.m,2)} ± ${fmt(st.dm,2)}, nisbiy xatolik ε = ${fmt(st.eps,1)} %).`;
  P[4].t=0;
}
function plan5(c,w,h,t){
  clear(c,w,h);const L=46,B=h-38,T=14,R=w-16,gw=R-L,gh=B-T;
  const X=v=>L+v*gw,Y=v=>B-v*gh;
  c.strokeStyle='#333';c.lineWidth=1.5;c.beginPath();c.moveTo(L,T);c.lineTo(L,B);c.lineTo(R,B);c.stroke();
  for(let k=0;k<=5;k++){const v=k/5;c.strokeStyle='#e3e3e3';c.lineWidth=1;c.beginPath();c.moveTo(X(v),T);c.lineTo(X(v),B);c.moveTo(L,Y(v));c.lineTo(R,Y(v));c.stroke();
    txt(c,fmt(v,1),X(v),B+14,'#444',11,'center');txt(c,fmt(v,1),L-6,Y(v)+4,'#444',11,'right');}
  txt(c,'sinα',R,B+30,'#222',13,'right');txt(c,'sinβ',L+6,T+12,'#222',13);
  const st=stats();if(!rows.length)return;
  const vis=Math.min(rows.length,Math.floor(t/.5)+1);let sxy=0,sxx=0;
  rows.forEach(r=>{const x=Math.sin(rad(r.a)),y=Math.sin(rad(r.b));sxy+=x*y;sxx+=x*x;});
  const k=sxy/sxx;
  if(vis>=rows.length){c.strokeStyle=BLUE;c.lineWidth=2;c.beginPath();c.moveTo(X(0),Y(0));c.lineTo(X(1),Y(k));c.stroke();
    txt(c,`k = ${fmt(k,3)} ≈ 1/n = ${fmt(1/st.m,3)}`,R-4,B-10,BLUE,13,'right');}
  for(let i=0;i<vis;i++){const r=clamp(t/.5-i)*5.5;c.fillStyle=RED;c.beginPath();
    c.arc(X(Math.sin(rad(rows[i].a))),Y(Math.sin(rad(rows[i].b))),Math.min(5.5,r),0,7);c.fill();}
}
function init5(){
  $('#ex').onclick=()=>{sample();renderTable();};
  $('#clr').onclick=()=>{rows=[];renderTable();};
}

/* ===== 6-reja: yorugʻlik tezligi v = c/n ===== */
function plan6(c,w,h,t){
  clear(c,w,h);const n=stats().m||1.5,sp=w/3;
  c.fillStyle=GREEN;c.fillRect(0,h*.5,w,h*.36);c.strokeStyle=GRAY;c.strokeRect(0,h*.5,w,h*.36);
  const ya=h*.28,yg=h*.68,xa=(t*sp)%w,xg=(t*sp/n)%w;
  c.strokeStyle='#ddd';c.lineWidth=1;c.beginPath();c.moveTo(0,ya);c.lineTo(w,ya);c.moveTo(0,yg);c.lineTo(w,yg);c.stroke();
  [[xa,ya],[xg,yg]].forEach(p=>{c.fillStyle=YEL;c.beginPath();c.arc(p[0],p[1],9,0,7);c.fill();c.strokeStyle='#b88400';c.stroke();});
  txt(c,'Havo: v = c ≈ 3·10⁸ m/s',8,ya-18,'#222');
  txt(c,`Shisha: v = c/n = c/${fmt(n,2)} ≈ ${fmt(3/n,2)}·10⁸ m/s`,8,yg+38,'#1d5a2b');
}

/* ===== Test ===== */
const Q=[
{q:'Havodan shishaga oʻtganda sindirish koʻrsatkichi qaysi formula bilan topiladi?',o:['n = sinβ / sinα','n = sinα / sinβ','n = α / β','n = cosα / cosβ'],a:1},
{q:'Shishada yorugʻlik tezligi v bilan vakuumdagi tezligi c orasidagi bogʻlanish qaysi?',o:['v = c · n','v = c + n','v = c / n','v = n / c²'],a:2},
{q:'Tushish burchagi α = 0° boʻlsa, nur nima boʻladi?',o:['Toʻla qaytadi','Yutiladi','β = 90° boʻladi','Sinmasdan toʻgʻri oʻtadi'],a:3},
{q:'Nima uchun bir necha tajriba oʻtkazilib, n ning oʻrtacha qiymati olinadi?',o:['Tajriba chiroyli chiqishi uchun','Tasodifiy xatolikni kamaytirish uchun','Plastinkani tozalash uchun','Burchaklarni kattalashtirish uchun'],a:1},
{q:'α = 30°, β = 19,5° boʻlsa, n taxminan nechaga teng?',o:['0,67','1,0','2,0','1,5'],a:3}];
let qi=0,score=0;
function renderQ(){
  const b=$('#tq');
  if(qi>=Q.length){
    b.innerHTML=`<h3>Natija: ${score} / ${Q.length} ball</h3><p>${score===5?'Ajoyib!':score>=3?'Yaxshi, yana takrorlang.':'Mavzuni qayta koʻrib chiqing.'}</p><button class="pri" id="tr">Qayta boshlash</button>`;
    $('#tr').onclick=()=>{qi=0;score=0;renderQ();};return;}
  const q=Q[qi];
  b.innerHTML=`<p><b>${qi+1}/${Q.length}.</b> ${q.q}</p>`+q.o.map((o,i)=>`<button class="opt" data-i="${i}">${'ABCD'[i]}) ${o}</button>`).join('')+`<button class="pri" id="nx" hidden></button>`;
  b.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    const i=+btn.dataset.i;
    b.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===q.a)x.classList.add('ok');});
    if(i===q.a)score++;else btn.classList.add('bad');
    const nx=$('#nx');nx.hidden=false;nx.textContent=qi===Q.length-1?'Natijani koʻrish':'Keyingisi ▶';
  });
  $('#nx').onclick=()=>{qi++;renderQ();};
}

/* ===== Ishga tushirish ===== */
const DRAW=[plan1,plan2,plan3,plan4,plan5,plan6];
DRAW.forEach((d,i)=>{P[i]={t:0,playing:true,c:document.querySelectorAll('canvas')[i],x:null,w:0,h:0,draw:d};});
P[2].reset=()=>setStep3(0);
sample();setStep3(0);init2();init4();init5();renderTable();renderQ();
let last=0;
function loop(ts){ // requestAnimationFrame sikli
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  const p=P[cur];
  if(p&&p.x){if(p.playing)p.t+=dt;p.draw(p.x,p.w,p.h,p.t,dt);}
  requestAnimationFrame(loop);
}
show(0);requestAnimationFrame(loop);
