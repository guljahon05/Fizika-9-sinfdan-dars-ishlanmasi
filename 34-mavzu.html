<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>34-mavzu. Sirt taranglik koeffitsiyentini aniqlash</title>
<style>
:root{--bg:#f1f6fb;--card:#fff;--ink:#1d2b3a;--mut:#6b7c8e;--acc:#3b8fe8;--acc2:#e6f1fd;--warn:#f08a3c;--ok:#2fa56b;--bad:#e5484d;--bd:#dde7f1}
:root[data-theme=dark]{--bg:#0f1823;--card:#18242f;--ink:#e6eef6;--mut:#92a4b6;--acc:#5aa9ff;--acc2:#1f3347;--warn:#ffa45c;--ok:#4cc88a;--bad:#ff6b70;--bd:#2a3b4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;transition:background .3s,color .3s}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:15px;margin:0;flex:1;line-height:1.3}
#th{border:0;background:var(--acc2);color:var(--ink);font-size:22px;border-radius:14px;width:48px;height:48px;cursor:pointer}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--bg);scrollbar-width:none}
nav button{flex:0 0 auto;border:0;border-radius:16px;padding:12px 16px;font-size:15px;font-weight:600;background:var(--card);color:var(--ink);cursor:pointer;transition:.25s;border:1px solid var(--bd)}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc);transform:translateY(-1px)}
main{max-width:760px;margin:0 auto;padding:6px 12px 40px}
section{display:none;animation:in .35s}section.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin:12px 0;box-shadow:0 4px 14px rgba(30,60,100,.06)}
.card h3{margin:0 0 8px;font-size:17px}
.card ul,.card ol{margin:6px 0;padding-left:22px}
.formula{background:var(--acc2);border-radius:16px;padding:12px 14px;margin:8px 0;font:italic 20px/1.8 Georgia,serif;text-align:center;overflow-x:auto}
.formula small{font:14px system-ui;font-style:normal;color:var(--mut);display:block}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.3}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--bd);padding:6px;text-align:center}th{background:var(--acc2)}
canvas{width:100%;height:auto;background:var(--acc2);border-radius:16px;display:block}
label{display:block;margin:10px 0 2px;font-size:15px}
input[type=range]{width:100%;height:34px;accent-color:var(--acc)}
input[type=number],input[type=text],select{width:100%;padding:12px;font-size:16px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink)}
td input{padding:8px;text-align:center}
.btn{display:inline-block;border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:700;background:var(--acc);color:#fff;cursor:pointer;margin:6px 6px 0 0;transition:.2s}
.btn:active{transform:scale(.96)}.btn.s{background:var(--acc2);color:var(--ink)}
.out{background:var(--acc2);border-radius:14px;padding:10px 12px;margin-top:10px;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;min-height:70px;padding:8px;border:2px dashed var(--bd);border-radius:16px;margin:6px 0}
.tool{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 10px;font-size:14px;cursor:grab;text-align:center;min-width:76px;user-select:none}
.tool b{display:block;font-size:26px}
.step{padding:8px 10px;border-radius:12px;margin:4px 0;opacity:.5}.step.on{background:var(--acc2);opacity:1;font-weight:600}.step.done{opacity:1;color:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--ink);font-size:16px;cursor:pointer}
.opt.sel{border-color:var(--acc);background:var(--acc2)}.opt.right{border-color:var(--ok);background:rgba(47,165,107,.15)}.opt.wrong{border-color:var(--bad);background:rgba(229,72,77,.12)}
.exp{font-size:14px;color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<header><h1>34-mavzu. Laboratoriya ishi: suyuqlikning sirt taranglik koeffitsiyentini aniqlash</h1><button id="th" aria-label="Mavzu">🌙</button></header>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s),g=9.8;
const f=(x,d=3)=>(+x).toFixed(d).replace('.',',');
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const L=[{n:'Suv',s:.072},{n:'Spirt',s:.022},{n:'Kerosin',s:.024},{n:'Simob',s:.47}];
const sl=(id,t,mn,mx,st,v,u)=>`<label>${t}: <b id="${id}v">${v}</b> ${u}<input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${v}"></label>`;
const on=(id,fn)=>$('#'+id).addEventListener('input',fn);
const sel=(id,arr)=>`<select id="${id}">${arr.map((l,i)=>`<option value="${i}">${l.n} (σ = ${f(l.s)} N/m)</option>`).join('')}</select>`;
let C={};
function colors(){const s=getComputedStyle(document.documentElement);['ink','mut','acc','warn','ok','card'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
function setTheme(t){document.documentElement.dataset.theme=t;$('#th').textContent=t=='dark'?'☀️':'🌙';colors();try{drawS1()}catch(e){}}
$('#th').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');
function arrow(c,x1,y1,x2,y2,col,w=3){c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();const a=Math.atan2(y2-y1,x2-x1);c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-10*Math.cos(a-.4),y2-10*Math.sin(a-.4));c.lineTo(x2-10*Math.cos(a+.4),y2-10*Math.sin(a+.4));c.closePath();c.fill()}
function txt(c,s,x,y,col,sz=16,al='center'){c.fillStyle=col;c.font=`600 ${sz}px system-ui,sans-serif`;c.textAlign=al;c.fillText(s,x,y)}
const S5={res:[0,0,0],avg:0,tab:.072},S6={m:.07,l:0},S1={l:5,k:0};

/* ---------- ANIMATSIYALAR ---------- */
const AN=[
(c,t)=>{const y=170+55*Math.sin(t*1.4);c.fillStyle='rgba(90,169,255,.35)';c.fillRect(150,40,300,y-40);
c.strokeStyle=C.ink;c.lineWidth=5;c.beginPath();c.moveTo(150,270);c.lineTo(150,40);c.lineTo(450,40);c.lineTo(450,270);c.stroke();
c.strokeStyle=C.acc;c.lineWidth=9;c.beginPath();c.moveTo(150,y);c.lineTo(450,y);c.stroke();
arrow(c,300,y,300,y-45,C.warn,4);txt(c,'F = 2σl (parda tortadi)',300,y-55,C.warn,15);
arrow(c,300,y,300,y+45,C.ok,4);txt(c,'tashqi kuch',300,y+65,C.ok,15);txt(c,'Sovun pardasi',300,28,C.ink,16)},
(c,t)=>{const N=["💧 Tomizg'ich","💉 Shprits","🧪 Menzurka","⚖️ Tarozi","📏 Shtangensirkul","🥛 Stakan","🌊 Suyuqlik","🧻 Sochiq"];const k=Math.floor(t/.7)%12;
N.forEach((s,i)=>{const p=Math.max(0,Math.min(1,k-i+(t%.7)/.7*(k==i?1:0)));if(k<=i&&k!=i)return;const a=k>i?1:(t%.7)/.7,x=80+(i%4)*145,y=90+Math.floor(i/4)*110;
c.globalAlpha=a;c.font=`${26+8*(1-a)}px system-ui`;c.textAlign='center';c.fillStyle=C.ink;c.fillText(s.split(' ')[0],x,y);txt(c,s.split(' ').slice(1).join(' '),x,y+26,C.ink,13);c.globalAlpha=1})},
(c,t)=>{const T=3.2,p=(t%T)/T;c.fillStyle=C.mut;c.beginPath();c.moveTo(270,5);c.lineTo(330,5);c.lineTo(312,70);c.lineTo(288,70);c.closePath();c.fill();
let y,r;if(p<.7){r=4+24*(p/.7);y=70+r}else{const q=(p-.7)/.3;r=28;y=98+q*q*165}
c.fillStyle='rgba(90,169,255,.85)';c.beginPath();c.arc(300,y,r,0,7);c.fill();
if(p<.7){arrow(c,355,y,355,y+20+r,C.warn,3);txt(c,'mg',385,y+r,C.warn,15);arrow(c,245,y+20+r,245,y,C.ok,3);txt(c,'σπd',212,y+r,C.ok,15)}
else txt(c,'Tomchi uzildi: mg > σπd',300,40,C.warn,15);c.fillStyle=C.mut;c.fillRect(100,288,400,4)},
(c,t)=>{const n=Math.floor(t/.25)%101,ph=(t%.25)/.25,top=270-n;c.fillStyle=C.mut;c.beginPath();c.moveTo(270,5);c.lineTo(330,5);c.lineTo(312,60);c.lineTo(288,60);c.closePath();c.fill();
c.fillStyle='rgba(90,169,255,.7)';c.fillRect(242,top,116,270-top);c.strokeStyle=C.ink;c.lineWidth=4;c.beginPath();c.moveTo(240,150);c.lineTo(240,272);c.lineTo(360,272);c.lineTo(360,150);c.stroke();
if(n<100){c.beginPath();c.arc(300,66+ph*ph*Math.max(10,top-80),7,0,7);c.fillStyle='rgba(90,169,255,.9)';c.fill()}
txt(c,`n = ${n}`,480,100,C.ink,20);txt(c,`M = ${f(n*.036,2)} g`,480,140,C.warn,20);txt(c,'(1 tomchi ≈ 0,036 g)',480,170,C.mut,13)},
(c,t)=>{const v=[...S5.res,S5.avg,S5.tab],lb=['1-tajriba','2-tajriba','3-tajriba',"O'rtacha",'Jadval'],mx=Math.max(...v,.01)*1.25,gr=Math.min(1,(t%5)/1.2),e=1-Math.pow(1-gr,3);
c.strokeStyle=C.mut;c.lineWidth=2;c.beginPath();c.moveTo(30,255);c.lineTo(580,255);c.stroke();
v.forEach((x,i)=>{const h=x/mx*200*e,xx=45+i*108;c.fillStyle=i<3?C.acc:i==3?C.warn:C.ok;c.beginPath();c.roundRect(xx,255-h,76,h,10);c.fill();txt(c,f(x),xx+38,248-h,C.ink,14);txt(c,lb[i],xx+38,278,C.ink,13)});txt(c,'σ (N/m)',50,22,C.mut,13)},
(c,t)=>{const X=v=>40+v/.5*520,tb=L[S6.l].s,m=S6.m*Math.min(1,(t%4)/1.5);c.strokeStyle=C.ink;c.lineWidth=3;c.beginPath();c.moveTo(40,150);c.lineTo(560,150);c.stroke();
for(let i=0;i<=5;i++){c.beginPath();c.moveTo(X(i/10),143);c.lineTo(X(i/10),157);c.stroke();txt(c,f(i/10,1),X(i/10),175,C.mut,12)}
c.fillStyle=C.ok;c.beginPath();c.moveTo(X(tb),148);c.lineTo(X(tb)-9,120);c.lineTo(X(tb)+9,120);c.fill();txt(c,'Jadval '+f(tb),Math.min(Math.max(X(tb),70),530),108,C.ok,14);
c.fillStyle=C.warn;c.beginPath();c.moveTo(X(m),152);c.lineTo(X(m)-9,180);c.lineTo(X(m)+9,180);c.fill();txt(c,"O'lchangan "+f(m),Math.min(Math.max(X(m),70),530),210,C.warn,14);
c.strokeStyle=C.bad;c.lineWidth=5;c.beginPath();c.moveTo(X(tb),150);c.lineTo(X(m),150);c.stroke();txt(c,'Δσ = '+f(Math.abs(tb-m)),300,60,C.bad,17);txt(c,'σ shkalasi, N/m',300,250,C.mut,13)}
];

/* ---------- SIMULYATSIYALAR ---------- */
function drawS1(){const cv=$('#s1');if(!cv)return;const c=cv.getContext('2d'),W=600,H=260;c.clearRect(0,0,W,H);
c.fillStyle='rgba(90,169,255,.18)';c.fillRect(0,92,W,H);c.strokeStyle=C.acc;c.lineWidth=3;c.beginPath();c.moveTo(0,92);c.lineTo(W,92);c.stroke();txt(c,'havo',40,60,C.mut,14);txt(c,'suyuqlik',45,125,C.mut,14);
const P=(r,k)=>[30+k*45+(r%2)*22,108+r*38];
for(let r=0;r<5;r++)for(let k=0;k<13;k++){const[x,y]=P(r,k);c.fillStyle=C.acc;c.globalAlpha=.75;c.beginPath();c.arc(x,y,9,0,7);c.fill();c.globalAlpha=1}
const[sx,sy]=P(0,6),[ix,iy]=P(3,6);
for(let a=0;a<360;a+=60){const q=a*Math.PI/180;arrow(c,ix,iy,ix+30*Math.cos(q),iy+30*Math.sin(q),C.ok,2.5)}
txt(c,'ichkarida: kuchlar muvozanatda',ix,iy+48,C.ok,13);
[0,60,120,180].forEach(a=>{const q=a*Math.PI/180;arrow(c,sx,sy,sx+30*Math.cos(q),sy+30*Math.sin(q),C.warn,2.5)});
const L2=22+L[S1.k].s*150;arrow(c,sx,sy,sx,sy+L2,'#e5484d',5);txt(c,'sirtda: teng ta’sir etuvchi ↓',sx,sy-18,C.warn,13)}
function sim1(e){e.innerHTML=`<canvas id="s1" width="600" height="260"></canvas>${sel('k1',L)}${sl('l1','Uzunlik l',1,20,1,5,'cm')}<div class="out" id="o1"></div>`;
const u=()=>{S1.k=+$('#k1').value;S1.l=+$('#l1').value;$('#l1v').textContent=S1.l;const F=L[S1.k].s*S1.l/100;$('#o1').innerHTML=`F = σ·l = ${f(L[S1.k].s)} · ${f(S1.l/100,2)} = <b>${f(F*1000,2)} mN</b> (${f(F,5)} N)`;drawS1()};
on('k1',u);on('l1',u);u()}
const TOOLS=[["💧","Tomizg'ich","Suyuqlikni bir xil tomchilab tomizadi."],["💉","Shprits","Tomizg'ich o'rnida ishlatiladi."],["🧪","Menzurka","Suyuqlik hajmini o'lchaydi."],["⚖️","Elektron tarozi","Stakan massasini 0,01 g aniqlikda o'lchaydi."],["📏","Shtangensirkul","Tomizg'ich uchi diametri d ni o'lchaydi."],["🥛","Stakan","Tomchilar yig'iladigan idish."],["🌊","Suyuqlik","Suv va spirt."],["🧻","Sochiq","To'kilganini artish uchun."]];
function sim2(e){let pl=[];const R=()=>{const mk=(a)=>a.map(i=>`<div class="tool" draggable="true" data-i="${i}"><b>${TOOLS[i][0]}</b>${TOOLS[i][1]}</div>`).join('');
$('#z1').innerHTML=mk(TOOLS.map((_,i)=>i).filter(i=>!pl.includes(i)))||'—';$('#z2').innerHTML=mk(pl)||'<span style="color:var(--mut)">Asboblarni shu yerga bosing yoki sudrang</span>';$('#c2').textContent=pl.length;
document.querySelectorAll('.tool').forEach(t=>{const i=+t.dataset.i;t.onclick=()=>{pl=pl.includes(i)?pl.filter(x=>x!=i):[...pl,i];$('#i2').innerHTML=`<b>${TOOLS[i][1]}</b>: ${TOOLS[i][2]}`;R()};t.ondragstart=ev=>ev.dataTransfer.setData('t',i)})};
e.innerHTML=`<b>Asboblar javoni</b><div class="tools" id="z1"></div><b>Ish stoli (<span id="c2">0</span>/8)</b><div class="tools" id="z2"></div><div class="out" id="i2">Asbobni bosing — nomi va vazifasi chiqadi.</div>`;
[['z1',1],['z2',0]].forEach(([id,rm])=>{const z=$('#'+id);z.ondragover=ev=>ev.preventDefault();z.ondrop=ev=>{ev.preventDefault();const i=+ev.dataTransfer.getData('t');pl=rm?pl.filter(x=>x!=i):pl.includes(i)?pl:[...pl,i];R()}});R()}
function sim3(e){e.innerHTML=sl('M3','M (n ta tomchi massasi)',.5,10,.1,3.6,'g')+sl('n3','n (tomchilar soni)',20,150,1,100,'ta')+sl('d3','d (tomizg\'ich uchi diametri)',.5,4,.1,1.6,'mm')+'<div class="out" id="o3"></div>';
const u=()=>{const M=+$('#M3').value,n=+$('#n3').value,d=+$('#d3').value;$('#M3v').textContent=M;$('#n3v').textContent=n;$('#d3v').textContent=d;const s=M/1000*g/(n*Math.PI*d/1000),b=L.reduce((a,l)=>Math.abs(l.s-s)<Math.abs(a.s-s)?l:a);
$('#o3').innerHTML=`σ = ${f(M/1000,4)}·9,8 / (${n}·π·${f(d/1000,4)}) = <b>${f(s)} N/m</b><br>Jadvalga eng yaqin: ${b.n} (${f(b.s)} N/m)`};['M3','n3','d3'].forEach(i=>on(i,u));u()}
const ST=["Bo'sh stakanni tarozida o'lchang (m₀ = 42,30 g).","Tomizg'ichni suyuqlik bilan to'ldiring.","n = 100 ta tomchini sanab, stakanga tomizing.","Stakanni qayta torting, M = m₁ − m₀ ni toping.","Shtangensirkul bilan tomizg'ich uchi diametri d ni o'lchang.","σ ni formula bo'yicha hisoblang.","Tajribani 3 marta takrorlab, o'rtachasini oling."];
function sim4(e){let k=0,n=0;e.innerHTML=`<div id="st"></div><div class="out" id="o4"></div><button class="btn" id="nx">Keyingi qadam ▶</button><button class="btn s" id="dr">+10 tomchi 💧</button><button class="btn s" id="rs">Qaytadan</button>`;
const R=()=>{$('#st').innerHTML=ST.map((s,i)=>`<div class="step ${i<k?'done':i==k?'on':''}">${i+1}) ${s}</div>`).join('');const m=k<1?'—':f(42.3+(k>=3?n*.036:0),2)+' g';
$('#o4').innerHTML=`Tomchilar: <b>${n}</b> ta · Tarozi: <b>${m}</b>${k>=4?` · M = <b>${f(n*.036,2)} g</b>`:''}`;$('#dr').disabled=k!=2;$('#dr').style.opacity=k==2?1:.4};
$('#nx').onclick=()=>{if(k==2&&n<100)n=100;if(k<ST.length)k++;R()};$('#dr').onclick=()=>{if(k==2){n=Math.min(100,n+10);R()}};$('#rs').onclick=()=>{k=0;n=0;R()};R()}
const DAT=[[[100,3.6,1.6],[100,3.7,1.6],[100,3.5,1.6]],[[100,1.1,1.6],[100,1.15,1.6],[100,1.12,1.6]]];
function sim5(e){let rows='';for(let j=0;j<3;j++)rows+=`<tr><td>${j+1}</td><td><input type="number" id="n5${j}"></td><td><input type="number" step="any" id="M5${j}"></td><td><input type="number" step="any" id="d5${j}"></td><td id="s5${j}">—</td></tr>`;
e.innerHTML=`<label>Suyuqlik</label><select id="l5"><option value="0">Suv (0,072)</option><option value="1">Spirt (0,022)</option></select><div style="overflow-x:auto"><table><tr><th>№</th><th>n</th><th>M (g)</th><th>d (mm)</th><th>σ (N/m)</th></tr>${rows}</table></div><div class="out" id="o5"></div><button class="btn s" id="r5">Namunaviy qiymatlar</button>`;
const fill=()=>{DAT[+$('#l5').value].forEach((r,j)=>{$('#n5'+j).value=r[0];$('#M5'+j).value=r[1];$('#d5'+j).value=r[2]});u()};
const u=()=>{let sum=0,c=0;S5.tab=L[+$('#l5').value].s;for(let j=0;j<3;j++){const n=+$('#n5'+j).value,M=+$('#M5'+j).value,d=+$('#d5'+j).value,s=n>0&&M>0&&d>0?M/1000*g/(n*Math.PI*d/1000):0;S5.res[j]=s;$('#s5'+j).textContent=s?f(s):'—';if(s){sum+=s;c++}}
S5.avg=c?sum/c:0;const D=Math.abs(S5.tab-S5.avg);$('#o5').innerHTML=c?`σ<sub>o'rt</sub> = ${f(S5.avg)} N/m<br>σ<sub>jadval</sub> = ${f(S5.tab)} N/m<br>Δσ = ${f(D)} N/m, ε = ${f(D/S5.tab*100,1)} %`:'Qiymatlarni kiriting.'};
['l5','r5'].forEach(i=>0);$('#l5').onchange=fill;$('#r5').onclick=fill;document.querySelectorAll('td input').forEach(i=>i.oninput=u);fill()}
function sim6(e){e.innerHTML=`<label>Jadval qiymati uchun suyuqlik</label>${sel('l6',L)}${sl('m6',"O'lchangan σ<sub>o'rt</sub>",.005,.5,.001,.07,'N/m')}<div class="out" id="o6"></div>`;
const u=()=>{S6.l=+$('#l6').value;S6.m=+$('#m6').value;$('#m6v').textContent=f(S6.m);const t=L[S6.l].s,D=Math.abs(t-S6.m);$('#o6').innerHTML=`Δσ = |${f(t)} − ${f(S6.m)}| = <b>${f(D)} N/m</b><br>ε = Δσ/σ<sub>jadval</sub>·100% = <b>${f(D/t*100,1)} %</b>`};
on('l6',()=>{$('#m6').value=L[+$('#l6').value].s*.95;u()});on('m6',u);u()}

/* ---------- REJALAR ---------- */
const P=[
{t:'1 Nazariya',h:'Ishning maqsadi va nazariy asos',
th:`<b>Maqsad:</b> suyuqlikning sirt taranglik koeffitsiyenti σ ni <b>tomchi usulida</b> aniqlash.<br>Suyuqlik ichidagi molekulaga barcha tomondan teng kuch ta'sir qiladi. Sirtdagi molekula esa faqat pastdan va yon tomonlardan tortiladi, shuning uchun sirt qatlami tarang parda kabi qisqarishga intiladi. Sirt qatlami ortiqcha <b>sirt energiyasiga</b> ega bo'ladi.
<table><tr><th>Suyuqlik (20°C)</th><th>Suv</th><th>Spirt</th><th>Kerosin</th><th>Simob</th></tr><tr><td>σ, N/m</td><td>0,072</td><td>0,022</td><td>0,024</td><td>0,47</td></tr></table>`,
fo:`F = σ·l &nbsp;⇒&nbsp; σ = ${fr('F','l')}<small>Birligi: [σ] = N/m. F — sirt taranglik kuchi, l — suyuqlik sirtini chegaralovchi chiziq uzunligi</small>`,
ex:`Suv ustida hasharotlar (suv chaqaloqi) cho'kmay yuguradi, igna ehtiyotlik bilan qo'yilsa suzadi, yomg'ir tomchisi esa sharsimon shaklga intiladi — hammasi sirt taranglik tufayli.`,
sim:sim1,pr:[{q:`Spirtning σ = 0,022 N/m. Uzunligi l = 8 cm bo'lgan chiziq bo'ylab sirt taranglik kuchi F necha mN?`,a:1.76,u:'mN',tol:.02,sol:'F = 0,022·0,08 = 0,00176 N = 1,76 mN'}]},
{t:'2 Asboblar',h:'Asbob-jihozlar va xavfsizlik',
th:`<b>Asboblar:</b> tomizg'ich (pipetka) yoki shprits, o'lchov silindri (menzurka), elektron tarozi, shtangensirkul, stakan, tekshiriladigan suyuqlik (suv, spirt), sochiq.<br><b>Xavfsizlik:</b><ul><li>Shisha idishlarni ehtiyotlik bilan ishlating.</li><li>Spirt yonuvchan — olovdan uzoqda tuting.</li><li>To'kilgan suyuqlikni darhol sochiq bilan arting.</li><li>Ishdan keyin qo'llarni yuving.</li></ul>`,
fo:`m = ${fr('M','n')}<small>Tarozi aniqligi 0,01 g, shtangensirkul aniqligi 0,1 mm</small>`,
ex:`Dorixonada ko'z tomchilari tomizg'ich bilan beriladi: tomchilar soni aniq bo'lsa, dori miqdori ham aniq bo'ladi.`,
sim:sim2,pr:[{q:`100 ta tomchining massasi 3,60 g. Bitta tomchi massasi necha mg?`,a:36,u:'mg',tol:.5,sol:'m = 3,60 g / 100 = 0,036 g = 36 mg'}]},
{t:'3 Formula',h:'Ishchi formula',
th:`Tomchi uzilish paytida <b>og'irlik kuchi sirt taranglik kuchiga teng</b>: mg = σ·π·d. Bitta tomchi massasi m = M/n (M — n ta tomchining umumiy massasi).<br><b>Qo'shimcha usul:</b> kapillyar naychada suyuqlik ko'tarilishi (cosθ ≈ 1).`,
fo:`mg = σπd, &nbsp; m = ${fr('M','n')}<br>σ = ${fr('M·g','n·π·d')}, &nbsp; g = 9,8 m/s²<br>σ = ${fr('ρ·g·r·h','2')}<small>kapillyar usul</small>`,
ex:`M = 3,6 g, n = 100, d = 1,6 mm bo'lsa: σ = ${fr('0,0036·9,8','100·3,14·0,0016')} ≈ 0,070 N/m (suv uchun jadval qiymatiga yaqin).`,
sim:sim3,pr:[{q:`M = 2,2 g, n = 80, d = 1,4 mm bo'lsa σ necha N/m? (g = 9,8)`,a:.0613,u:'N/m',tol:.002,sol:'σ = 0,0022·9,8/(80·π·0,0014) ≈ 0,061 N/m'}]},
{t:'4 Tartib',h:'Ishni bajarish tartibi',
th:`<ol>${ST.map(s=>`<li>${s.replace(' (m₀ = 42,30 g)','')}</li>`).join('')}</ol>Tomchilarni bir xil tezlikda, sekin tomizing va sanashda adashmang.`,
fo:`M = m<sub>1</sub> − m<sub>0</sub>, &nbsp; σ = ${fr('M·g','n·π·d')}`,
ex:`Oshxonada tomizg'ich bilan limon sharbatini tomizish: tomchilar sonidan miqdorni taxmin qilish mumkin.`,
sim:sim4,pr:[{q:`Bo'sh stakan 42,30 g, tomchilar tomizilgandan keyin 45,90 g. M necha g?`,a:3.6,u:'g',tol:.02,sol:'M = 45,90 − 42,30 = 3,60 g'}]},
{t:'5 Natija',h:"O'lchash natijalari va hisoblash",
th:`Natijalar jadvalga yoziladi. Namunaviy ma'lumotlar:<table><tr><th>№</th><th>n</th><th>M (g)</th><th>d (mm)</th></tr><tr><td>1</td><td>100</td><td>3,6</td><td>1,6</td></tr><tr><td>2</td><td>100</td><td>3,7</td><td>1,6</td></tr><tr><td>3</td><td>100</td><td>3,5</td><td>1,6</td></tr></table>`,
fo:`σ<sub>o'rt</sub> = ${fr('σ₁ + σ₂ + σ₃','3')}`,
ex:`Laboratoriyalarda o'lchash bir necha marta takrorlanadi va o'rtacha olinadi — tasodifiy xatolik kamayadi.`,
sim:sim5,pr:[{q:`σ₁ = 0,068; σ₂ = 0,071; σ₃ = 0,074 N/m. σ o'rtachasi necha N/m?`,a:.071,u:'N/m',tol:.0005,sol:'(0,068+0,071+0,074)/3 = 0,071 N/m'}]},
{t:'6 Xatolik',h:'Xatoliklar, xulosa va masalalar',
th:`<b>Xatolik sabablari:</b> tomchilarni noto'g'ri sanash, d ni noaniq o'lchash, harorat, suyuqlik ifloslanishi.<br><b>Xulosa namunasi:</b> <i>«Tomchi usulida suvning sirt taranglik koeffitsiyenti σ = ... N/m deb topildi. Jadval qiymati 0,072 N/m. Nisbiy xatolik ε = ...%. Xatolik tomchilarni sanash va d ni o'lchash aniqligi bilan bog'liq.»</i>`,
fo:`Δσ = |σ<sub>jadval</sub> − σ<sub>o'rt</sub>|<br>ε = ${fr('Δσ','σ<sub>jadval</sub>')}·100%`,
ex:`Sanoatda sirt taranglik o'lchanib, yuvish vositalari va bo'yoqlarning sifati nazorat qilinadi.`,
sim:sim6,pr:[
{q:`(1) F = σ·l. l = 5 cm, σ = 0,072 N/m. F necha mN?`,a:3.6,u:'mN',tol:.02,sol:'F = 0,072·0,05 = 0,0036 N = 3,6 mN'},
{q:`(2) Sovun pardasi F = 2σl. σ = 0,04 N/m, l = 6 cm. F necha mN?`,a:4.8,u:'mN',tol:.05,sol:'F = 2·0,04·0,06 = 0,0048 N = 4,8 mN'},
{q:`(3) 50 ta tomchi massasi 1,8 g, d = 1,5 mm. σ necha N/m?`,a:.075,u:'N/m',tol:.002,sol:'σ = 0,0018·9,8/(50·π·0,0015) ≈ 0,075 N/m'},
{q:`(4) σ<sub>jadval</sub> = 0,072, σ<sub>o'rt</sub> = 0,069 N/m. Nisbiy xatolik ε necha %?`,a:4.17,u:'%',tol:.1,sol:'Δσ = 0,003; ε = 0,003/0,072·100% ≈ 4,2%'}]}];

const TEST=[
{q:'Sirt taranglik koeffitsiyentining birligi qaysi?',o:['N·m','N/m²','N/m','J·s'],a:2,e:'σ = F/l, shuning uchun birligi N/m.'},
{q:'Tomchi uzilish sharti qaysi?',o:['mg = σπd','mg = ρgh','F = ma','mg = σ/d'],a:0,e:'Uzilish paytida og‘irlik kuchi sirt taranglik kuchiga teng: mg = σπd.'},
{q:'Suv va spirtdan qaysi birining σ si katta?',o:['Spirtniki','Suvniki','Teng','Aniqlab bo‘lmaydi'],a:1,e:'Suv 0,072 N/m, spirt 0,022 N/m — suvniki katta.'},
{q:'Ishchi formula qaysi?',o:['σ = M·g/(n·π·d)','σ = n·π·d/(M·g)','σ = M·n/(g·d)','σ = M·g·d/n'],a:0,e:'mg = σπd va m = M/n dan σ = Mg/(nπd).'},
{q:'Qaysi biri xatolik sababi bo‘ladi?',o:['Tomchilarni noto‘g‘ri sanash','d ni noaniq o‘lchash','Harorat va suyuqlik ifloslanishi','Barchasi'],a:3,e:'Uchala sabab ham natijani buzadi.'}];
function test(el){let ch=Array(5).fill(-1),done=false;const R=()=>{let s=0;el.innerHTML=TEST.map((t,i)=>{if(done&&ch[i]==t.a)s++;return`<div class="card"><h3>${i+1}. ${t.q}</h3>${t.o.map((o,j)=>`<button class="opt ${done?(j==t.a?'right':j==ch[i]?'wrong':''):ch[i]==j?'sel':''}" data-i="${i}" data-j="${j}">${'ABCD'[j]}) ${o}</button>`).join('')}${done?`<div class="exp">${t.e}</div>`:''}</div>`}).join('')+
(done?`<div class="card out" style="font-size:18px">Natija: ${s}/5 — ${s==5?'Ajoyib! 🎉':s>=3?'Yaxshi 👍':'Mavzuni qayta ko‘ring 📘'}</div><button class="btn" id="rt">Qayta boshlash</button>`:`<button class="btn" id="fn">Natijani ko'rish</button>`);
if(!done)el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ch[b.dataset.i]=+b.dataset.j;R()});
if($('#fn'))$('#fn').onclick=()=>{done=true;R()};if($('#rt'))$('#rt').onclick=()=>{ch.fill(-1);done=false;R()}};R()}

/* ---------- QURISH ---------- */
const nav=$('#nav'),main=$('#main');
[...P.map(p=>p.t),'Test'].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);nav.appendChild(b);
const s=document.createElement('section');s.id='p'+i;
if(i<6){const p=P[i];s.innerHTML=`<div class="card"><h3>${i+1}-reja. ${p.h}</h3></div><div class="card"><h3>📖 Nazariya</h3>${p.th}</div><div class="card"><h3>🧮 Formula</h3><div class="formula">${p.fo}</div></div><div class="card"><h3>🌍 Hayotiy misol</h3>${p.ex}</div><div class="card"><h3>🎛️ Simulyatsiya</h3><div id="sm${i}"></div></div><div class="card"><h3>🎬 Animatsiya</h3><canvas id="a${i}" width="600" height="300"></canvas></div><div class="card"><h3>✍️ Mustaqil masala</h3>${p.pr.map((r,j)=>`<p>${r.q}</p><input type="text" inputmode="decimal" id="pi${i}_${j}" placeholder="Javob (${r.u})"><button class="btn" onclick="chk(${i},${j})">Tekshirish</button><div id="pr${i}_${j}"></div>`).join('<hr>')}</div>`;main.appendChild(s);p.sim($('#sm'+i))}
else{s.innerHTML='<div class="card"><h3>📝 Test (5 ta savol)</h3></div><div id="tt"></div>';main.appendChild(s);test($('#tt'))}});
function chk(i,j){const r=P[i].pr[j],v=parseFloat($(`#pi${i}_${j}`).value.replace(',','.')),o=$(`#pr${i}_${j}`);
o.innerHTML=isNaN(v)?'<div class="out">Javobni kiriting.</div>':Math.abs(v-r.a)<=r.tol?'<div class="out ok">To‘g‘ri! ✅</div>':`<div class="out bad">Noto‘g‘ri ❌ <span style="color:var(--ink);font-weight:400">Yechim: ${r.sol}</span></div>`}
let cur=0;
function show(i){cur=i;[...nav.children].forEach((b,k)=>b.classList.toggle('on',k==i));document.querySelectorAll('section').forEach((s,k)=>s.classList.toggle('on',k==i));scrollTo(0,0);nav.children[i].scrollIntoView({inline:'center',block:'nearest'});if(i==0)drawS1()}
function loop(ms){if(cur<6){const cv=$('#a'+cur),c=cv.getContext('2d');c.clearRect(0,0,600,300);AN[cur](c,ms/1000)}requestAnimationFrame(loop)}
setTheme(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');show(0);requestAnimationFrame(loop);
</script>
</body>
</html>
