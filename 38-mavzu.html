<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qattiq jismlarning erishi va qotishi</title>
<style>
:root{--bg:#eef6fc;--cd:#fff;--tx:#1d3550;--mu:#5b7a96;--ice:#4fa3e0;--hot:#ff8a3d;--cv:#f4faff;--fm:#fff4e8;--bd:#d6e6f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-th="l"]){}
@media(prefers-color-scheme:dark){:root:not([data-th="l"]){--bg:#0f1b2a;--cd:#172a3f;--tx:#e6f1fb;--mu:#9bb5cc;--cv:#10202f;--fm:#2b2218;--bd:#26405a}}
:root[data-th="d"]{--bg:#0f1b2a;--cd:#172a3f;--tx:#e6f1fb;--mu:#9bb5cc;--cv:#10202f;--fm:#2b2218;--bd:#26405a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:linear-gradient(135deg,#4fa3e0,#7cc4f5);color:#fff}
header h1{font-size:18px;margin:0;line-height:1.3}
#th{border:0;background:rgba(255,255,255,.25);color:#fff;font-size:22px;border-radius:12px;padding:6px 12px;cursor:pointer}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:var(--cd);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:0 0 auto;border:2px solid var(--bd);background:var(--bg);color:var(--tx);padding:10px 14px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ice);border-color:var(--ice);color:#fff}
nav button:last-child.on{background:var(--hot);border-color:var(--hot)}
main{max-width:760px;margin:0 auto;padding:12px}
.plan{display:none}.plan.on{display:block}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px rgba(60,120,180,.08)}
h2{margin:0 0 8px;font-size:21px;color:var(--ice)}
h3{margin:12px 0 8px;font-size:17px;color:var(--hot)}
p{margin:6px 0}
.fm{background:var(--fm);border-left:5px solid var(--hot);border-radius:10px;padding:12px 14px;font-size:18px;font-weight:600;margin:8px 0}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
td,th{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}
th{background:var(--cv);color:var(--ice)}
canvas{width:100%;height:auto;background:var(--cv);border-radius:14px;border:1px solid var(--bd);display:block;margin:8px 0}
.ctl{margin:10px 0}
.ctl label{display:block;font-weight:600;margin-bottom:4px}
input[type=range]{width:100%;height:32px;accent-color:var(--hot)}
select,input[type=text]{width:100%;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
.out{background:var(--cv);border-radius:12px;padding:10px 12px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row input{flex:1 1 140px;width:auto}
.b{background:var(--hot);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer;flex:1 1 auto}
.b.g{background:var(--ice)}
.b:disabled{opacity:.5}
.pr{border:1px dashed var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.res{margin-top:6px;font-weight:700}
.res.ok{color:#1b9e55}.res.no{color:#d6452f}
.stp{background:var(--cv);border-radius:10px;padding:6px 10px;margin:6px 0}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:var(--bg);color:var(--tx);padding:12px;border-radius:12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.ok{background:#d8f5e3;border-color:#1b9e55;color:#0d5c31}
.opt.no{background:#fde0db;border-color:#d6452f;color:#8a2616}
.sc{text-align:center}.sc h3{font-size:26px}
</style></head><body>
<header><h1>🧊 Qattiq jismlarning erishi va qotishi <small style="display:block;font-weight:400;font-size:13px">9-sinf fizika · 38-mavzu</small></h1><button id="th" title="Mavzu">🌙</button></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const K={tx:'#1d3550'};
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const lerp=(a,b,t)=>a+(b-a)*t,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const H=(i,j,s)=>Math.abs(Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453)%1;
const SUB={muz:{n:`Muz`,t:0,l:3.4},qorgoshin:{n:`Qo'rg'oshin`,t:327,l:.25},mis:{n:`Mis`,t:1085,l:2.1},temir:{n:`Temir`,t:1539,l:2.7},alyuminiy:{n:`Alyuminiy`,t:660,l:3.9},simob:{n:`Simob`,t:-39,l:0}};
const rr=(c,x,y,w,h,r,f)=>{c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=f;c.fill()};
const tx=(c,s,x,y,sz=14,col=K.tx,al='left')=>{c.font=`600 ${sz}px sans-serif`;c.fillStyle=col;c.textAlign=al;c.fillText(s,x,y)};
function mol(c,x,y,w,h,k,amp,t,cols=9,rows=4,r=9){const sp=Math.min(46,(w-2*r-10)/(cols-1),(h-50)/(rows-1)),x0=x+(w-sp*(cols-1))/2,y0=y+(h-sp*(rows-1))/2+8,P=[];
c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const a=H(i,j,1)*6.28,b=H(i,j,2);
P.push([x0+i*sp+k*(H(i,j,3)-.5)*sp*1.2+Math.sin(t*(3+b*3)+a)*amp+k*Math.sin(t*(1+b)+a)*sp*.35,
y0+j*sp+k*(H(i,j,4)-.5)*sp*.9+Math.cos(t*(3+b*3)+a*2)*amp+k*Math.cos(t*(1+b)+a)*sp*.25])}
if(k<.6){c.strokeStyle='rgba(120,160,200,.55)';c.lineWidth=2;c.beginPath();for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){const p=P[j*cols+i];if(i<cols-1){c.moveTo(p[0],p[1]);c.lineTo(...P[j*cols+i+1])}if(j<rows-1){c.moveTo(p[0],p[1]);c.lineTo(...P[(j+1)*cols+i])}}c.stroke()}
const q=Math.min(k,1);P.forEach(p=>{c.beginPath();c.arc(p[0],p[1],r,0,6.28);c.fillStyle=`rgb(${lerp(79,255,q)|0},${lerp(163,138,q)|0},${lerp(224,61,q)|0})`;c.fill()});c.restore()}
function thermo(c,x,y,h,f,col){f=cl(f,0,1);rr(c,x-7,y,14,h,7,'rgba(150,170,190,.35)');rr(c,x-4,y+h*(1-f),8,h*f+6,4,col);c.beginPath();c.arc(x,y+h+8,13,0,6.28);c.fillStyle=col;c.fill()}
function blk(c,x,y,w,h,k){rr(c,x,y,w,h,8,`rgb(${lerp(150,255,k)|0},${lerp(205,138,k)|0},${lerp(245,61,k)|0})`)}
function beaker(c,x,y,w,h){c.strokeStyle=K.tx;c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+h);c.lineTo(x+w,y+h);c.lineTo(x+w,y);c.stroke()}
function flame(c,x,y,s,t){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+s*.6,y-s*.5,x,y-s*(1+.15*Math.sin(t*12)));c.quadraticCurveTo(x-s*.6,y-s*.5,x,y);c.fillStyle='#ff8a3d';c.fill()}
function cp(seg,u){const r=[[0,seg[0][1]]];let x=0;for(const s of seg){const d=Math.min(s[0],u-x);if(d<=0)break;x+=d;r.push([x,s[1]+(s[2]-s[1])*d/s[0]])}return r}
function graph(c,x,y,w,h,pts,xm,y0,y1){const X=v=>x+v/xm*w,Y=v=>y+h-(v-y0)/(y1-y0)*h;
c.strokeStyle=K.tx;c.lineWidth=1.5;c.beginPath();c.moveTo(x,y);c.lineTo(x,y+h);c.lineTo(x+w,y+h);c.stroke();
c.setLineDash([4,4]);c.strokeStyle='rgba(150,170,190,.8)';c.beginPath();c.moveTo(x,Y(0));c.lineTo(x+w,Y(0));c.stroke();c.setLineDash([]);
tx(c,'0°C',x-4,Y(0)+4,11,K.tx,'right');tx(c,'t, °C',x+6,y+10,12);tx(c,'τ',x+w,y+h+16,13,K.tx,'right');
c.strokeStyle='#ff8a3d';c.lineWidth=3;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(p[0]),Y(p[1])):c.moveTo(X(p[0]),Y(p[1])));c.stroke();
const l=pts[pts.length-1];c.beginPath();c.arc(X(l[0]),Y(l[1]),6,0,6.28);c.fillStyle='#4fa3e0';c.fill()}
function mold(c,x,y,w,h,fl,f,T){rr(c,x,y,w,h,12,'#6b7785');const ch=h-28,cx=x+14,cy=y+14;rr(c,cx,cy,w-28,ch,6,'#2a3441');const lh=ch*fl,q=cl((T-327)/273,0,1);
if(lh>1)rr(c,cx,cy+ch-lh,w-28,lh,4,`rgb(255,${lerp(110,190,q)|0},${lerp(50,90,q)|0})`);if(lh*f>1)rr(c,cx,cy+ch-lh*f,w-28,lh*f,4,'#aab4bf')}
function cast(T0,tt){const t1=(T0-327)/5;if(tt<t1)return{T:T0-5*tt,f:0};if(tt<t1+30)return{T:327,f:(tt-t1)/30};return{T:Math.max(20,327-5*(tt-t1-30)),f:1}}
const S3=[[.15,-20,0],[.25,0,0],[.3,0,100],[.2,100,100],[.1,100,120]];
const kJ=q=>(q/1000).toFixed(1)+' kJ';
const tbl=(a,b,r)=>`<table><tr><th>Modda</th><th>${a}</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table>`;

const P=[
{title:`Erish va qotish tushunchasi`,
th:`<p><b>Erish</b> — moddaning qattiq holatdan suyuq holatga o'tishi. <b>Qotish (kristallanish)</b> — suyuq holatdan qattiq holatga o'tish.</p><p>Kristall jismda molekulalar panjara tugunlarida joylashib, o'z o'rnida tebranadi. Qizdirilganda tebranish kuchayadi va ma'lum temperaturada kristall panjara buziladi: molekulalar erkin ko'chib yuradi — modda suyuqlikka aylanadi.</p>`,
fm:`Erish: qattiq → suyuq (energiya yutiladi)<br>Qotish: suyuq → qattiq (energiya ajraladi)`,
ex:`Quyoshda muz eriydi, pechda qo'rg'oshin eriydi, qo'lingizda shokolad eriydi, shamning mumi olovda eriydi. Sovigach ular yana qotadi.`,
sim:{c:[{id:'T',l:'Muzning temperaturasi',min:-30,max:60,v:-20,u:'°C'}],
r:V=>`Muz, T = <b>${V.T}°C</b> → <b>${V.T<0?'Qattiq (kristall panjara saqlanadi)':V.T==0?'Erish jarayoni (0°C)':'Suyuq (panjara buzilgan)'}</b>`,
d:(c,w,h,V,t)=>{const k=V.T<0?0:V.T==0?.5:1;mol(c,0,0,w,h,k,V.T<0?1+(V.T+30)/30*4:2.5,t);tx(c,V.T<0?'Qattiq':V.T==0?'Erish':'Suyuq',14,24,16,k?'#ff8a3d':'#4fa3e0')}},
an:(c,w,h,p,t)=>{const s=p*p*(3-2*p);mol(c,0,0,w,h,s,lerp(1.5,5,p),t);tx(c,p<.3?'1) Qizdirilmoqda: tebranish kuchaymoqda':p<.7?'2) Kristall panjara buzilmoqda':`3) Suyuqlik hosil bo'ldi`,14,24,15)},
pr:[{q:`Muz 0°C da erishni boshladi. Uning qotish temperaturasi necha °C?`,a:0,u:'°C',h:`Qotish temperaturasi erish temperaturasiga teng.`}]},

{title:`Erish temperaturasi`,
th:`<p><b>Erish temperaturasi (t<sub>er</sub>)</b> — modda erishi boshlanadigan temperatura. Qotish temperaturasi unga teng. Erish davomida temperatura <b>o'zgarmaydi</b>: berilgan energiya panjarani buzishga sarflanadi.</p><p><b>Kristall</b> jismlar (muz, metallar) aniq t<sub>er</sub> ga ega. <b>Amorf</b> jismlar (shisha, smola) asta-sekin yumshaydi, ularning aniq t<sub>er</sub> si yo'q.</p>`,
fm:`t<sub>qotish</sub> = t<sub>er</sub> &nbsp;|&nbsp; erish vaqtida t = const`,
tb:tbl('t<sub>er</sub>, °C',0,[['Muz',0],[`Qo'rg'oshin`,327],['Mis',1085],['Temir',1539],['Alyuminiy',660],['Simob','−39']]),
ex:`Simob −39°C da qotadi, shuning uchun juda sovuq joylarda simobli termometr ishlamaydi. Muz 0°C da eriydi, shu sababli bahorda havo 0°C dan isiganda qor eriy boshlaydi.`,
sim:{c:[{id:'s',l:'Modda',o:['muz','qorgoshin','mis','temir','alyuminiy','simob']},{id:'T',l:'Temperatura',min:-60,max:1600,v:20,u:'°C'}],
r:V=>{const s=SUB[V.s];return `${s.n}: t<sub>er</sub> = <b>${s.t}°C</b>. T = ${V.T}°C → <b>${V.T<s.t?'Qattiq':V.T==s.t?`Erish/qotish jarayoni (T o'zgarmaydi)`:'Suyuq'}</b>`},
d:(c,w,h,V,t)=>{const s=SUB[V.s],T=V.T,k=T<s.t?0:T==s.t?.5:1;thermo(c,70,20,170,(T+60)/1660,k?'#ff8a3d':'#4fa3e0');const y=20+170*(1-(s.t+60)/1660);c.strokeStyle='#e0568a';c.lineWidth=2;c.setLineDash([5,4]);c.beginPath();c.moveTo(40,y);c.lineTo(110,y);c.stroke();c.setLineDash([]);tx(c,'t_er='+s.t+'°C',118,y+4,13,'#e0568a');blk(c,330,60,220,120,k);tx(c,s.n+(k==0?' (qattiq)':k==1?' (suyuq)':' (erimoqda)'),440,208,15,K.tx,'center')}},
an:(c,w,h,p,t)=>{let T,m;if(p<.25){T=-20+80*p;m=0}else if(p<.65){T=0;m=(p-.25)/.4}else{T=(p-.65)/.35*20;m=1}
thermo(c,60,20,170,(T+30)/80,T>0?'#ff8a3d':'#4fa3e0');tx(c,'T = '+T.toFixed(1)+'°C',90,60,16,m>0&&m<1?'#e0568a':K.tx);
tx(c,p<.25?'Muz qizdirilmoqda':p<.65?`Muz eriyapti: T = 0°C o'zgarmaydi`:'Suv qizdirilmoqda',400,32,14,K.tx,'center');
beaker(c,300,50,200,140);const wh=80*m*.9,hi=70*(1-m);if(wh>1)rr(c,302,190-wh,196,wh,0,'rgba(79,163,224,.55)');if(hi>1)rr(c,340,190-wh-hi,120,hi,8,'#bfe3ff');if(p<.999)flame(c,400,234,26,t)},
pr:[{q:`Temir va alyuminiyning erish temperaturalari farqi necha °C? (t(temir) = 1539°C, t(alyuminiy) = 660°C)`,a:879,u:'°C',h:`1539 − 660`}]},

{title:`Erish va qotish grafigi (t–τ)`,
th:`<p>Qattiq jismni qizdirsak, t–τ grafik 3 bosqichdan iborat: 1) qattiq jism qizdiriladi (chiziq ko'tariladi); 2) erish — <b>gorizontal chiziq</b> (t = t<sub>er</sub>); 3) suyuqlik qizdiriladi.</p><p>Sovitishda teskari: suyuqlik soviydi → qotish (gorizontal chiziq) → qattiq jism soviydi.</p>`,
fm:`Gorizontal qism: t = t<sub>er</sub> = const<br>Qizdirish vaqti: τ = Q / P`,
ex:`Stakandagi muz bo'lagi: avval 0°C gacha isiydi, keyin erib bo'lguncha suv-muz aralashmasi 0°C da turadi, hammasi erigach suv isiy boshlaydi.`,
sim:{c:[{id:'P',l:'Qizdirish quvvati',min:100,max:1000,v:400,step:50,u:'W'}],
r:V=>{const a=21000/V.P,b=170000/V.P,d=42000/V.P;return `0,5 kg muz (−20°C → 20°C). Muzni qizdirish: ${a.toFixed(0)} s; <b>erish: ${b.toFixed(0)} s</b>; suvni qizdirish: ${d.toFixed(0)} s. Jami: ${(a+b+d).toFixed(0)} s`},
d:(c,w,h,V,t)=>{const a=21000/V.P,b=170000/V.P,d=42000/V.P;graph(c,50,20,w-80,h-60,cp([[a,-20,0],[b,0,0],[d,0,20]],((t/7)%1)*(a+b+d)),2400,-30,30)}},
an:(c,w,h,p,t)=>{let u=p,i=0;while(i<4&&u>S3[i][0]){u-=S3[i][0];i++}const f=cl(u/S3[i][0],0,1);
const k=[0,f,1,1+.6*f,1.6][i],am=[2,2+f,3,3+2*f,5][i];
mol(c,8,30,w*.4,h-60,k,am,t,4,4,8);tx(c,[`Muz qizdiriladi`,'Muz eriydi','Suv qizdiriladi',`Suv qaynaydi`,`Bug' qizdiriladi`][i],10,22,14,'#ff8a3d');
graph(c,w*.48,20,w*.48,h-60,cp(S3,p),1,-30,130)},
pr:[{q:`Quvvati 500 W bo'lgan isitgich 0°C dagi 1 kg muzni necha sekundda eritadi? (λ = 3,4·10⁵ J/kg)`,a:680,u:'s',h:`τ = λm / P = 3,4·10⁵ / 500`}]},

{title:`Solishtirma erish issiqligi (λ)`,
th:`<p><b>Solishtirma erish issiqligi (λ)</b> — 1 kg kristall moddani erish temperaturasida to'liq eritish uchun kerak bo'lgan issiqlik miqdori. Qotishda xuddi shuncha issiqlik ajraladi.</p><p>Erish vaqtida energiya molekulalar orasidagi bog'lanishni uzishga sarflanadi, shuning uchun molekulalarning kinetik energiyasi (temperatura) o'zgarmaydi.</p>`,
fm:`λ = Q / m &nbsp;&nbsp; [λ] = J/kg`,
tb:tbl('λ, J/kg',0,[['Muz','3,4·10⁵'],['Alyuminiy','3,9·10⁵'],['Mis','2,1·10⁵'],[`Qo'rg'oshin`,'0,25·10⁵'],['Temir','2,7·10⁵']]),
ex:`Muzning λ si katta (3,4·10⁵ J/kg), shuning uchun qor va muz sekin eriydi — bahorda suv birdaniga bosib kelmaydi.`,
sim:{c:[{id:'s',l:'Modda',o:['muz','alyuminiy','mis','qorgoshin','temir']},{id:'m',l:'Massa',min:.1,max:10,v:1,step:.1,u:'kg'}],
r:V=>{const s=SUB[V.s];return `Q = λ·m = ${s.l}·10⁵ · ${V.m} = <b>${kJ(s.l*1e5*V.m)}</b>`},
d:(c,w,h,V)=>{const s=SUB[V.s],Q=s.l*1e5*V.m;tx(c,s.n+', m = '+V.m+' kg',40,22,14);blk(c,40,32,30+V.m*12,30+V.m*8,0);tx(c,'Kerakli energiya Q',40,150,14);rr(c,40,160,w-80,28,14,'rgba(150,170,190,.3)');rr(c,40,160,Math.max(8,(w-80)*Q/3.9e6),28,14,'#ff8a3d');tx(c,kJ(Q),40,214,16,'#ff8a3d')}},
an:(c,w,h,p,t)=>{thermo(c,50,20,150,.35,'#4fa3e0');tx(c,'T = 0°C',74,60,15);tx(c,`kinetik energiya o'zgarmaydi`,74,80,12);
const wh=70*p,hi=90*(1-p)+3;rr(c,150,170-wh,110,wh,6,'rgba(79,163,224,.6)');rr(c,150,170-wh-hi,110,hi,8,'#bfe3ff');tx(c,'2 kg muz',205,24,14,K.tx,'center');if(p<.999)flame(c,205,232,24,t);
rr(c,320,30,30,140,8,'rgba(150,170,190,.3)');rr(c,320,170-140*p,30,140*p,8,'#ff8a3d');tx(c,'Energiya shkalasi',365,48,13);tx(c,'Q = '+(680*p).toFixed(0)+' kJ',365,100,20,'#ff8a3d');tx(c,'Maks: λm = 680 kJ',365,125,13)},
pr:[{q:`0,5 kg misni erish temperaturasida eritish uchun qancha issiqlik kerak? λ = 2,1·10⁵ J/kg. Javobni kJ da yozing.`,a:105,u:'kJ',h:`Q = λm = 2,1·10⁵ · 0,5 = 1,05·10⁵ J`}]},

{title:`Q = λ·m formulasi va masalalar`,
th:`<p>Erishda issiqlik <b>yutiladi</b>, qotishda <b>ajraladi</b>. Agar jism avval erish temperaturasigacha qizdirilsa, umumiy issiqlik qizdirish va erish issiqliklarining yig'indisiga teng.</p>`,
fm:`Erishda: Q = λ·m<br>Qotishda: Q = −λ·m<br>To'liq jarayon: Q = cm(t<sub>er</sub> − t₁) + λm`,
ex:`2 kg muzni 0°C da eritish uchun: Q = 3,4·10⁵ · 2 = 6,8·10⁵ J.`,
sim:{c:[{id:'m',l:'Massa m',min:.5,max:10,v:2,step:.5,u:'kg'},{id:'L',l:'λ (×10⁵ J/kg)',min:.2,max:4,v:3.4,step:.1}],
