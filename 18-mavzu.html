<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>18-mavzu: Masalalar yechish</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 15px; background: #101a2b; color: #eaf1ff; }
  header { background: linear-gradient(135deg, #1e88e5, #7e57c2); padding: 16px; text-align: center; border-radius: 12px; margin-bottom: 15px; }
  header h1 { margin: 0; font-size: 1.3rem; color: #fff; }
  header p { margin: 5px 0 0; opacity: 0.9; font-size: 0.9rem; color: #fff; }
  .card { background: #182640; border: 2px solid #2c426a; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
  h2 { margin-top: 0; color: #64b5f6; font-size: 1.1rem; }
  #tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
  #tabs button { background: #182640; color: #fff; border: 2px solid #2c426a; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; white-space: nowrap; }
  #tabs button.active { background: #1e88e5; border-color: #1e88e5; }
  .cond { background: #fff8e1; color: #4a3b00; padding: 10px; border-left: 4px solid #ffb300; border-radius: 6px; margin-bottom: 10px; font-weight: bold; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; }
  td { border: 1px solid #2c426a; padding: 8px; font-size: 0.95rem; }
  td:first-child { width: 35%; font-weight: bold; color: #90caf9; }
  .btn { width: 100%; padding: 12px; background: #1e88e5; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
  .q { margin: 12px 0; padding: 10px; border: 1px solid #2c426a; border-radius: 8px; background: #111d33; }
  .q label { display: block; padding: 8px; margin: 4px 0; border: 1px solid #2c426a; border-radius: 6px; cursor: pointer; }
  .score { font-size: 1.2rem; font-weight: bold; text-align: center; margin-top: 10px; padding: 10px; border-radius: 8px; }
  .ok { color: #4caf50; }
  .no { color: #f44336; }
</style>
</head>
<body>

<header>
  <h1>⚗️ 18-mavzu: Masalalar yechish</h1>
  <p>9-sinf fizika · Termodinamika va issiqlik hodisalari</p>
</header>

<div id="tabs">
  <button onclick="showTab(0)" class="active">1. ΔU</button>
  <button onclick="showTab(1)">2. A</button>
  <button onclick="showTab(2)">3. Q</button>
  <button onclick="showTab(3)">4. Balans</button>
  <button onclick="showTab(4)">5. Q=qm</button>
</div>

<div class="card" id="taskPanel"></div>

<div class="card">
  <h2>📝 Yakuniy test (5 ta savol)</h2>
  <div id="testArea"></div>
  <button class="btn" onclick="checkTest()">Natijani ko‘rish</button>
  <div id="testResult"></div>
</div>

<script>
const tasks = [
  { name: "1. Ichki energiya o‘zgarishi (ΔU)", cond: "Silindrdagi gazga 500 J issiqlik berildi. Gaz kengayib, porshenni ko‘tardi va 200 J ish bajardi. Gazning ichki energiyasi qanchaga o‘zgardi?", given: "Q = 500 J<br>A = 200 J", find: "ΔU = ?", formula: "ΔU = Q − A", step: "ΔU = 500 J − 200 J = 300 J", ans: "300 J" },
  { name: "2. Termodinamik ish (A)", cond: "Gaz o‘zgarmas 2·10⁵ Pa bosimda kengayib, hajmi 0,003 m³ ga ortdi. Gaz qancha ish bajardi?", given: "p = 2·10⁵ Pa<br>ΔV = 0,003 m³", find: "A = ?", formula: "A = p · ΔV", step: "A = 2·10⁵ Pa · 0,003 m³ = 600 J", ans: "600 J" },
  { name: "3. Isitish uchun issiqlik miqdori (Q)", cond: "2 kg suvni 20 °C dan 80 °C gacha isitish uchun qancha issiqlik kerak? (c = 4200 J/(kg·°C))", given: "m = 2 kg<br>t₁ = 20 °C, t₂ = 80 °C<br>c = 4200 J/(kg·°C)", find: "Q = ?", formula: "Q = c · m · (t₂ − t₁)", step: "Q = 4200 · 2 · (80 − 20) = 504 000 J", ans: "504 000 J (504 kJ)" },
  { name: "4. Issiqlik balansi", cond: "1 kg 80 °C li issiq suvga 3 kg 20 °C li sovuq suv qo‘shildi. Aralashmaning temperaturasi qancha bo‘ladi?", given: "m₁ = 1 kg, t₁ = 80 °C<br>m₂ = 3 kg, t₂ = 20 °C", find: "t = ?", formula: "t = (m₁t₁ + m₂t₂) / (m₁ + m₂)", step: "t = (1·80 + 3·20) / (1 + 3) = 140 / 4 = 35 °C", ans: "35 °C" },
  { name: "5. Yoqilg‘ining yonish issiqligi", cond: "0,5 kg ko‘mir to‘liq yonganda qancha issiqlik ajraladi? (q = 27·10⁶ J/kg)", given: "m = 0,5 kg<br>q = 27·10⁶ J/kg", find: "Q = ?", formula: "Q = q · m", step: "Q = 27·10⁶ · 0,5 = 13,5·10⁶ J", ans: "13,5 MJ" }
];

const tests = [
  { q: "Gazga 300 J issiqlik berildi, u 100 J ish bajardi. ΔU = ?", o: ["400 J", "200 J", "300 J", "100 J"], a: 1 },
  { q: "p = 1·10⁵ Pa bosimda gaz hajmi 0,005 m³ ga ortdi. Ish qancha?", o: ["50 J", "5000 J", "500 J", "0,5 J"], a: 2 },
  { q: "1 kg suvni 10 °C ga isitish uchun qancha issiqlik kerak? (c = 4200)", o: ["420 J", "4200 J", "42 000 J", "420 000 J"], a: 2 },
  { q: "1 kg 60 °C va 1 kg 20 °C suv aralashtirildi. Oxirgi temp?", o: ["30 °C", "40 °C", "50 °C", "80 °C"], a: 1 },
  { q: "2 kg ko‘mir yonganda (q = 27·10⁶ J/kg) qancha issiqlik ajraladi?", o: ["13,5 MJ", "27 MJ", "54 MJ", "540 MJ"], a: 2 }
];

function showTab(idx) {
  const btns = document.querySelectorAll('#tabs button');
  btns.forEach((b, i) => b.classList.toggle('active', i === idx));
  
  const t = tasks[idx];
  document.getElementById('taskPanel').innerHTML = `
    <h2>${t.name}</h2>
    <div class="cond">${t.cond}</div>
    <table>
      <tr><td>Berilgan</td><td>${t.given}</td></tr>
      <tr><td>Topish kerak</td><td>${t.find}</td></tr>
      <tr><td>Formula</td><td>${t.formula}</td></tr>
      <tr><td>Yechilishi</td><td>${t.step}</td></tr>
      <tr><td>Javob</td><td><b>${t.ans}</b></td></tr>
    </table>
  `;
}

function renderTests() {
  const area = document.getElementById('testArea');
  area.innerHTML = tests.map((t, i) => `
    <div class="q">
      <b>${i + 1}. ${t.q}</b>
      ${t.o.map((opt, j) => `
        <label><input type="radio" name="q${i}" value="${j}"> ${'ABCD'[j]})${opt}</label>
      `).join('')}
    </div>
  `).join('');
}

function checkTest() {
  let score = 0;
  tests.forEach((t, i) => {
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    if (sel && parseInt(sel.value) === t.a) score++;
  });
  
  const res = document.getElementById('testResult');
  res.className = `score ${score >= 3 ? 'ok' : 'no'}`;
  res.innerHTML = `Natija: ${score} / 5 ball ${score >= 3 ? '👍' : '📚'}`;
}

// Boshlang'ich yuklash
showTab(0);
renderTests();
</script>
</body>
</html>
