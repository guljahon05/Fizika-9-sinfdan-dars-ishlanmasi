<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>9-sinf fizika: Masalalar yechish</title>
<style>
:root{--bg:#f6f9fd;--grid:#d9e6f5;--ink:#1c2a4a;--mut:#5b6b8a;--red:#d9414b;--card:#fff;--acc:#2456c9;--line:#c3d3ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a2e;--grid:#1c2946;--ink:#e6edfa;--mut:#9fb0d0;--red:#ff7a82;--card:#18233d;--acc:#7aa2ff;--line:#2c3c60}}
:root[data-theme="dark"]{--bg:#111a2e;--grid:#1c2946;--ink:#e6edfa;--mut:#9fb0d0;--red:#ff7a82;--card:#18233d;--acc:#7aa2ff;--line:#2c3c60}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font:16px/1.5 "Trebuchet MS","Gill Sans",Verdana,sans-serif}
main,header{max-width:860px;margin:0 auto;padding:0 14px}
h1{font-size:1.5rem;margin:18px 0 4px}h1+p{margin:0 0 10px;color:var(--mut)}
h2{font-size:1.25rem;margin:14px 0 6px}h3{font-size:1rem;margin:12px 0 4px;color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
nav button{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 11px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tx{border-left:4px solid var(--red);background:var(--card);padding:8px 12px;margin:0 0 12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
canvas{width:100%;display:block;border-radius:6px}#cv{height:230px}#gr{height:150px;margin-top:8px}
.ro{display:flex;flex-wrap:wrap;gap:6px 16px;font-weight:bold;margin:8px 0}.ro span{min-width:110px}
.ctl{display:flex;gap:8px;flex-wrap:wrap}.ctl button{border:0;border-radius:8px;padding:9px 14px;font:inherit;color:#fff;background:var(--acc);cursor:pointer}
.ctl button:nth-child(2){background:var(--mut)}.ctl button:nth-child(3){background:var(--red)}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 16px;margin-top:10px}
.sls label{display:block;font-size:.9rem}.sls input{width:100%}
ol,ul{margin:4px 0;padding-left:22px}.live{background:var(--bg);border-radius:6px;padding:6px 10px;margin-top:8px}
.ans{font-weight:bold;color:var(--red)}
</style></head><body>
<header><h1>9-sinf fizika · Masalalar yechish</h1><p>Mavzuni tanlang, slayderlarni suring, animatsiyani kuzating.</p><nav id="nav" aria-label="Masalalar"></nav></header>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s),g=10,nf=v=>String(+(+v).toFixed(2)).replace('.',',');
const P=[
{n:"Tekis harakat",fall:0,gr:'s',ts:5,
t:"Avtomobil shossada 20 m/s o'zgarmas tezlik bilan 30 s yurdi. U qancha yo'l bosib o'tdi?",
giv:["v = 20 m/s","t = 30 s"],find:"s = ?",form:["s = v·t"],
steps:["Harakat tekis, tezlik o'zgarmaydi.","s = 20 m/s · 30 s = 600 m"],ans:"s = 600 m (0,6 km)",
sl:[["v","Tezlik v","m/s",1,40,1,20],["t","Vaqt t","s",5,60,1,30]],
f:(p,t)=>({x:p.v*t,v:p.v,a:0}),dur:p=>p.t,res:p=>`s = ${p.v}·${p.t} = ${nf(p.v*p.t)} m`},
{n:"Tekis tezlanuvchan harakat",fall:0,gr:'v',ts:1,
t:"Velosipedchi 2 m/s tezlik bilan ketayotib, 0,5 m/s² tezlanish bilan 10 s davomida tezlandi. Oxirgi tezligi va shu vaqtda bosgan yo'lini toping.",
giv:["v₀ = 2 m/s","a = 0,5 m/s²","t = 10 s"],find:"v = ?  s = ?",form:["v = v₀ + a·t","s = v₀·t + a·t²/2"],
steps:["v = 2 + 0,5·10 = 7 m/s","s = 2·10 + 0,5·10²/2 = 20 + 25 = 45 m"],ans:"v = 7 m/s, s = 45 m",
sl:[["v0","Boshlang'ich tezlik v₀","m/s",0,10,.5,2],["a","Tezlanish a","m/s²",0,3,.1,.5],["t","Vaqt t","s",2,20,1,10]],
f:(p,t)=>({x:p.v0*t+p.a*t*t/2,v:p.v0+p.a*t,a:p.a}),dur:p=>p.t,
res:p=>`v = ${nf(p.v0+p.a*p.t)} m/s, s = ${nf(p.v0*p.t+p.a*p.t*p.t/2)} m`},
{n:"Erkin tushish",fall:1,gr:'v',ts:1,
t:"Tosh 45 m balandlikdan boshlang'ich tezliksiz tashlandi (g = 10 m/s², havo qarshiligi hisobga olinmaydi). Necha sekundda yerga tushadi va urilish tezligi qancha?",
giv:["h = 45 m","v₀ = 0","g = 10 m/s²"],find:"t = ?  v = ?",form:["h = g·t²/2  ⇒  t = √(2h/g)","v = g·t"],
steps:["t = √(2·45/10) = √9 = 3 s","v = 10·3 = 30 m/s"],ans:"t = 3 s, v = 30 m/s",
sl:[["h","Balandlik h","m",5,120,5,45],["g","Erkin tushish tezlanishi g","m/s²",1.6,20,.1,10]],
f:(p,t)=>({x:p.g*t*t/2,v:p.g*t,a:p.g}),dur:p=>Math.sqrt(2*p.h/p.g),
res:p=>`t = ${nf(Math.sqrt(2*p.h/p.g))} s, v = ${nf(Math.sqrt(2*p.h*p.g))} m/s`},
{n:"Nyuton qonunlari",fall:0,gr:'v',ts:1,
t:"Massasi 5 kg aravachani silliq stolda 20 N gorizontal kuch bilan itarishadi. Aravachaning tezlanishini, 3 s dagi tezligini va yo'lini toping.",
giv:["m = 5 kg","F = 20 N","t = 3 s","v₀ = 0"],find:"a = ?  v = ?  s = ?",form:["a = F/m  (Nyutonning 2-qonuni)","v = a·t","s = a·t²/2"],
steps:["a = 20/5 = 4 m/s²","v = 4·3 = 12 m/s","s = 4·3²/2 = 18 m"],ans:"a = 4 m/s², v = 12 m/s, s = 18 m",
sl:[["m","Massa m","kg",1,20,1,5],["F","Kuch F","N",5,60,1,20],["t","Vaqt t","s",1,8,1,3]],
f:(p,t)=>{const a=p.F/p.m;return{x:a*t*t/2,v:a*t,a,F:[["F",p.F,0,'#d9414b'],["N",0,p.m*g,'#2e9d5b'],["mg",0,-p.m*g,'#8a5cf6']]}},dur:p=>p.t,
res:p=>{const a=p.F/p.m;return`a = ${nf(a)} m/s², v = ${nf(a*p.t)} m/s, s = ${nf(a*p.t*p.t/2)} m`}},
{n:"Ishqalanish kuchi",fall:0,gr:'v',ts:1,
t:"Massasi 20 kg yukli aravacha yerda 60 N kuch bilan tortilmoqda. Ishqalanish koeffitsiyenti 0,2 (g = 10 m/s²). Tezlanishi, 4 s dagi tezligi va yo'lini toping.",
giv:["m = 20 kg","F = 60 N","μ = 0,2","t = 4 s"],find:"a = ?  v = ?  s = ?",form:["N = m·g","F_ish = μ·N","a = (F − F_ish)/m","v = a·t,  s = a·t²/2"],
steps:["N = 20·10 = 200 N","F_ish = 0,2·200 = 40 N","a = (60 − 40)/20 = 1 m/s²","v = 1·4 = 4 m/s;  s = 1·4²/2 = 8 m"],ans:"a = 1 m/s², v = 4 m/s, s = 8 m",
sl:[["m","Massa m","kg",5,60,1,20],["mu","Koeffitsiyent μ","",0,.8,.05,.2],["F","Tortish kuchi F","N",0,150,5,60],["t","Vaqt t","s",1,10,1,4]],
f:(p,t)=>{const N=p.m*g,fs=p.mu*N,a=p.F>fs?(p.F-fs)/p.m:0;return{x:a*t*t/2,v:a*t,a,F:[["F",p.F,0,'#d9414b'],["F_ish",-Math.min(p.F,fs),0,'#e08a00'],["N",0,N,'#2e9d5b'],["mg",0,-N,'#8a5cf6']]}},dur:p=>p.t,
res:p=>{const fs=p.mu*p.m*g,a=p.F>fs?(p.F-fs)/p.m:0;return a?`F_ish = ${nf(fs)} N, a = ${nf(a)} m/s², v = ${nf(a*p.t)} m/s, s = ${nf(a*p.t*p.t/2)} m`:`F ≤ F_ish (${nf(fs)} N): aravacha qo'zg'almaydi`}},
{n:"Impulsning saqlanish qonuni",fall:0,gr:'v',ts:1,
t:"Massasi 40 kg va tezligi 3 m/s bo'lgan aravacha tinch turgan 20 kg li aravachaga urilib, ular ilashib birga harakatlandi. Ilashgandan keyingi tezlikni toping.",
giv:["m₁ = 40 kg","v₁ = 3 m/s","m₂ = 20 kg","v₂ = 0"],find:"u = ?",form:["m₁v₁ + m₂v₂ = (m₁ + m₂)·u","u = (m₁v₁ + m₂v₂)/(m₁ + m₂)"],
steps:["Urilishdan oldingi impuls: p = 40·3 + 0 = 120 kg·m/s","u = 120/(40 + 20) = 2 m/s"],ans:"u = 2 m/s",
sl:[["m1","Massa m₁","kg",5,80,1,40],["m2","Massa m₂","kg",5,80,1,20],["v1","Tezlik v₁","m/s",1,8,.5,3]],
f:(p,t)=>{const tc=6/p.v1,u=p.m1*p.v1/(p.m1+p.m2);let x,v,x2,v2;if(t<tc){x=p.v1*t;v=p.v1;x2=7;v2=0}else{x=6+u*(t-tc);v=u;x2=x+1;v2=u}return{x,x2,v,p:p.m1*v+p.m2*v2}},
dur:p=>6/p.v1+3,res:p=>`u = ${nf(p.m1*p.v1/(p.m1+p.m2))} m/s, p = ${nf(p.m1*p.v1)} kg·m/s`}
];
let i=0,p,T=0,run=false,last=0,sp=1;
const nav=$('#nav');
P.forEach((q,k)=>{const b=document.createElement('button');b.textContent=(k+1)+". "+q.n;b.onclick=()=>load(k);nav.appendChild(b)});
const li=a=>a.map(s=>`<li>${s}</li>`).join('');
function load(k){
 i=k;const q=P[k];p={};q.sl.forEach(s=>p[s[0]]=s[6]);sp=q.ts;T=0;run=false;
 [...nav.children].forEach((b,j)=>b.classList.toggle('on',j==k));
 const sls=q.sl.map(s=>`<label>${s[1]}: <b id="v_${s[0]}">${nf(s[6])}</b> ${s[2]}<input type="range" id="r_${s[0]}" min="${s[3]}" max="${s[4]}" step="${s[5]}" value="${s[6]}"></label>`).join('')+`<label>Animatsiya tezligi: <b id="v_sp">${sp}</b>×<input type="range" id="r_sp" min="0.5" max="10" step="0.5" value="${sp}"></label>`;
 $('#main').innerHTML=`<h2>${k+1}-masala. ${q.n}</h2><p class="tx">${q.t}</p>
 <div class="card"><canvas id="cv"></canvas><div class="ro" id="ro"></div><div class="ctl"><button id="b1">Boshlash</button><button id="b2">To'xtatish</button><button id="b3">Qayta boshlash</button></div><div class="sls">${sls}</div><canvas id="gr"></canvas></div>
 <div class="card"><h3>Berilgan</h3><ul>${li(q.giv)}</ul><h3>Topish kerak</h3><ul><li>${q.find}</li></ul><h3>Formulalar</h3><ul>${li(q.form)}</ul><h3>Yechim</h3><ol>${li(q.steps)}</ol><p class="ans">Javob: ${q.ans}</p><div class="live" id="live"></div></div>`;
 q.sl.forEach(s=>{$('#r_'+s[0]).oninput=e=>{p[s[0]]=+e.target.value;$('#v_'+s[0]).textContent=nf(e.target.value);T=Math.min(T,q.dur(p));draw()}});
 $('#r_sp').oninput=e=>{sp=+e.target.value;$('#v_sp').textContent=sp};
 $('#b1').onclick=()=>{if(T>=q.dur(p))T=0;run=true;last=performance.now()};
 $('#b2').onclick=()=>run=false;
 $('#b3').onclick=()=>{T=0;run=true;last=performance.now()};
 draw();
}
function arrow(x,a,b,c,d,col,lab){x.strokeStyle=x.fillStyle=col;x.lineWidth=2.5;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const t=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-9*Math.cos(t-.4),d-9*Math.sin(t-.4));x.lineTo(c-9*Math.cos(t+.4),d-9*Math.sin(t+.4));x.fill();if(lab)x.fillText(lab,c+5,d-5)}
function nice(m){const r=m/6,e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return(f<1.5?1:f<3.5?2:f<7.5?5:10)*e}
function draw(){
 const q=P[i],D=q.dur(p),o=q.f(p,T),e=q.f(p,D),cs=getComputedStyle(document.documentElement),C=n=>cs.getPropertyValue(n).trim();
 const c=$('#cv'),W=c.clientWidth,H=c.clientHeight,d=devicePixelRatio||1;
 if(c.width!=Math.round(W*d)){c.width=Math.round(W*d);c.height=Math.round(H*d)}
 const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,W,H);x.font='12px sans-serif';x.fillStyle=C('--mut');x.strokeStyle=C('--mut');x.lineWidth=2;
 if(q.fall){
  const top=22,gy=H-20,sc=(gy-top)/p.h,ax=W/2-90,st=nice(p.h);
  x.beginPath();x.moveTo(ax,top);x.lineTo(ax,gy);x.stroke();
  for(let v=0;v<=p.h+1e-9;v+=st){const y=top+v*sc;x.fillStyle=C('--mut');x.fillText(nf(p.h-v)+' m',ax-42,y+4);x.beginPath();x.moveTo(ax,y);x.lineTo(ax+6,y);x.stroke()}
  x.beginPath();x.moveTo(20,gy);x.lineTo(W-20,gy);x.stroke();
  const by=top+o.x*sc;x.fillStyle=C('--acc');x.beginPath();x.arc(W/2,by,11,0,7);x.fill();
  if(o.v>0)arrow(x,W/2+22,by,W/2+22,by+Math.min(70,o.v/(e.v||1)*70),C('--red'),'v');
 }else{
  const gy=H*.66,L=30,R=W-30,mx=Math.max(e.x,e.x2||0)+(e.x2?.5:0)||1,sc=(R-L-50)/mx,px=v=>L+25+v*sc,bw=e.x2?sc*.5:25,bh=e.x2?32:24,st=nice(mx);
  x.beginPath();x.moveTo(L,gy);x.lineTo(R,gy);x.stroke();x.textAlign='center';
  for(let v=0;v<=mx+1e-9;v+=st){x.beginPath();x.moveTo(px(v),gy);x.lineTo(px(v),gy+6);x.stroke();x.fillText(nf(v),px(v),gy+20)}
  x.fillText('x, m',R-10,gy+38);
  const car=(cx,col,lab)=>{x.fillStyle=col;x.fillRect(cx-bw,gy-14-bh,2*bw,bh);x.fillStyle=C('--ink');[-1,1].forEach(s=>{x.beginPath();x.arc(cx+s*bw*.55,gy-7,7,0,7);x.fill()});if(lab){x.fillStyle='#fff';x.fillText(lab,cx,gy-14-bh/2+4)}};
  car(px(o.x),C('--acc'),o.x2?'m₁':'');if(o.x2!==undefined)car(px(o.x2),C('--red'),'m₂');
  if(o.F){const M=Math.max(...o.F.map(f=>Math.hypot(f[1],f[2]))),k=M?60/M:0,cx=px(o.x),cy=gy-14-bh/2;x.textAlign='left';
   o.F.forEach(f=>{if(f[1]||f[2])arrow(x,cx,cy,cx+f[1]*k,cy-f[2]*k,f[3],f[0])})}
  x.textAlign='left';
 }
 $('#ro').innerHTML=`<span>t = ${nf(T)} s</span><span>s = ${nf(o.x)} m</span><span>v = ${nf(o.v)} m/s</span><span>${o.p!==undefined?'p = '+nf(o.p)+' kg·m/s':'a = '+nf(o.a)+' m/s²'}</span>`;
 $('#live').innerHTML='<b>Slayder qiymatlari bilan:</b> '+q.res(p);
 // grafik
 const gc=$('#gr'),GW=gc.clientWidth,GH=gc.clientHeight;if(gc.width!=Math.round(GW*d)){gc.width=Math.round(GW*d);gc.height=Math.round(GH*d)}
 const y=gc.getContext('2d');y.setTransform(d,0,0,d,0,0);y.clearRect(0,0,GW,GH);y.font='12px sans-serif';
 const key=q.gr=='s'?'x':'v',N=60,vals=[];for(let k=0;k<=N;k++)vals.push(q.f(p,D*k/N)[key]);
 const vm=Math.max(...vals,1e-9),l=44,r=GW-12,tp=14,bt=GH-24,X=k=>l+(r-l)*k/N,Y=v=>bt-(bt-tp)*v/vm;
 y.strokeStyle=C('--mut');y.lineWidth=1.5;y.beginPath();y.moveTo(l,tp);y.lineTo(l,bt);y.lineTo(r,bt);y.stroke();
 y.fillStyle=C('--mut');y.fillText(q.gr=='s'?'s, m':'v, m/s',4,tp+4);y.fillText(nf(vm),4,tp+18);y.fillText('t, s',r-22,bt+16);y.fillText(nf(D),r-30,bt-6);
 y.strokeStyle=C('--acc');y.lineWidth=2.5;y.beginPath();vals.forEach((v,k)=>k?y.lineTo(X(k),Y(v)):y.moveTo(X(k),Y(v)));y.stroke();
 const kk=N*T/D;y.fillStyle=C('--red');y.beginPath();y.arc(X(kk),Y(o[key]),5,0,7);y.fill();
}
function tick(ts){if(run){const D=P[i].dur(p);T=Math.min(D,T+(ts-last)/1000*sp);if(T>=D)run=false;draw()}last=ts;requestAnimationFrame(tick)}
addEventListener('resize',draw);load(0);requestAnimationFrame(tick);
</script><script src="menu.js"></script> </body></body></html>
